            ]);
            const [heuristics, setHeuristics] = useState({
                ascentRate: 4.0, descentRate: 1.0, thresholdWindow: 1.0,
                aaaWindow: 6.0, aaaMinCount: 5,
                markers: { arrL0: '0h', doorsClose: 'i.@', doorsOpenL0: ' ha', intermediateDescent: 'Nh', moveSignal: 'AAA' }
            });

            // Sync playback time when play starts to prevent reset
            useEffect(() => {
                if (isPlaying) {
                    slots.forEach(s => {
                        currentTimesRef.current[s.id] = s.currentTime;
                    });
                    lastTimeRef.current = performance.now();
                }
            }, [isPlaying]);

            const createEmptySlot = (id) => ({
                id, fileName: null, logData: new LogDataset(null, [], [], [], 0), stats: { lines: 0, anchors: 0 }, duration: 0, currentTime: 0,
                liftState: { floor: 0, direction: 'STOPPED', moving: false, rawLine: '', matchedSignal: null, groundTruth: 'Waiting...', candidateFloor: null, candidateCount: 0 },
                liftPath: []
            });
            const [slots, setSlots] = useState([createEmptySlot(0), createEmptySlot(1), createEmptySlot(2)]);
            const [activeSlotId, setActiveSlotId] = useState(0);
            const [isLinked, setIsLinked] = useState(false);
            const [isAligned, setIsAligned] = useState(false);
            const [isPlaying, setIsPlaying] = useState(false);
            const [playbackSpeed, setPlaybackSpeed] = useState(1);

            const [showConfigModal, setShowConfigModal] = useState(false);
            const [configTab, setConfigTab] = useState('general');
            const [showPasteModal, setShowPasteModal] = useState(false);
            const [showPatternModal, setShowPatternModal] = useState(false);
            const pasteTextAreaRef = useRef(null);

            // Pattern State
            const [discoveredPatterns, setDiscoveredPatterns] = useState([]);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [patternConfig, setPatternConfig] = useState({ minLength: 2, minFreq: 3, strictMode: false });
            const [selectedPattern, setSelectedPattern] = useState(null);
            const [manualPattern, setManualPattern] = useState('');
            const [timeRanges, setTimeRanges] = useState([]); // Array of {start, end}
            const [zoomLevel, setZoomLevel] = useState(1);


            const animationRef = useRef();
            const lastTimeRef = useRef();
            const renderCountRef = useRef(0);
            const lastResetTimeRef = useRef(Date.now());

            // Increment render counter and detect infinite loops (reset every 5 seconds to allow sustained playback)
            renderCountRef.current++;
            const now = Date.now();
            if (now - lastResetTimeRef.current > 5000) {
                // Reset counter every 5 seconds during normal operation
                renderCountRef.current = 0;
                lastResetTimeRef.current = now;
            }
            if (renderCountRef.current > 1000) {
                // Only throw if we get 1000 renders in under 5 seconds (true infinite loop)
                console.error("DEBUG CRITICAL: Render count exceeded 1000 in 5 seconds! Stopping to prevent crash.");
                throw new Error("Infinite render loop detected - stopping to prevent browser crash");
            }

            const updateSlotState = (id, updates) => { setSlots(prev => prev.map(s => s.id === id ? { ...s, ...updates } : s)); };

            const displaySlots = useMemo(() => {
                console.log("DEBUG displaySlots: Recomputing. isAligned:", isAligned);
                return isAligned ? getAlignedSlots(slots) : slots;
            }, [slots, isAligned]);

            const activeSlot = slots.find(s => s.id === activeSlotId) || slots[0];

            // Compute liftState on-demand for the visualizer (replaces the removed useEffect)
            const activeSlotLiftState = useMemo(() => {
                if (!activeSlot || activeSlot.logData.isEmpty()) {
                    return activeSlot?.liftState || { floor: 0, direction: 'STOPPED', moving: false };
                }

                const tsArr = activeSlot.logData.timestamps;
                if (!tsArr || tsArr.length === 0) {
                    return activeSlot.liftState;
                }

                // Binary search for timestamp
                let l = 0, r = activeSlot.logData.length - 1;
                let idx = -1;

                while (l <= r) {
                    const m = (l + r) >> 1;
                    if (tsArr[m] >= activeSlot.currentTime) { idx = m; r = m - 1; }
                    else l = m + 1;
                }

                if (idx === -1) {
                    idx = tsArr.length - 1;
                }

                // Look up state in liftPath
                let currentFloor = 0;
                let isMoving = false;
                let direction = 'STOPPED';

                console.log("DEBUG activeSlotLiftState: liftPath length:", activeSlot.liftPath?.length || 0, "currentTime:", activeSlot.currentTime);

                if (activeSlot.liftPath && activeSlot.liftPath.length > 0) {
                    console.log("DEBUG activeSlotLiftState: First event at:", activeSlot.liftPath[0].timestamp, "Last event at:", activeSlot.liftPath[activeSlot.liftPath.length - 1].timestamp);
                    // 1. Find latest Floor and State by scanning backwards
                    let foundFloor = false;
                    let foundState = false;

                    for (let i = activeSlot.liftPath.length - 1; i >= 0; i--) {
                        const ev = activeSlot.liftPath[i];
                        if (ev.timestamp <= activeSlot.currentTime) {
                            if (!foundFloor && ev.type === 'FLOOR_UPDATE') {
                                currentFloor = ev.floor;
                                foundFloor = true;
                            }
                            if (!foundState && (ev.type === 'STATE_CHANGE' || ev.type === 'MOVE_START')) {
                                if (ev.type === 'STATE_CHANGE') isMoving = (ev.state === 'MOVING');
                                else isMoving = true; // MOVE_START
                                foundState = true;
                            }
                        }
                        if (foundFloor && foundState) break;
                    }

                    // 2. Infer Direction if Moving (Look ahead)
                    if (isMoving) {
                        direction = 'UP'; // Default
                        // Scan forward for next destination
                        for (let i = 0; i < activeSlot.liftPath.length; i++) {
                            const ev = activeSlot.liftPath[i];
                            if (ev.timestamp > activeSlot.currentTime && ev.type === 'FLOOR_UPDATE') {
                                if (ev.floor > currentFloor) direction = 'UP';
                                else if (ev.floor < currentFloor) direction = 'DOWN';
                                break;
                            }
                        }
                    } else {
                        direction = 'STOPPED';
                    }
                }

                console.log("DEBUG activeSlotLiftState: RESULT floor:", currentFloor, "direction:", direction, "moving:", isMoving);

                return {
                    ...activeSlot.liftState,
                    floor: currentFloor,
                    direction,
                    moving: isMoving,
                    doorsClosing: activeSlot.liftPath.some(e => e.type === 'DOOR_CLOSE' && Math.abs(e.timestamp - activeSlot.currentTime) < 1.0)
                };
            }, [activeSlot?.currentTime, activeSlot?.liftPath, activeSlot?.logData]);

            console.log("DEBUG: LiftAnalyzer Render. Active Slot:", activeSlotId);

            /* 
             * REMOVED: The useEffect that was calling setSlots based on currentTime
             * This was causing infinite re-renders because:
             * 1. Effect runs -> calls setSlots() 
             * 2. setSlots() creates new slots array reference
             * 3. Component re-renders -> effect runs again
             * 
             * Instead, liftState is now computed on-demand using useMemo (activeSlotLiftState).
             * This is the proper React pattern for derived state.
             */

            // Throttle state updates to prevent infinite re-renders
            const lastUpdateRef = useRef(0);
            const UPDATE_INTERVAL = 33; // Update React state at ~30fps for smooth playback
            const currentTimesRef = useRef({}); // Store current times in refs
            const slotsRef = useRef(slots); // Keep a ref to current slots
            slotsRef.current = slots; // Update ref on every render (doesn't cause re-render)

            const updateLoop = useCallback((timestamp) => {
                if (!lastTimeRef.current) lastTimeRef.current = timestamp;
                const delta = (timestamp - lastTimeRef.current) / 1000;
                lastTimeRef.current = timestamp;

                if (isPlaying) {
                    console.log("DEBUG updateLoop: isPlaying=true, delta:", delta.toFixed(3), "currentTimesRef:", JSON.stringify(currentTimesRef.current));
                    // Update times in ref (doesn't cause re-render)
                    slotsRef.current.forEach(slot => {
                        if (!slot.logData.isEmpty()) {
                            const current = currentTimesRef.current[slot.id] ?? slot.currentTime;
                            let nextTime = current + (delta * playbackSpeed);
                            if (nextTime >= slot.duration) nextTime = slot.duration;
                            currentTimesRef.current[slot.id] = nextTime;
                        }
                    });

                    // Only update React state periodically (throttled)
                    if (timestamp - lastUpdateRef.current >= UPDATE_INTERVAL) {
                        lastUpdateRef.current = timestamp;
                        setSlots(prev => prev.map(slot => {
                            const newTime = currentTimesRef.current[slot.id];
                            if (newTime !== undefined && Math.abs(newTime - slot.currentTime) > 0.01) {
                                return { ...slot, currentTime: newTime };
                            }
                            return slot;
                        }));
                    }
                }
                animationRef.current = requestAnimationFrame(updateLoop);
            }, [isPlaying, playbackSpeed]); // Removed slots - using slotsRef instead

            useEffect(() => {
                animationRef.current = requestAnimationFrame(updateLoop);
                return () => cancelAnimationFrame(animationRef.current);
            }, [updateLoop]);

            // --- PATTERN LOGIC ---
            const analyzeManualPattern = () => {
                if (!manualPattern || activeSlot.logData.isEmpty()) return;
                // Accumulate text
                let rawText = "";
                for (let i = 0; i < activeSlot.logData.length; i++) {
                    if (activeSlot.logData.types[i] === 0) rawText += activeSlot.logData.lines[i].raw + "\n";
                }

                let count = 0;
                let isValidRegex = true;

                try {
                    const re = new RegExp(manualPattern, 'g');
                    const matches = rawText.match(re);
                    count = matches ? matches.length : 0;
                } catch (e) {
                    alert("Invalid Regex: " + e.message);
                    isValidRegex = false;
                }

                if (isValidRegex) {
                    const score = (manualPattern.length * Math.log2(count > 0 ? count : 1)).toFixed(2);
                    setSelectedPattern({ sequence: manualPattern, length: manualPattern.length, count, score, isRegex: true });
                }
            };

            const runPatternDiscovery = () => {
                const activeSlots = slots.filter(s => s.logData.hasData());
                if (!activeSlots.length) return;
                setIsAnalyzing(true);
                setSelectedPattern(null);
                setTimeout(() => {
                    // MULTI-STREAM: Combine text from all active slots for global search
                    let rawText = "";
                    activeSlots.forEach(s => {
                        for (let i = 0; i < s.logData.length; i++) {
                            if (s.logData.types[i] === 0) rawText += s.logData.lines[i].raw + "\n";
                        }
                    });

                    const { minLength, minFreq } = patternConfig;
                    const len = rawText.length;
                    const results = new Map();
                    const countOccurrences = (sub) => {
                        if (!sub) return 0;
                        let count = 0, pos = rawText.indexOf(sub);
                        while (pos !== -1) { count++; pos = rawText.indexOf(sub, pos + 1); }
                        return count;
                    };

                    let candidates = new Set();
                    let currentLength = minLength;
                    // --- GENERATE CANDIDATES ---
                    // Strategy: Use text from ALL active slots.
                    if (manualPattern && manualPattern.trim().length > 0) {
                        candidates.add(manualPattern.trim());
                        currentLength = manualPattern.trim().length;
                    } else if (timeRanges.length > 0) {
                        // Gather text from IN ranges across ALL slots
                        // This involves timestamp checking
                        let inText = "";
                        activeSlots.forEach(s => {
                            for (let i = 0; i < s.logData.length; i++) {
                                if (s.logData.types[i] === 0) {
                                    const t = s.logData.timestamps[i];
                                    if (timeRanges.some(r => t >= r.start && t <= r.end)) {
                                        inText += s.logData.lines[i].raw + "\n";
                                    }
                                }
                            }
                        });

                        // Sample candidates to prevent freeze on long text
                        const MAX_CANDIDATES = 50000;
                        const step = Math.max(1, Math.floor(inText.length / MAX_CANDIDATES));
                        for (let i = 0; i <= inText.length - minLength; i += step) {
                            const sub = inText.substring(i, i + minLength);
                            if (!sub.includes('\n')) candidates.add(sub);
                            if (candidates.size >= MAX_CANDIDATES) break;
                        }
                    } else {
                        // Global search with sampling to prevent freeze on large files
                        const MAX_CANDIDATES = 50000;
                        const step = Math.max(1, Math.floor((len - minLength) / MAX_CANDIDATES));
                        for (let i = 0; i <= len - minLength; i += step) {
                            const sub = rawText.substring(i, i + minLength);
                            if (!sub.includes('\n')) candidates.add(sub);
                            if (candidates.size >= MAX_CANDIDATES) break;
                        }
                    }

                    // Pre-calculate texts for discriminative scoring
                    let discriminativeContext = null;
                    if (timeRanges.length > 0) {
                        const countInStr = (str, sub) => {
                            if (!sub) return 0;
                            let c = 0, p = str.indexOf(sub);
                            while (p !== -1) { c++; p = str.indexOf(sub, p + 1); }
                            return c;
                        };

                        discriminativeContext = {
                            countInStr,
                            slots: activeSlots.map(s => {
                                // Split text into In/Out
                                let inT = "", outT = "", lIn = 0, lOut = 0;
                                for (let i = 0; i < s.logData.length; i++) {
                                    if (s.logData.types[i] === 0) {
                                        const t = s.logData.timestamps[i];
                                        const isIn = timeRanges.some(r => t >= r.start && t <= r.end);
                                        if (isIn) { inT += s.logData.lines[i].raw + "\n"; lIn++; }
                                        else { outT += s.logData.lines[i].raw + "\n"; lOut++; }
                                    }
                                }
                                return {
                                    inText: inT,
                                    outText: outT,
                                    lenIn: Math.max(1, lIn),
                                    lenOut: Math.max(1, lOut)
                                };
                            })
                        };
                    }

                    let iterations = 0;
                    const MAX_ITERATIONS = 10; // Limit growth iterations
                    const MAX_CANDIDATES_PER_ITERATION = 5000;

                    while (candidates.size > 0 && currentLength < 40 && iterations < MAX_ITERATIONS) {
                        iterations++;
                        const nextGen = new Set();
                        // Limit candidates per iteration to prevent freeze
                        let processed = 0;
                        for (const cand of candidates) {
                            if (processed++ >= MAX_CANDIDATES_PER_ITERATION) break;
                            const count = countOccurrences(cand);

                            // SCORING
                            let score = 0;
                            if (discriminativeContext) {
                                let totalCountIn = 0;
                                let totalCountOut = 0;
                                let totalLenIn = 0;
                                let totalLenOut = 0;
                                let strictValid = true;

                                for (const ctx of discriminativeContext.slots) {
                                    const cIn = discriminativeContext.countInStr(ctx.inText, cand);
                                    const cOut = discriminativeContext.countInStr(ctx.outText, cand);

                                    totalCountIn += cIn;
                                    totalCountOut += cOut;
                                    totalLenIn += ctx.lenIn;
                                    totalLenOut += ctx.lenOut;

                                    if (cIn === 0 || cOut > 0) strictValid = false;
                                }

                                if (patternConfig.strictMode) {
                                    if (strictValid) {
                                        score = 100 + totalCountIn;
                                    } else {
                                        score = -1;
                                    }
                                } else {
                                    // Standard Multi-Stream Scoring
                                    // Aggregate Densities
                                    const densityIn = totalCountIn / Math.max(1, totalLenIn);
                                    const densityOut = totalCountOut / Math.max(1, totalLenOut);
                                    score = parseFloat((densityIn / (densityOut + 0.0001)).toFixed(2));
                                }
                            } else {
                                score = parseFloat((cand.length * Math.log2(count)).toFixed(2));
                            }

                            if (score >= 0 && count >= minFreq) {
                                results.set(cand, { count, score }); // Store object
                                let pos = rawText.indexOf(cand);
                                while (pos !== -1 && pos + currentLength < len) {
                                    const nextChar = rawText[pos + currentLength];
                                    if (nextChar !== '\n') nextGen.add(cand + nextChar);
                                    pos = rawText.indexOf(cand, pos + 1);
                                }
                            }
                        }
                        candidates = nextGen;
                        currentLength++;
                    }

                    const finalPatterns = [];
                    results.forEach((meta, pattern) => {
                        let isRedundant = false;
                        for (const [otherPat, otherMeta] of results) {
                            if (otherPat.length > pattern.length && otherPat.includes(pattern) && otherMeta.count === meta.count) { isRedundant = true; break; }
                        }
                        if (/^[-=~]+$/.test(pattern)) isRedundant = true;

                        if (!isRedundant) {
                            finalPatterns.push({ sequence: pattern, length: pattern.length, count: meta.count, score: meta.score });
                        }
                    });

                    setDiscoveredPatterns(finalPatterns.sort((a, b) => b.score - a.score).slice(0, 50));
                    setIsAnalyzing(false);
                }, 100);
            };

            const handleFileUpload = (e, slotId) => {
                const file = e.target.files[0];
                if (!file) return;

                const HYBRID_THRESHOLD = 2 * 1024 * 1024; // 2MB

                if (file.size < HYBRID_THRESHOLD) {
                    console.log("DEBUG: Fast Path selected for", file.name, "Size:", file.size);
                    // FAST PATH: Synchronous Load
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        console.log("DEBUG: File Read Complete");
                        try {
                            const { data, index, events, duration, noise } = parseLogFileSynchronous(ev.target.result);
                            console.log("DEBUG: Parse Complete. Data:", data.length, "Duration:", duration);

                            // Pass 'data' (the array of lines) as preParsedLines to LogDataset
                            const ds = new LogDataset(file, index, events, noise, duration, data);
                            console.log("DEBUG: Dataset created. Timestamps:", ds.timestamps.length);

                            updateSlotState(slotId, {
                                fileName: file.name,
                                logData: ds,
                                stats: { lines: data.length, anchors: index.length },
                                duration,
                                calls: events.filter(e => e.type === 'FLOOR_UPDATE' || (e.type === 'EVENT' && (e.reason.includes('Floor') || e.reason.includes('CALLING')))).map(e => {
                                    if (e.floor !== undefined) return e;
                                    const m = e.reason.match(/Level\s+(\d+)/);
                                    return { ...e, floor: m ? parseInt(m[1]) : '?' };
                                }),
                                currentTime: 0,
                                liftState: createEmptySlot(slotId).liftState
                            });
                            setActiveSlotId(slotId);
                        } catch (err) {
                            console.error("DEBUG: Critical Error in Fast Path:", err);
                        }
                    };
                    reader.readAsText(file);

                } else {
                    // SLOW PATH: Streaming Upload
                    scanLogFile(file).then(({ index, events, duration, noise, linesCount }) => {
                        const ds = new LogDataset(file, index, events, noise, duration);
                        ds.length = linesCount; // Set compatibility length

                        updateSlotState(slotId, {
                            fileName: file.name,
                            logData: ds,
                            stats: { lines: linesCount, anchors: index.length },
                            duration,
                            calls: events.filter(e => e.type === 'FLOOR_UPDATE' || (e.type === 'EVENT' && (e.reason.includes('Floor') || e.reason.includes('CALLING')))).map(e => {
                                if (e.floor !== undefined) return e;
                                const m = e.reason.match(/Level\s+(\d+)/);
                                return { ...e, floor: m ? parseInt(m[1]) : '?' };
                            }),
                            currentTime: 0,
                            liftState: createEmptySlot(slotId).liftState
                        });
                        setActiveSlotId(slotId);
                    });
                }
            };

            const handlePaste = (text) => {
                parseLogContentAsync(text).then(({ data, stats, duration, calls }) => {
                    updateSlotState(activeSlotId, { fileName: "Pasted Data", logData: data, stats, duration, calls, currentTime: 0, liftState: createEmptySlot(activeSlotId).liftState });
                });
            }

            return (
                <div className="flex flex-col h-screen bg-gray-900 text-gray-100 font-mono overflow-hidden">
                    <div className="p-2 sm:p-4 bg-gray-800 border-b border-gray-700 flex flex-wrap justify-between items-center shadow-md z-10 gap-2">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-blue-600 rounded-lg hidden sm:block"><Activity /></div>
                            <h1 className="text-lg sm:text-xl font-bold tracking-tight text-white flex items-center gap-2">Lift Inspector <span className="text-xs bg-gray-700 px-2 py-0.5 rounded text-gray-400 font-normal">Multi</span></h1>
                        </div>

                        <div className="flex items-center gap-2 bg-gray-900/50 p-1 rounded-lg border border-gray-700">
                            {slots.map(slot => (
                                <label key={slot.id} className={`flex items-center justify-center w-8 h-8 rounded cursor-pointer transition-all border ${slot.logData.hasData() ? 'bg-blue-900/40 border-blue-500 text-blue-400' : 'bg-gray-800 border-gray-700 text-gray-600'} ${activeSlotId === slot.id ? 'ring-2 ring-blue-400' : ''}`} onClick={() => setActiveSlotId(slot.id)}>
                                    {slot.logData.hasData() ? <span className="text-xs font-bold">{slot.id + 1}</span> : <Upload size={14} />}
                                    <input type="file" onChange={(e) => handleFileUpload(e, slot.id)} className="hidden" accept=".txt,.log" />
                                </label>
                            ))}
                            <div className="w-px h-6 bg-gray-700 mx-1"></div>
                            <div className="w-px h-6 bg-gray-700 mx-1"></div>
                            <button onClick={() => setIsLinked(!isLinked)} className={`p-1.5 rounded border ${isLinked ? 'bg-purple-900 text-purple-400 border-purple-500' : 'bg-gray-800 text-gray-500 border-gray-700'}`} title="Link Scroll"><LinkIcon size={16} /></button>
                            <button onClick={() => setIsAligned(!isAligned)} className={`p-1.5 rounded border ${isAligned ? 'bg-green-900 text-green-400 border-green-500' : 'bg-gray-800 text-gray-500 border-gray-700'}`} title="Align Padding"><AlignJustify size={16} /></button>
                        </div>

                        <div className="flex items-center gap-2">
                            <button onClick={() => { setShowPatternModal(true); if (discoveredPatterns.length === 0) runPatternDiscovery(); }} className="flex items-center gap-2 bg-yellow-900/50 hover:bg-yellow-800/50 text-yellow-200 px-3 py-2 rounded-md border border-yellow-700/50"><Sparkles size={16} /><span className="hidden sm:inline">Patterns</span></button>
                            <button onClick={() => { console.log("DEBUG: Play button clicked! isPlaying was:", isPlaying, "-> now:", !isPlaying); setIsPlaying(!isPlaying); }} className={`w-10 h-10 rounded-full flex items-center justify-center shadow-lg ${isPlaying ? 'bg-red-600' : 'bg-blue-600'}`}>{isPlaying ? <Pause size={18} fill="currentColor" /> : <Play size={18} fill="currentColor" className="ml-1" />}</button>
                            <button onClick={() => setShowConfigModal(true)} className="p-2 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700"><Settings size={18} /></button>
                            <button onClick={() => setShowPasteModal(true)} className="p-2 bg-gray-800 hover:bg-gray-700 rounded border border-gray-700"><FileText size={18} /></button>
                        </div>
                    </div>

                    {showPatternModal && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-gray-800 rounded-lg p-0 w-full max-w-4xl border border-gray-700 shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="p-6 border-b border-gray-700 flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2"><Sparkles size={20} className="text-yellow-400" /> Pattern Discovery <span className="text-xs text-gray-500 font-normal ml-2">Active Slot Data</span></h2>
                                    <div className="flex items-center gap-4">
                                        <div className="flex items-center gap-2 bg-gray-900/50 px-2 py-1 rounded border border-gray-700">
                                            <span className="text-xs text-gray-400">Zoom:</span>
                                            <input type="range" min="1" max="10" step="0.5" value={zoomLevel} onChange={(e) => setZoomLevel(parseFloat(e.target.value))} className="w-24 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer" />
                                            <span className="text-xs w-8 text-right font-mono">{zoomLevel}x</span>
                                        </div>
                                        {timeRanges.length > 0 && <span className="text-xs text-green-400 font-mono">{timeRanges.length} Ranges</span>}
                                        <button onClick={() => { setTimeRanges([]); setDiscoveredPatterns([]); }} className="text-xs text-gray-400 hover:text-red-400 mr-4 disabled:opacity-50" disabled={timeRanges.length === 0}>Clear Ranges</button>
                                        <button onClick={() => setShowPatternModal(false)} className="text-gray-400 hover:text-white"><X size={24} /></button>
                                    </div>
                                </div>
                                <div className="p-4 bg-gray-900 border-b border-gray-800">
                                    <div className="max-h-[40vh] overflow-y-auto pr-2 space-y-4 mb-4 border-b border-gray-800 pb-4 custom-scrollbar">
                                        {slots.filter(s => s.logData.hasData()).map((slot, idx) => (
                                            <div key={slot.id}>
                                                <div className="flex justify-between items-center text-xs mb-1">
                                                    <span className="font-bold text-gray-400">Slot {slot.id + 1} <span className="text-gray-600 font-normal">{slot.fileName}</span></span>
                                                    {slot.id === activeSlotId && <span className="bg-blue-900/50 text-blue-400 px-1.5 rounded text-[10px]">Active</span>}
                                                </div>
                                                <TimelinePlot pattern={selectedPattern} data={slot.logData} duration={slot.duration} selectedRanges={timeRanges} onRangeSelect={setTimeRanges} calls={slot.calls} zoom={zoomLevel} />
                                            </div>
                                        ))}
                                    </div>

                                    {/* MANUAL PATTERN INPUT RESTORED */}
                                    <div className="flex gap-2 mb-4 border-b border-gray-700 pb-4">
                                        <input type="text" value={manualPattern} onChange={(e) => setManualPattern(e.target.value)} placeholder="Enter manual pattern..." className="flex-1 bg-gray-900 border border-gray-600 rounded px-3 py-2 text-sm text-white font-mono" />
                                        <button onClick={analyzeManualPattern} className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-bold">Check Pattern</button>
                                    </div>

                                    <div className="flex gap-4 items-center">
                                        <span className="text-xs text-gray-400">Min Length:</span>
                                        <input type="number" min="2" value={patternConfig.minLength} onChange={(e) => setPatternConfig({ ...patternConfig, minLength: parseInt(e.target.value) })} className="w-12 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm text-white" />
                                        <span className="text-xs text-gray-400">Min Freq:</span>
                                        <input type="number" min="2" value={patternConfig.minFreq} onChange={(e) => setPatternConfig({ ...patternConfig, minFreq: parseInt(e.target.value) })} className="w-12 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm text-white" />

                                        {timeRanges.length > 0 && (
                                            <label className="flex items-center gap-1 text-xs text-gray-400 select-none cursor-pointer">
                                                <input type="checkbox" checked={patternConfig.strictMode} onChange={(e) => setPatternConfig({ ...patternConfig, strictMode: e.target.checked })} className="rounded bg-gray-800 border-gray-600 text-blue-600" />
                                                Strict Mode (Multi-Stream)
                                            </label>
                                        )}

                                        <button onClick={runPatternDiscovery} className="px-4 py-1 bg-blue-600 hover:bg-blue-500 text-white text-xs rounded font-bold ml-auto flex items-center gap-2">{isAnalyzing ? "Analyzing..." : "Auto-Find"}</button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-0">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-gray-900 text-xs text-gray-500 uppercase sticky top-0"><tr><th className="p-3">#</th><th className="p-3">Pattern Sequence</th><th className="p-3 text-right">Len</th><th className="p-3 text-right">Freq</th><th className="p-3 text-right">Score</th><th className="p-3 text-right">Action</th></tr></thead>
                                        <tbody>
                                            {discoveredPatterns.map((pat, i) => (
                                                <tr key={i} className={`border-b border-gray-800 hover:bg-gray-700/50 cursor-pointer ${selectedPattern === pat ? 'bg-blue-900/30' : ''}`} onClick={() => setSelectedPattern(pat)}>
                                                    <td className="p-3 text-gray-500 text-xs">{i + 1}</td>
                                                    <td className="p-3 font-mono text-green-400 break-all text-xs">{pat.sequence}</td>
                                                    <td className="p-3 text-gray-400 text-right text-xs">{pat.length}</td>
                                                    <td className="p-3 text-gray-400 text-right text-xs">{pat.count}</td>
                                                    <td className="p-3 text-blue-400 font-bold text-right text-xs">{pat.score}</td>
                                                    <td className="p-3 text-right"><button onClick={(e) => { e.stopPropagation(); setSelectedPattern(pat) }} className="text-blue-400 hover:text-white"><Eye size={14} /></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {discoveredPatterns.length === 0 && <div className="p-8 text-center text-gray-500 italic">No patterns found yet. Click "Auto-Find".</div>}
                                </div>
                            </div>
                        </div>
                    )}

                    {showPasteModal && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-gray-800 rounded-lg p-6 w-full max-w-2xl border border-gray-700 shadow-2xl relative">
                                <div className="flex justify-between items-start mb-4"><h2 className="text-lg font-bold text-white flex items-center gap-2"><FileText size={20} className="text-blue-400" /> Paste to Slot {activeSlotId + 1}</h2><button onClick={() => setShowPasteModal(false)} className="text-gray-400 hover:text-white"><X size={24} /></button></div>
                                <textarea ref={pasteTextAreaRef} className="w-full h-64 bg-gray-900 border border-gray-700 rounded p-4 text-xs font-mono text-gray-300 focus:outline-none focus:border-blue-500 mb-2 resize-none" placeholder="Paste content here..." autoFocus />
                                <div className="flex justify-end gap-3 mt-4">
                                    <button onClick={() => setShowPasteModal(false)} className="px-4 py-2 text-sm text-gray-400 border border-gray-700 rounded">Cancel</button>
                                    <button onClick={() => { if (pasteTextAreaRef.current?.value) { handlePaste(pasteTextAreaRef.current.value); setShowPasteModal(false); } }} className="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-bold shadow-lg">Analyze</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showConfigModal && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-gray-800 rounded-lg p-0 w-full max-w-2xl border border-gray-700 shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="p-4 border-b border-gray-700 flex justify-between items-center">
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2"><Settings size={20} className="text-purple-400" /> Configuration</h2>
                                    <button onClick={() => setShowConfigModal(false)} className="text-gray-400 hover:text-white"><X size={24} /></button>
                                </div>
                                <div className="flex bg-gray-900 border-b border-gray-700">
                                    {['general', 'timing', 'heuristics'].map(tab => (
                                        <button key={tab} onClick={() => setConfigTab(tab)} className={`px-4 py-2 text-sm font-bold capitalize ${configTab === tab ? 'text-purple-400 border-b-2 border-purple-500 bg-gray-800' : 'text-gray-500 hover:text-gray-300'}`}>{tab}</button>
                                    ))}
                                </div>
                                <div className="p-6 overflow-y-auto custom-scrollbar flex-1">
                                    {configTab === 'general' && (
                                        <div className="space-y-4">
                                            <div className="grid grid-cols-4 items-center gap-4"><label className="text-xs text-gray-400 col-span-1 text-right">Confidence:</label><input type="number" min="1" max="20" value={config.threshold} onChange={(e) => setConfig({ ...config, threshold: parseInt(e.target.value) || 1 })} className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white col-span-1" /><span className="text-xs text-gray-500 col-span-2">Consecutive matches (Display Only)</span></div>
                                            <div className="grid grid-cols-4 items-center gap-4"><label className="text-xs text-gray-400 col-span-1 text-right">Speed:</label><select value={playbackSpeed} onChange={(e) => setPlaybackSpeed(parseFloat(e.target.value))} className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white col-span-1"><option value={0.1}>0.1x</option><option value={0.5}>0.5x</option><option value={1}>1.0x</option><option value={2}>2.0x</option><option value={5}>5.0x</option><option value={10}>10x</option></select></div>
                                            <div className="p-2 bg-blue-900/20 text-blue-200 text-xs rounded border border-blue-800 mt-4">Legacy Regex Config (Only used for display matching, not state logic)</div>
                                            <hr className="border-gray-700 my-2" />
                                            {['L0', 'L1', 'L2', 'L3', 'Moving'].map((key) => (<div key={key} className="grid grid-cols-4 items-center gap-4"><label className="text-xs text-gray-400 col-span-1 text-right font-bold">{key}:</label><input type="text" value={config[key] || ''} onChange={(e) => setConfig({ ...config, [key]: e.target.value })} className="bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-green-400 font-mono col-span-3 opacity-50" /></div>))}
                                        </div>
                                    )}
                                    {configTab === 'timing' && (
                                        <div className="space-y-4">
                                            <table className="w-full text-left text-xs text-gray-400 border-collapse">
                                                <thead><tr className="border-b border-gray-700"><th className="p-2">From</th><th className="p-2">To</th><th className="p-2">Seconds</th><th className="p-2">Note</th><th className="p-2"></th></tr></thead>
                                                <tbody>
                                                    {timingTable.map((row, idx) => (
                                                        <tr key={idx} className="border-b border-gray-800 hover:bg-gray-700/50">
                                                            <td className="p-1"><input type="number" value={row.from} onChange={(e) => { const n = [...timingTable]; n[idx].from = parseInt(e.target.value); setTimingTable(n); }} className="w-10 bg-transparent text-center border-b border-gray-700 focus:border-purple-500" /></td>
                                                            <td className="p-1"><input type="number" value={row.to} onChange={(e) => { const n = [...timingTable]; n[idx].to = parseInt(e.target.value); setTimingTable(n); }} className="w-10 bg-transparent text-center border-b border-gray-700 focus:border-purple-500" /></td>
                                                            <td className="p-1"><input type="number" step="0.01" value={row.time} onChange={(e) => { const n = [...timingTable]; n[idx].time = parseFloat(e.target.value); setTimingTable(n); }} className="w-16 bg-transparent text-center border-b border-gray-700 focus:border-purple-500" /></td>
                                                            <td className="p-1"><input type="text" value={row.note || ''} onChange={(e) => { const n = [...timingTable]; n[idx].note = e.target.value; setTimingTable(n); }} className="w-full bg-transparent border-b border-gray-700 focus:border-purple-500" /></td>
                                                            <td className="p-1"><button onClick={() => setTimingTable(prev => prev.filter((_, i) => i !== idx))} className="text-red-500 hover:text-red-400"><X size={14} /></button></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            <button onClick={() => setTimingTable([...timingTable, { from: 0, to: 0, time: 0, note: "New" }])} className="w-full py-1 border border-dashed border-gray-600 rounded text-xs text-gray-400 hover:text-white hover:border-gray-500">+ Add Row</button>
                                        </div>
                                    )}
                                    {configTab === 'heuristics' && (
                                        <div className="space-y-4">
                                            <div className="p-2 bg-yellow-900/20 text-yellow-200 text-xs rounded border border-yellow-800 mb-4">Regex Markers & Rates for advanced state analysis.</div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="text-xs text-gray-500 block mb-1">Ascent Rate (AAA/sec)</label><input type="number" step="0.1" value={heuristics.ascentRate} onChange={(e) => setHeuristics({ ...heuristics, ascentRate: parseFloat(e.target.value) })} className="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm" /></div>
                                                <div><label className="text-xs text-gray-500 block mb-1">Descent Rate (AAA/sec)</label><input type="number" step="0.1" value={heuristics.descentRate} onChange={(e) => setHeuristics({ ...heuristics, descentRate: parseFloat(e.target.value) })} className="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm" /></div>
                                                <div><label className="text-xs text-gray-500 block mb-1">Window Size (sec)</label><input type="number" step="0.1" value={heuristics.thresholdWindow} onChange={(e) => setHeuristics({ ...heuristics, thresholdWindow: parseFloat(e.target.value) })} className="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm" /></div>
                                            </div>
                                            <hr className="border-gray-700 my-2" />
                                            <h3 className="text-xs font-bold text-gray-400 mb-2">Absolute Event Markers (Regex)</h3>
                                            {Object.entries(heuristics.markers).map(([key, val]) => (
                                                <div key={key} className="grid grid-cols-3 gap-2 items-center mb-2">
                                                    <label className="text-[10px] text-gray-500 col-span-1 truncate" title={key}>{key}:</label>
                                                    <input type="text" value={val} onChange={(e) => setHeuristics({ ...heuristics, markers: { ...heuristics.markers, [key]: e.target.value } })} className="col-span-2 bg-gray-900 border border-gray-600 rounded px-2 py-1 text-xs font-mono text-green-400" />
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 border-t border-gray-700 flex justify-end">
                                    <button onClick={() => setShowConfigModal(false)} className="px-6 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded text-sm font-bold shadow-lg transition-colors">Apply & Analyze</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex overflow-hidden">
                        <div className="w-16 sm:w-24 md:w-64 bg-gray-900 border-r border-gray-800 p-2 sm:p-6 flex flex-col items-center relative transition-all hidden md:flex">
                            <div className="absolute inset-y-10 w-32 bg-gray-800/30 rounded-lg border border-gray-700/30 flex flex-col justify-between py-4 pointer-events-none">{[3, 2, 1, 0].map(level => (<div key={level} className="w-full text-center text-gray-600 text-sm border-t border-dashed border-gray-700/50 pt-1">L{level}</div>))}</div>
                            <div className="w-16 h-16 sm:w-24 sm:h-24 bg-blue-600 rounded-lg shadow-[0_0_20px_rgba(37,99,235,0.5)] z-10 flex items-center justify-center transition-all duration-500 ease-in-out border-2 border-blue-400" style={{ transform: `translateY(${(3 - activeSlotLiftState.floor) * 80 - 64}px)` }}><span className="text-2xl sm:text-4xl font-bold text-white">{activeSlotLiftState.floor}</span></div>
                            <div className="absolute top-10 right-4 sm:right-10 flex flex-col gap-2"><ArrowUp className={`w-8 h-8 sm:w-12 sm:h-12 transition-opacity ${activeSlotLiftState.direction === 'UP' ? 'text-green-400 opacity-100' : 'text-gray-800 opacity-20'}`} /><ArrowDown className={`w-8 h-8 sm:w-12 sm:h-12 transition-opacity ${activeSlotLiftState.direction === 'DOWN' ? 'text-red-400 opacity-100' : 'text-gray-800 opacity-20'}`} /></div>
                            {/* Doors Closing Indicator */}
                            <div className={`absolute top-28 right-4 sm:right-10 transition-opacity duration-300 ${activeSlotLiftState.doorsClosing ? 'opacity-100' : 'opacity-0'}`}>
                                <div className="px-2 py-1 bg-yellow-600/80 text-white text-[10px] font-bold rounded uppercase tracking-wider animate-pulse">Doors Closing</div>
                            </div>
                            <div className="absolute bottom-6 w-full px-2 sm:px-6 pointer-events-none"><div className="bg-gray-800 rounded-lg p-3 border border-gray-700 shadow-lg text-center"><div className="text-[10px] text-gray-400 uppercase mb-1">Visualizing</div><div className="text-xs font-bold text-blue-300 truncate">{activeSlot.fileName || `Slot ${activeSlotId + 1}`}</div></div></div>
                        </div>

                        <div className={`flex-1 grid gap-0 divide-x divide-gray-800 overflow-hidden ${slots.filter(s => s.logData.hasData()).length >= 2 ? (slots.filter(s => s.logData.hasData()).length === 2 ? 'grid-cols-2' : 'grid-cols-3') : 'grid-cols-1'}`}>
                            {displaySlots.map(slot => {
                                const hasData = slot.logData.hasData();
                                const activeCount = slots.filter(s => s.logData.hasData()).length;
                                if (!hasData && activeCount > 0) return null;
                                if (!hasData && slot.id !== 0) return null;
                                return (<StreamColumn key={slot.id} slot={slot}
                                    onTimeChange={(id, t) => {
                                        if (isPlaying) setIsPlaying(false);
                                        if (isLinked) setSlots(prev => prev.map(s => ({ ...s, currentTime: Math.min(t, s.duration) })));
                                        else { updateSlotState(id, { currentTime: t }); setActiveSlotId(id); }
                                    }}
                                    onScroll={(id, dir) => {
                                        if (isPlaying) setIsPlaying(false);
                                        const slotState = slots.find(s => s.id === id);

                                        // Time-based scroll: Move 0.1s per tick?
                                        let newTime = slotState.currentTime + (dir * 0.1);
                                        newTime = Math.max(0, Math.min(newTime, slotState.duration));

                                        if (isLinked) setSlots(prev => prev.map(s => ({ ...s, currentTime: newTime })));
                                        else { updateSlotState(id, { currentTime: newTime }); setActiveSlotId(id); }
                                    }}
                                    isActive={activeSlotId === slot.id}
                                    onClick={() => setActiveSlotId(slot.id)}
                                    config={config}
                                    onClear={(id) => createEmptySlot(id).logData && setSlots(prev => prev.map(s => s.id === id ? createEmptySlot(id) : s))}
                                    isLinked={isLinked}
                                    onAnalyze={(id) => {
                                        const slotState = slots.find(s => s.id === id);
                                        if (!slotState || !slotState.logData || slotState.logData.isEmpty()) return;
                                        console.log("DEBUG: Manual Trigger Analysis for Slot", id);
                                        analyzeLiftPath(slotState.logData, timingTable, heuristics).then(events => {
                                            console.log("DEBUG: Analysis Done slot", id, "Events:", events.length);
                                            setSlots(prev => prev.map(s => s.id === id ? { ...s, liftPath: events } : s));
                                        });
                                    }}
                                />);
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LiftAnalyzer />);
    </script>
</body>

</html>
