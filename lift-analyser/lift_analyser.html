        // --- ICONS (Inlined) ---

        const Unlink = (props) => <IconBase {...props}><path d="M18.84 12.25l1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-5.54-.38l.96.96 1.13-1.13a3 3 0 0 1 4.24 4.24l-3 3a3 3 0 0 1-3.68.51l-1.07-1.07"></path><path d="M5.16 11.75l-1.71 1.71A5 5 0 0 0 10.5 20.5a5.006 5.006 0 0 0 5.48-1.57l-.96-.96-1.13 1.13a3 3 0 0 1-4.24-4.24l3-3a3 3 0 0 1 3.75-.48l1.07 1.07"></path><line x1="2" y1="2" x2="22" y2="22"></line></IconBase>;
        const XCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></IconBase>;
        const PlayCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></IconBase>;
        const AlignJustify = (props) => <IconBase {...props}><line x1="21" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="3" y2="18"></line></IconBase>;

        // --- DATA STRUCTURES (Structure of Arrays) ---
        const TYPE_DATA = 0;
        const TYPE_EVENT = 1;
        const TYPE_NOISE = 2;
        const TYPE_SEPARATOR = 3;
        const TYPE_SPACER = 4;

        class LogDataset {
            constructor(file, index, events, noise, duration, preParsedLines = null) {
                this.file = file;           // The File/Blob object
                this.index = index;         // Array of { time, offset } for sparse navigation
                this.events = events || [];       // Array of { time, type, floor, reason }
                this.noise = noise || [];         // Array of { time, val } (downsampled)
                this.duration = duration || 0;

                // Compatibility for LiftAnalyzer checks
                this.preParsedLines = preParsedLines;
                this.lines = preParsedLines || []; // Restoration of critical property
                this.length = preParsedLines ? preParsedLines.length : 0;
                // Optimized: Populate SoA arrays for fast lookups if in-memory
                if (preParsedLines) {
                    this.timestamps = preParsedLines.map(l => l.timestamp);
                    this.types = preParsedLines.map(l => l.isData ? 0 : 1); // Simplified types
                } else {
                    this.timestamps = [];
                    this.types = [];
                }
            }

            // Helper method to check if dataset has data
            isEmpty() {
                return !this.file && (!this.preParsedLines || this.preParsedLines.length === 0);
            }

            hasData() {
                return !this.isEmpty();
            }

            // fetchWindow: Returns a Promise resolving to parsed lines for a time window CENTERED around centerTime
            async fetchWindow(centerTime, windowDuration = 2.0) {
                const halfWindow = windowDuration / 2;
                const startTime = Math.max(0, centerTime - halfWindow);
                const endTime = centerTime + halfWindow;
                console.log("DEBUG fetchWindow: Called with centerTime:", centerTime, "window:", startTime, "-", endTime);

                if (this.preParsedLines) {
                    // Fast Path: In-memory filter - get lines AROUND the center time
                    const result = this.preParsedLines.filter(l => l.timestamp >= startTime && l.timestamp <= endTime);
                    console.log("DEBUG fetchWindow: Fast path returned", result.length, "lines");
                    return result;
                }

                if (!this.file || !this.index || this.index.length === 0) return [];

                // 1. Find byte range via Index
                // Binary search for startTime in Index
                // Index entries are { time, offset }
                let l = 0, r = this.index.length - 1;
                let idx = 0;
                while (l <= r) {
                    const m = (l + r) >> 1;
                    if (this.index[m].time < startTime) { idx = m; l = m + 1; }
                    else r = m - 1;
                }

                // Define Byte Range
                const startOffset = this.index[idx].offset;

                // Find end offset using endTime (not startTime + windowDuration)
                let l2 = idx, r2 = this.index.length - 1;
                let idx2 = this.index.length - 1;
                while (l2 <= r2) {
                    const m = (l2 + r2) >> 1;
                    if (this.index[m].time < endTime) { idx2 = m; l2 = m + 1; }
                    else r2 = m - 1;
                }
                // Read a bit beyond to ensure we cover lines
                idx2 = Math.min(this.index.length - 1, idx2 + 1);

                let endOffset = this.index[idx2].offset;
                // Minimum read size 64KB
                if (endOffset - startOffset < 65536) endOffset = startOffset + 65536;
                endOffset = Math.min(endOffset, this.file.size);

                // READ
                const blob = this.file.slice(startOffset, endOffset);
                const text = await blob.text();

                // PARSE
                const lines = text.split(/\r?\n/);
                const parsed = [];

                // We assume startOffset aligns with a line start because our Indexer ensures it.
                // However, the first line might be partial if we are arbitrary.
                // But scanLogFile pushes offsets of valid lines.

                for (let raw of lines) {
                    const clean = raw.trim();
                    if (!clean) continue;
                    // Parse T=
                    const tMatch = clean.match(/T\s*=\s*([0-9.]+)\s*s/i);
                    let t = tMatch ? parseFloat(tMatch[1]) : null;

                    // Simple logic
                    parsed.push({
                        raw: clean,
                        timestamp: t,
                        isData: clean.length > 3 && !clean.startsWith('EVENT') && !clean.startsWith('NOISE')
                    });
                }

                return parsed;
            }
        }

        // --- SCANNERS ---
        const scanLogFile = (file, onProgress) => {
            return new Promise((resolve, reject) => {
                const CHUNK_SIZE = 512 * 1024; // 512KB chunks
                const size = file.size;
                let offset = 0;

                const index = [{ time: 0, offset: 0 }];
                const events = [];
                const noise = [];
                let linesCount = 0;

                let lastTime = 0;
                let buffer = "";

                // We use FileReader to read as text to keep it simple.
                // V8 FileReader is very fast.
                const reader = new FileReader();

                // Iterative Reader
                const readNext = () => {
                    if (offset >= size) {
                        resolve({ index, events, duration: lastTime, noise, linesCount });
                        return;
                    }

                    const end = Math.min(offset + CHUNK_SIZE, size);
                    const blob = file.slice(offset, end);
                    reader.readAsText(blob);
                };

                reader.onload = (e) => {
                    const chunk = e.target.result;
                    const fullText = buffer + chunk;

                    // Handle buffer boundaries
                    const lastNewline = fullText.lastIndexOf('\n');
                    let processText = "";

                    if (lastNewline !== -1) {
                        processText = fullText.substring(0, lastNewline);
                        buffer = fullText.substring(lastNewline + 1);
                    } else {
                        buffer = fullText;
                        if (offset + CHUNK_SIZE >= size) { // EOF
                            processText = buffer;
                            buffer = "";
                        }
                    }

                    if (processText) {
                        // Count lines in this chunk
                        let count = 0;
                        for (let i = 0; i < processText.length; i++) {
                            if (processText[i] === '\n') count++;
                        }
                        linesCount += count;
                    }

                    // Extract Info
                    const chunkLines = processText.split(/\r?\n/);
                    let foundTimeInChunk = false;

                    chunkLines.forEach(l => {
                        const tMatch = l.match(/T\s*=\s*([0-9.]+)\s*s/i);
                        if (tMatch) {
                            const t = parseFloat(tMatch[1]);
                            if (t > lastTime + 1.0) { // Index every 1.0s or so
                                // Store the CHUNK offset, not exact line offset
                                index.push({ time: t, offset: offset }); // Map to start of this chunk
                                lastTime = t;
                            }
                            // Keep max time
                            if (t > lastTime) lastTime = t;
                        }

                        if (l.includes('EVENT:')) {
                            const m = l.match(/EVENT: (.*?) \|/);
                            if (m) events.push({ time: lastTime, type: 'EVENT', reason: m[1] });
                        }
                    });

                    offset += CHUNK_SIZE;
                    if (onProgress) onProgress(Math.min(100, (offset / size) * 100));

                    // Next
                    readNext();
                };

                reader.onerror = reject;
                readNext();
            });
        };

        const renderHighlightedText = (text, isCurrent, config) => {
            if (!isCurrent || !text) return text;
            const patterns = [
                { key: 'L0', regex: config.L0, color: 'text-blue-400 bg-blue-900/60 rounded px-1' },
                { key: 'L1', regex: config.L1, color: 'text-green-400 bg-green-900/60 rounded px-1' },
                { key: 'L2', regex: config.L2, color: 'text-yellow-400 bg-yellow-900/60 rounded px-1' },
                { key: 'L3', regex: config.L3, color: 'text-red-400 bg-red-900/60 rounded px-1' },
                { key: 'Moving', regex: config.Moving, color: 'text-pink-400 bg-pink-900/60 rounded px-1 font-bold' }
            ];

            const matches = [];
            patterns.forEach(p => {
                if (!p.regex) return; // Skip undefined patterns
                try {
                    const re = new RegExp(p.regex, 'g');
                    let match;
                    while ((match = re.exec(text)) !== null) {
                        matches.push({ start: match.index, end: match.index + match[0].length, color: p.color });
                    }
                } catch (e) { }
            });

            if (matches.length === 0) return text;

            const charClasses = new Array(text.length).fill(null);
            matches.sort((a, b) => (b.end - b.start) - (a.end - a.start));

            matches.forEach(m => {
                for (let i = m.start; i < m.end; i++) {
                    if (!charClasses[i]) charClasses[i] = m.color;
                }
            });

            const nodes = [];
            let currentClass = null;
            let currentBuffer = "";

            for (let i = 0; i < text.length; i++) {
                const cls = charClasses[i];
                if (cls !== currentClass) {
                    if (currentBuffer) {
                        nodes.push(currentClass ? <span key={i} className={currentClass}>{currentBuffer}</span> : currentBuffer);
                    }
                    currentClass = cls;
                    currentBuffer = text[i];
                } else {
                    currentBuffer += text[i];
                }
            }
            if (currentBuffer) {
                nodes.push(currentClass ? <span key="end" className={currentClass}>{currentBuffer}</span> : currentBuffer);
            }

            return nodes;
        };

        const parseLogFileSynchronous = (rawText) => {
            console.log("DEBUG: Starting Sync Parse. Text Length:", rawText.length);
            const lines = rawText.split(/\r?\n/);
            console.log("DEBUG: Split into", lines.length, "lines");
            const parsed = [];
            const index = [{ time: 0, offset: 0 }];
            const events = [];

            let firstTime = null;
            let lastTime = 0;
            const noise = []; // Store noise readings

            lines.forEach((line, i) => {
                const clean = line.trim();
                if (!clean) return;

                const tMatch = clean.match(/T\s*=\s*([0-9.]+)\s*s/i);
                let rawT = lastTime; // Use a distinct var for raw time

                if (tMatch) {
                    rawT = parseFloat(tMatch[1]);
                    // Initialize firstTime on first valid timestamp
                    if (firstTime === null) firstTime = rawT;

                    if (rawT > lastTime + 1.0) {
                        // Store character offset for this time
                        // Approximate offset: previous lines length. 
                        // Since we split by newline, we can track offset manually or just ignore index for sync path.
                        // Better: Let's actually track offset if we want parity.
                        // BUT: For now, let's just ensure index has at least start/end to avoid fetchWindow crash.
                        index.push({ time: rawT, offset: 0 }); // Fixed: was 't' (undefined), now 'rawT'
                    }
                    // Update raw tracker for fallback
                    if (rawT > lastTime) lastTime = rawT;
                }

                // Fallback: If we processed >100 lines and still no timestamp, assume 0 base?
                if (firstTime === null && i > 100) firstTime = 0;

                // Normalize
                let t = rawT;
                if (firstTime !== null) {
                    t = Math.max(0, rawT - firstTime);
                }

                // Check for EVENT (format: [[ EVENT: type | T=time ]])
                if (clean.includes('EVENT:')) {
                    const m = clean.match(/EVENT:\s*(.*?)\s*\|/);
                    if (m) events.push({ time: t, type: 'EVENT', reason: m[1] });
                }

                // Check for NOISE (format: [NOISE: value | T=time])
                if (clean.startsWith('[NOISE:') || clean.includes('[NOISE:')) {
                    const noiseMatch = clean.match(/\[NOISE:\s*(\d+)/);
                    if (noiseMatch) {
                        noise.push({ time: t, val: parseInt(noiseMatch[1]) });
                    }
                }

                // Determine if this is a DATA line (not NOISE, EVENT, header, or separator)
                const isNoiseOrEvent = clean.startsWith('[NOISE:') || clean.startsWith('[[') || clean.includes('[NOISE:') || clean.includes('EVENT:');
                const isHeader = clean.startsWith('START:') || clean.startsWith('----') || clean === '@@';
                const isData = clean.length > 3 && !isNoiseOrEvent && !isHeader;

                parsed.push({
                    raw: clean,
                    timestamp: t,
                    isData: isData
                });
            });

            // POST-PROCESS: Interpolate timestamps for data lines between NOISE markers
            // This spreads data lines evenly between NOISE timestamps
            let prevNoiseIdx = -1;
            let prevNoiseTime = 0;
            for (let i = 0; i < parsed.length; i++) {
                const line = parsed[i];
                if (line.raw.includes('[NOISE:') || line.raw.includes('EVENT:')) {
                    // Found a marker - interpolate timestamps for all lines between prevNoiseIdx and i
                    if (prevNoiseIdx >= 0 && i > prevNoiseIdx + 1) {
                        const timeSpan = line.timestamp - prevNoiseTime;
                        const lineCount = i - prevNoiseIdx;
                        for (let j = prevNoiseIdx + 1; j < i; j++) {
                            const fraction = (j - prevNoiseIdx) / lineCount;
                            parsed[j].timestamp = prevNoiseTime + fraction * timeSpan;
                        }
                    }
                    prevNoiseIdx = i;
                    prevNoiseTime = line.timestamp;
                }
            }

            return {
                data: parsed,
                index,
                events,
                duration: lastTime,
                noise
            };
        };

        const parseLogContentAsync = async (text) => {
            const blob = new Blob([text]);
            const { index, events, duration, noise } = await scanLogFile(blob);
            // Extract stats if needed, or simple placeholders
            const linesCount = text.split('\n').length;

            return {
                data: new LogDataset(blob, index, events, noise, duration),
                stats: { lines: linesCount, anchors: index.length },
                duration,
                calls: events.filter(e => e.type === 'FLOOR_UPDATE' || (e.type === 'EVENT' && (e.reason.includes('Floor') || e.reason.includes('CALLING')))).map(e => {
                    if (e.floor !== undefined) return e;
                    // Extract level from reason for CALLING events
                    const m = e.reason.match(/Level\s+(\d+)/);
                    return { ...e, floor: m ? parseInt(m[1]) : '?' };
                })
            };
        };



        const getAlignedSlots = (slots) => slots; // Streaming Disable Alignment for now

        // --- COMPONENTS ---
        const TimelinePlot = ({ pattern, data, duration, selectedRanges, onRangeSelect, calls, zoom = 1 }) => {
            const canvasRef = useRef(null);
            const isDragging = useRef(false);
            const dragStart = useRef(0);

            useEffect(() => {
                if (!canvasRef.current || !data || duration === 0) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const width = canvas.width = canvas.offsetWidth;
                const height = canvas.height = canvas.offsetHeight;

                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = '#111827';
                ctx.fillRect(0, 0, width, height);
                ctx.strokeStyle = '#374151';
                ctx.beginPath();
                ctx.moveTo(0, height / 2);
                ctx.lineTo(width, height / 2);
                ctx.stroke();

                if (data.noise && data.noise.length > 0) {
                    const noisePoints = data.noise; // Use pre-calculated downsampled noise
                    if (noisePoints.length > 0) {
                        const minVal = Math.min(...noisePoints.map(d => d.val));
                        const safeMin = minVal > 0 ? minVal : 1;
                        const logMin = Math.log10(safeMin);
                        const logMax = Math.log10(Math.max(...noisePoints.map(d => d.val)));
                        const logRange = logMax - logMin || 1;

                        ctx.beginPath();
                        ctx.strokeStyle = 'rgba(147, 51, 234, 0.6)';
                        ctx.lineWidth = 1.5;
                        let first = true;
                        noisePoints.forEach(d => {
                            const x = (d.time / duration) * width;
                            const val = d.val > 0 ? d.val : 1;
                            const normalizedY = (Math.log10(val) - logMin) / logRange;
                            const y = height - (normalizedY * height * 0.8) - (height * 0.1);
                            if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
                        });
                        ctx.stroke();
                    }
                } else if (data.noiseValues) {
                    // Legacy Support for old parsed format if needed, but LogDataset is preferred
                    // ... (Rest omitted for brevity, assuming LogDataset usage)
                }

                if (pattern && data.lines && data.lines.length > 0) {
                    // Only render pattern ticks if data is in memory (small file)
                    // For streaming, searching purely on client render is too heavy.
                    ctx.fillStyle = '#FACC15';
                    let checkFn = (text) => text.includes(pattern.sequence);
                    if (pattern.isRegex) {
                        try {
                            const re = new RegExp(pattern.sequence);
                            checkFn = (text) => re.test(text);
                        } catch (e) { }
                    }

                    const lines = data.lines;
                    // Limit pattern rendering to prevent freeze on medium files
                    const maxRender = Math.min(lines.length, 100000);

                    for (let i = 0; i < maxRender; i++) {
                        const line = lines[i];
                        // Handle both string and object wrappers
                        const text = typeof line === 'string' ? line : line.raw;
                        const t = typeof line === 'string' ? (i * 0.1) : line.timestamp; // Fallback time usage

                        if (text && checkFn(text)) {
                            const x = (t / duration) * width;
                            ctx.fillRect(x, height * 0.2, 2, height * 0.6);
                        }
                    }
                }

                if (selectedRanges && selectedRanges.length > 0) {
                    ctx.fillStyle = 'rgba(34, 197, 94, 0.2)'; // Green transparent
                    ctx.strokeStyle = 'rgba(34, 197, 94, 0.5)';
                    selectedRanges.forEach(range => {
                        const x1 = (range.start / duration) * width;
                        const x2 = (range.end / duration) * width;
                        ctx.fillRect(x1, 0, x2 - x1, height);
                        ctx.strokeRect(x1, 0, x2 - x1, height);
                    });
                }

                // Draw Call Events (White Lines)
                if (calls && calls.length > 0) {
                    ctx.lineWidth = 1;
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'center';
                    calls.forEach(call => {
                        const x = (call.timestamp / duration) * width;

                        // Line
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.beginPath();
                        ctx.moveTo(x, 15); // Start below text
                        ctx.lineTo(x, height);
                        ctx.stroke();

                        // Floor Number
                        ctx.fillStyle = 'white';
                        ctx.fillText(call.floor, x, 10);

        // --- ANALYSIS ENGINE ---
        const analyzeLiftPath = async (logData, timingTable, heuristics) => {
            console.log("DEBUG: Starting Analysis Engine V4 (Aggressive Descent)...");
            const events = [];
            const lines = logData.lines || (logData.preParsedLines ? logData.preParsedLines : await logData.fetchWindow(0, logData.duration));
            const data = Array.isArray(lines) ? lines : [];
            if (data.length === 0) return events;

            const patterns = {};
            Object.entries(heuristics.markers).forEach(([key, val]) => {
                if (val) { try { patterns[key] = new RegExp(val); } catch (e) { console.error("Bad Regex:", key, val); } }
            });

            // WINDOWED DETECTION STATE
            const WINDOW_SIZE = heuristics.aaaWindow || 6.0;
            const MIN_COUNT = heuristics.aaaMinCount || 5;
            const DESCENT_MIN_COUNT = 2; // VERY loose threshold for descent

            let currentFloor = 0;
            let moveState = 'STOPPED';
            let moveStartTime = 0;

            // Sliding window buffers
            let aaaTimes = []; // Ascent signals
            let nhTimes = [];  // Descent signals

            // Helper to clean old timestamps
            const cleanWindow = (arr, now) => arr.filter(t => now - t <= WINDOW_SIZE);

            for (let i = 0; i < data.length; i++) {
                const line = data[i];
                if (!line.isData) continue;
                const txt = line.raw;
                const time = line.timestamp;

                // 1. Explicit Floor Markers
                if (patterns.arrL0 && patterns.arrL0.test(txt)) {
                    const lastFloorEv = events.slice().reverse().find(e => e.type === 'FLOOR_UPDATE');
                    if (!lastFloorEv || lastFloorEv.floor !== 0 || (time - lastFloorEv.timestamp > 5.0)) {
                        currentFloor = 0;
                        events.push({ type: 'FLOOR_UPDATE', floor: 0, timestamp: time, raw: txt, method: 'marker' });
                        if (moveState === 'MOVING') {
                            moveState = 'STOPPED';
                            events.push({ type: 'STATE_CHANGE', state: 'STOPPED', timestamp: time, raw: txt });
                            aaaTimes = []; nhTimes = [];
                        }
                    }
                }

                // 2. Door Closing Markers
                if (patterns.doorsClose && patterns.doorsClose.test(txt)) {
                    events.push({ type: 'DOOR_CLOSE', timestamp: time, raw: txt });
                }

                // 3. Movement Detection
                const hasAAA = patterns.moveSignal && patterns.moveSignal.test(txt);
                const hasNh = patterns.intermediateDescent && patterns.intermediateDescent.test(txt);

                if (hasAAA) aaaTimes.push(time);
                if (hasNh) nhTimes.push(time);

                aaaTimes = cleanWindow(aaaTimes, time);
                nhTimes = cleanWindow(nhTimes, time);

                const aaaCount = aaaTimes.length;
                const nhCount = nhTimes.length;
                const totalActivity = aaaCount + nhCount;

                if (moveState === 'STOPPED') {
                    // Check triggers - favor descent
                    const isLikelyDescent = nhCount > 0; // Even 1 descent signal in window is suspicious if total activity is low?
                    // But we used DESCENT_MIN_COUNT
                    const threshold = (nhCount >= DESCENT_MIN_COUNT) ? DESCENT_MIN_COUNT : MIN_COUNT;

                    // If we have enough descent signals, trigger immediately
                    const descentTrigger = nhCount >= DESCENT_MIN_COUNT;
                    const ascentTrigger = aaaCount >= MIN_COUNT;

                    if (descentTrigger || ascentTrigger) {
                        moveState = 'MOVING';
                        const likelyDir = (nhCount > aaaCount * 0.5) ? 'DOWN' : 'UP'; // Bias: if some Nh, probably Down
                        const startSafe = time - WINDOW_SIZE > 0 ? time - WINDOW_SIZE : time;
                        const allTimes = [...aaaTimes, ...nhTimes].sort((a, b) => a - b);
                        const bestStart = allTimes.length > 0 ? allTimes[0] : startSafe;
                        moveStartTime = bestStart;
                        events.push({ type: 'STATE_CHANGE', state: 'MOVING', timestamp: bestStart, likelyDirection: likelyDir });
                    }
                } else {
                    if (totalActivity === 0) {
                        moveState = 'STOPPED';
                        const stopTime = time - WINDOW_SIZE + 1.0;
                        events.push({ type: 'STATE_CHANGE', state: 'STOPPED', timestamp: stopTime });

                        // INFER DESTINATION
                        const travelTime = stopTime - moveStartTime;
                        const minTravelForFloor = 2.0; // Reduced to 2s to catch short moves

                        if (travelTime >= minTravelForFloor) {
                            // Determine dominant signal during the move
                            let tripAAA = 0, tripNh = 0;
                            let tripNoise = 0;
                            for (let k = 0; k < data.length; k++) {
                                if (data[k].timestamp >= moveStartTime && data[k].timestamp <= stopTime) {
                                    if (patterns.moveSignal && patterns.moveSignal.test(data[k].raw)) tripAAA++;
                                    if (patterns.intermediateDescent && patterns.intermediateDescent.test(data[k].raw)) tripNh++;
                                }
                            }

                            // Direction Inference with heavy Descent Bias
                            let direction = 'UNKNOWN';
                            if (tripNh > 0 && tripNh >= tripAAA * 0.3) direction = 'DOWN'; // If 30% relative to AAA, or just present?
                            else if (tripAAA > tripNh) direction = 'UP';

                            // If almost no signals but travelTime > min, check heuristic from start/end?
                            // We stick to what we found.

                            console.log(`DEBUG: Move done. T=${travelTime.toFixed(1)}s. AAA:${tripAAA} Nh:${tripNh} -> ${direction}`);

                            // TIMING TABLE LOOKUP (Priority)
                            let matchFound = false;

                            if (timingTable && timingTable.length > 0) {
                                // 1. Filter by Start Floor
                                let candidates = timingTable.filter(t => t.from === currentFloor);

                                // 2. Filter by Direction (if known)
                                if (direction === 'UP') candidates = candidates.filter(t => t.to > currentFloor);
                                else if (direction === 'DOWN') candidates = candidates.filter(t => t.to < currentFloor);

                                // 3. Find closest match
                                let bestMove = null;
                                let minDiff = Infinity;

                                candidates.forEach(move => {
                                    const diff = Math.abs(move.time - travelTime);
                                    if (diff < minDiff) {
                                        minDiff = diff;
                                        bestMove = move;
                                    }
                                });

                                // 4. Accept if valid (Tolerance 3.0s)
                                if (bestMove && minDiff <= 3.0) {
                                    currentFloor = bestMove.to;
                                    matchFound = true;
                                    events.push({ type: 'FLOOR_UPDATE', floor: currentFloor, timestamp: stopTime, inferred: true, method: 'table_match' });
                                } else if (candidates.length === 0 && direction !== 'UNKNOWN') {
                                    // If strict direction filtering yields no results, maybe we got direction wrong?
                                    // Or maybe it's an unlisted move. 
                                    // Try global match from currentFloor ignoring direction? 
                                    // No, safe fallback is better.
                                }
                            }

                            if (!matchFound) {
                                // Fallback Heuristics
                                // Based on the user's table, avg is roughly ~10-12s per floor?
                                // 1F: 8-12s, 2F: 14-16s, 3F: 18-20s
                                const getFloorsTraversed = (t) => {
                                    if (t < 13.0) return 1;
                                    if (t < 17.0) return 2;
                                    return 3;
                                };
                                const floorsToCheck = getFloorsTraversed(travelTime);
                                if (direction === 'UP') {
                                    currentFloor = Math.min(3, currentFloor + floorsToCheck);
                                } else if (direction === 'DOWN') {
                                    currentFloor = Math.max(0, currentFloor - floorsToCheck);
                                } else {
                                    // Unknown
                                    if (currentFloor >= 2) currentFloor = Math.max(0, currentFloor - floorsToCheck);
                                    else currentFloor = Math.min(3, currentFloor + floorsToCheck);
                                }
                                events.push({ type: 'FLOOR_UPDATE', floor: currentFloor, timestamp: stopTime, inferred: true, method: 'fallback_heuristic' });
                            }
                        }
                        aaaTimes = []; nhTimes = [];
                    }
                }
            }

            console.log("DEBUG: V4 Analysis complete.", events.length, "events.");
            return events;
        };

        const LiftAnalyzer = () => {
            const [config, setConfig] = useState({ threshold: 3 });
            const [timingTable, setTimingTable] = useState([
                { from: 0, to: 0, time: 0.00, note: "Door Cycle" },

                { from: 3, to: 2, time: 8.00 },
