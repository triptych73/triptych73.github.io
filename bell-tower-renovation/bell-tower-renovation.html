<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bell Tower Renovation Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            width: 250px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2em;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #ccc;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #444;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #555;
        }

        button.primary {
            background: #0078d4;
        }

        button.primary:hover {
            background: #106ebe;
        }

        .stats {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
            font-size: 0.85em;
            color: #aaa;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .instructions {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 15px;
            font-style: italic;
        }

        .saved-status {
            color: #4caf50;
            font-weight: bold;
            transition: opacity 0.5s;
            opacity: 0;
            float: right;
        }

        input[type=range] {
            width: 100%;
        }

        /* Context Menu hint */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: #333;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            display: none;
            z-index: 100;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.3/build/index.module.js",
                "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.16/build/index.module.js"
            }
        }
    </script>
</head>

<body>

    <div id="ui-panel">
        <h2>Renovation Controls <span id="saved-indicator" class="saved-status">Saved ✓</span></h2>
        <div class="instructions">
            Left-Click: Toggle Tile<br>
            Right-Click: Select Start -> End (Rect Fill)
        </div>

        <div class="control-group">
            <label>Architecture Transparency</label>
            <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="1">
        </div>

        <div class="control-group">
            <button id="btn-reset" class="primary">Reset to Exposed Brick</button>
            <button id="btn-render-all">Set All to Insulated</button>
            <button id="btn-flush-all">Set All to Flush Render</button>
            <button id="btn-wireframe">Toggle Wireframe</button>
            <button id="btn-export">Force Save</button>
        </div>

        <div class="stats">
            <div class="stat-row">
                <span>Total Tiles:</span>
                <span id="stat-total">0</span>
            </div>
            <div class="stat-row">
                <span>Insulated (60mm):</span>
                <span id="stat-insulated">0</span>
            </div>
            <div class="stat-row">
                <span>Flush Render:</span>
                <span id="stat-flush">0</span>
            </div>
            <div class="stat-row">
                <span>Coverage:</span>
                <span id="stat-percent">0%</span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>
    <div id="tooltip" class="tooltip"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyBcezJRuEx8vsThQKhi8Az_XdL_XSM6u8g",
            authDomain: "st-mary-somerset.firebaseapp.com",
            projectId: "st-mary-somerset",
            storageBucket: "st-mary-somerset.firebasestorage.app",
            messagingSenderId: "924281338278",
            appId: "1:924281338278:web:83affbb1aff93ba797f767"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const APP_ID = 'bell-tower';
        const DOC_ID = 'visualizer_state';

        // --- Configuration ---
        const CONFIG = {
            roomSize: 4.0,           // 4x4m footprint
            wallHeight: 6.0,         // Default 6m height
            chamferStart: 0.75,      // Distance from center where chamfer starts (at window edge)
            window: {
                width: 1.5,
                heightRect: 3.1,
                archRadius: 0.75,
                heightTotal: 3.85,
                depth: 0.45 // Reveal depth
            },
            door: {
                width: 0.7,
                height: 1.5
            },
            tileSize: 0.25,          // 25cm grid
            insulationDepth: 0.06,   // 60mm offset
            colors: {
                brick: 0x8b4513,     // SaddleBrown
                render: 0xffffff,    // White
                flushRender: 0xeeeeee, // Slightly off-white
                wireframe: 0x333333,
                background: 0x202020,
                selection: 0x00ff00, // Green selection glow
                mezzanine: 0x808080, // Grey concrete
                stairs: 0x606060,
                glass: 0x88ccff,
                wallSolid: 0xffffff
            }
        };

        // --- State ---
        const state = {
            tiles: [], // Array of Tile objects
            isWireframe: false,
            remoteUpdateInProgress: false,
            selectedTile: null // For range selection
        };

        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.colors.background);

        // Add some fog for depth
        scene.fog = new THREE.Fog(CONFIG.colors.background, 5, 20);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(2, 4, 3); // Start looking from SE 
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 2, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffaa00, 0.5, 10);
        pointLight.position.set(0, 4, 0);
        scene.add(pointLight);

        // --- CSG Evaluator ---
        const csgEvaluator = new Evaluator();

        function createWindowCutter() {
            const cylGeo = new THREE.CylinderGeometry(CONFIG.window.archRadius, CONFIG.window.archRadius, 2.0, 32);
            cylGeo.rotateX(Math.PI / 2);
            const cylBrush = new Brush(cylGeo);
            cylBrush.position.y = CONFIG.window.heightRect;
            cylBrush.updateMatrixWorld();
            return cylBrush;
        }

        const archCutter = createWindowCutter();


        // --- Helper Functions (Hoisted) ---
        function updateStats() {
            if (!state.tiles.length) return;
            const total = state.tiles.length;
            const insulated = state.tiles.filter(t => t.state === 1).length;
            const flush = state.tiles.filter(t => t.state === 2).length;
            const percent = Math.round(((insulated + flush) / total) * 100);

            const elTotal = document.getElementById('stat-total');
            if (elTotal) elTotal.innerText = total;

            const elIns = document.getElementById('stat-insulated');
            if (elIns) elIns.innerText = insulated;

            const elFlush = document.getElementById('stat-flush');
            if (elFlush) elFlush.innerText = flush;

            const elPerc = document.getElementById('stat-percent');
            if (elPerc) elPerc.innerText = percent + '%';
        }

        // --- Persistence Logic ---
        let saveTimeout = null;

        function scheduleSave() {
            if (state.remoteUpdateInProgress) return;

            const indicator = document.getElementById('saved-indicator');
            if (indicator) indicator.style.opacity = '0';

            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveToFirebase, 1000);
        }

        async function saveToFirebase() {
            if (!auth.currentUser) return;

            const tileStates = state.tiles.map(t => t.state);

            try {
                await setDoc(doc(db, 'artifacts', APP_ID, 'configurations', DOC_ID), {
                    tiles: tileStates,
                    updatedAt: new Date().toISOString(),
                    updatedBy: auth.currentUser.uid
                }, { merge: true });

                const indicator = document.getElementById('saved-indicator');
                if (indicator) indicator.style.opacity = '1';
            } catch (e) {
                // console.error("Save failed", e); // Silence unless needed
            }
        }

        // --- Helper Classes ---

        class Tile {
            constructor(position, normal, width, height, type = 'wall', wallId, gx, gy, existingGeometry = null) {
                this.state = 0; // 0: Brick, 1: Insulated, 2: Flush Render
                this.originalPosition = position.clone();
                this.normal = normal.clone();
                this.type = type; // 'wall', 'reveal'
                this.wallId = wallId;
                this.gridX = gx;
                this.gridY = gy;
                this.isSelected = false;

                // Initial Geometry (Thin plane/box)
                this.geoThin = existingGeometry ? existingGeometry : new THREE.BoxGeometry(width * 0.95, height * 0.95, 0.02);

                this.material = new THREE.MeshStandardMaterial({
                    color: CONFIG.colors.brick,
                    roughness: 0.9,
                    metalness: 0.1,
                    emissive: 0x000000
                });

                this.mesh = new THREE.Mesh(this.geoThin, this.material);
                this.mesh.position.copy(this.originalPosition);

                if (!existingGeometry) {
                    this.mesh.lookAt(this.originalPosition.clone().add(this.normal));
                    // Normal box looks at Normal (Z+ local).
                } else {
                    this.mesh.lookAt(this.originalPosition.clone().add(this.normal));
                }

                this.mesh.userData = { tile: this };

                scene.add(this.mesh);
            }

            toggle() {
                this.state = (this.state + 1) % 3;
                this.updateVisuals();
                scheduleSave();
            }

            setState(newState) {
                if (this.state === newState) return;
                this.state = newState;
                this.updateVisuals();
            }

            setSelection(selected) {
                this.isSelected = selected;
                this.material.emissive.setHex(selected ? CONFIG.colors.selection : 0x000000);
                this.material.emissiveIntensity = selected ? 0.5 : 0;
            }

            updateVisuals() {
                requestAnimationFrame(updateStats);

                // Reset transforms/scale
                this.mesh.scale.set(1, 1, 1);
                this.mesh.position.copy(this.originalPosition);

                if (this.state === 1) { // Insulated (Solid Extrusion)
                    this.material.color.setHex(CONFIG.colors.render);
                    this.material.roughness = 0.5;

                    // Thicken
                    // BoxGeometry 0.02 depth is along Local Z.
                    // Scale Z -> 4.0 makes it 0.08 depth.
                    // It expands from center (0). Local range [-0.04, 0.04].
                    // Original was [-0.01, 0.01].
                    // Wall face is effectively at Local Z=0 (actually usually centered on wall plane).
                    // If original position is ON wall, we want it to grow OUT.
                    // Normal direction is "Out".
                    // Shift position along normal by (NewRadius - OldRadius) = (0.04 - 0.01) = 0.03.

                    this.mesh.scale.z = 4.0;
                    const shift = this.normal.clone().multiplyScalar(0.03);
                    this.mesh.position.add(shift);

                } else if (this.state === 2) { // Flush Render
                    this.material.color.setHex(CONFIG.colors.flushRender);
                    this.material.roughness = 0.5;
                    // No scale change, default pos
                } else { // Brick
                    this.material.color.setHex(CONFIG.colors.brick);
                    this.material.roughness = 0.9;
                    // Default pos
                }
            }
        }

        // --- Wall Generation Logic ---

        function isInsideHole(localX, localY) {
            const halfW = CONFIG.window.width / 2;
            if (localX > -halfW && localX < halfW && localY < CONFIG.window.heightRect) {
                return true;
            }
            if (localY >= CONFIG.window.heightRect) {
                const dy = localY - CONFIG.window.heightRect;
                if (localX * localX + dy * dy < (CONFIG.window.archRadius - 0.1) ** 2) {
                    return true;
                }
            }
            return false;
        }

        function isIntersectingArch(localX, localY, width, height) {
            const tileTop = localY + height / 2;
            if (tileTop < CONFIG.window.heightRect) return false;

            const dy = Math.max(0, localY - CONFIG.window.heightRect);
            const dist = Math.sqrt(localX * localX + dy * dy);

            const tolerance = Math.max(width, height) * 2.5;
            if (dist > CONFIG.window.archRadius - tolerance && dist < CONFIG.window.archRadius + tolerance) {
                return true;
            }
            return false;
        }

        function createWall(p1, p2, type = 'solid', wallId) {
            const length = p1.distanceTo(p2);
            const height = CONFIG.wallHeight;

            const wallDir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const upDir = new THREE.Vector3(0, 1, 0);
            let normal = new THREE.Vector3().crossVectors(wallDir, upDir).normalize();

            const midPoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            if (normal.dot(midPoint) > 0) normal.negate();

            const stepsX = Math.ceil(length / CONFIG.tileSize);
            const stepsY = Math.ceil(height / CONFIG.tileSize);
            const realTileW = length / stepsX;
            const realTileH = height / stepsY;

            let holeCenterX = length / 2;
            if (type === 'window' || type === 'door') {
                if (Math.abs(p1.z + 2) < 0.01 && p1.x < 0) { holeCenterX = 2.0; }
                if (Math.abs(p1.x - 2) < 0.01 && p1.z < 0) { holeCenterX = 0.75; }
            }
            if (type === 'chamfer') { type = 'door'; holeCenterX = length / 2; }

            for (let ix = 0; ix < stepsX; ix++) {
                for (let iy = 0; iy < stepsY; iy++) {
                    const localX = (ix + 0.5) * realTileW;
                    const localY = (iy + 0.5) * realTileH;
                    const relativeX = localX - holeCenterX;

                    let skip = false;
                    if (type === 'window') {
                        if (relativeX > -CONFIG.window.width / 2 && relativeX < CONFIG.window.width / 2 && localY < CONFIG.window.heightRect) {
                            skip = true;
                        }
                        else if (localY >= CONFIG.window.heightRect) {
                            const dy = localY - CONFIG.window.heightRect;
                            if (relativeX * relativeX + dy * dy < (CONFIG.window.archRadius * 0.9) ** 2) {
                                skip = true;
                            }
                        }
                    }

                    if (type === 'door' && isHoleDoor(relativeX, localY)) skip = true;

                    if (skip) continue;

                    const pos = p1.clone()
                        .add(wallDir.clone().multiplyScalar(localX))
                        .add(upDir.clone().multiplyScalar(localY));

                    if (type === 'window' && isIntersectingArch(relativeX, localY, realTileW, realTileH)) {
                        const tileGeo = new THREE.BoxGeometry(realTileW * 0.95, realTileH * 0.95, 0.02);
                        const tileBrush = new Brush(tileGeo);
                        const localHoleX = -relativeX;
                        const localHoleY = CONFIG.window.heightRect - localY;
                        archCutter.position.set(localHoleX, localHoleY, 0);
                        archCutter.updateMatrixWorld();
                        tileBrush.updateMatrixWorld();

                        const result = csgEvaluator.evaluate(tileBrush, archCutter, SUBTRACTION);
                        const resGeo = result.geometry;

                        const tile = new Tile(pos, normal, realTileW, realTileH, 'wall', wallId, ix, iy, resGeo);
                        state.tiles.push(tile);

                    } else {
                        const tile = new Tile(pos, normal, realTileW, realTileH, 'wall', wallId, ix, iy);
                        state.tiles.push(tile);
                    }
                }
            }

            if (type === 'window') {
                const holeCenterPos = p1.clone().add(wallDir.clone().multiplyScalar(holeCenterX));
                createReveal(holeCenterPos, normal, wallDir, wallId);
            }
        }

        function isHoleDoor(localX, localY) {
            const halfW = CONFIG.door.width / 2;
            return (localX > -halfW && localX < halfW && localY < CONFIG.door.height);
        }

        function createReveal(centerPos, wallNormal, wallDir, parentWallId) {
            const halfW = CONFIG.window.width / 2;
            const depth = CONFIG.window.depth;

            const stepsY = Math.ceil(CONFIG.window.heightRect / CONFIG.tileSize);
            const stepsD = Math.ceil(depth / CONFIG.tileSize);

            const tileH = CONFIG.window.heightRect / stepsY;
            const tileD = depth / stepsD;

            // 1. Left Reveal
            const leftId = parentWallId + '_reveal_left';
            for (let iy = 0; iy < stepsY; iy++) {
                for (let id = 0; id < stepsD; id++) {
                    const ly = (iy + 0.5) * tileH;
                    const ld = (id + 0.5) * tileD;
                    // Fix Reveal Position Logic for extrusions
                    // Normal points "In" to the window void? Or "Out"? 
                    // Reveal tiles face "In". Normal is perpendicular to reveal face.

                    const pos = centerPos.clone()
                        .sub(wallDir.clone().multiplyScalar(halfW))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(ly))
                        .sub(wallNormal.clone().multiplyScalar(ld));

                    const tile = new Tile(pos, wallDir, tileD, tileH, 'reveal', leftId, id, iy);
                    state.tiles.push(tile);
                }
            }

            // 2. Right Reveal 
            const rightId = parentWallId + '_reveal_right';
            for (let iy = 0; iy < stepsY; iy++) {
                for (let id = 0; id < stepsD; id++) {
                    const ly = (iy + 0.5) * tileH;
                    const ld = (id + 0.5) * tileD;

                    const pos = centerPos.clone()
                        .add(wallDir.clone().multiplyScalar(halfW))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(ly))
                        .sub(wallNormal.clone().multiplyScalar(ld));

                    const tile = new Tile(pos, wallDir.clone().negate(), tileD, tileH, 'reveal', rightId, id, iy);
                    state.tiles.push(tile);
                }
            }

            // 3. Arch Reveal
            const archId = parentWallId + '_reveal_arch';
            const archCenter = centerPos.clone().add(new THREE.Vector3(0, 1, 0).multiplyScalar(CONFIG.window.heightRect));
            const arcSteps = 12;
            const arcLen = Math.PI * CONFIG.window.archRadius;
            const tileArcLen = arcLen / arcSteps;

            for (let i = 0; i < arcSteps; i++) {
                const theta = (i + 0.5) * (Math.PI / arcSteps);
                const localX = Math.cos(theta) * CONFIG.window.archRadius;
                const localY = Math.sin(theta) * CONFIG.window.archRadius;

                for (let id = 0; id < stepsD; id++) {
                    const ld = (id + 0.5) * tileD;
                    const pos = archCenter.clone()
                        .add(wallDir.clone().multiplyScalar(localX))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(localY))
                        .sub(wallNormal.clone().multiplyScalar(ld));

                    const tileNormal = wallDir.clone().multiplyScalar(Math.cos(theta))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(Math.sin(theta)))
                        .negate()
                        .normalize();

                    const tile = new Tile(pos, tileNormal, tileD, tileArcLen, 'reveal', archId, id, i);
                    state.tiles.push(tile);
                }
            }
        }

        // --- Architecture Helpers ---
        function registerArch(mesh) {
            mesh.userData.isArchitecture = true;
            scene.add(mesh);
        }

        // --- Mezzanine Generation ---
        function createMezzanine() {
            // Mezzanine along South Wall (Z=2)
            const mainGeo = new THREE.BoxGeometry(4, 0.25, 1);
            const mainMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.mezzanine, roughness: 0.8, transparent: true });
            const mainMesh = new THREE.Mesh(mainGeo, mainMat);
            mainMesh.position.set(0, 2.225, 1.5);
            mainMesh.receiveShadow = true;
            mainMesh.castShadow = true;
            registerArch(mainMesh);

            const extGeo = new THREE.BoxGeometry(CONFIG.window.width, 0.25, CONFIG.window.depth);
            const extMesh = new THREE.Mesh(extGeo, mainMat);
            extMesh.position.set(0, 2.225, 2 + CONFIG.window.depth / 2);
            extMesh.receiveShadow = true;
            registerArch(extMesh);
        }

        // --- Staircase & Features Generation ---
        function createStaircase() {
            // Stairs along West Wall (X=-2) 
            // Described: S-N. Top at S (Mezzanine Z=1.5 edge), Bottom at N.

            const stairMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.stairs, roughness: 0.7, transparent: true });
            const stepH = 2.35 / 13;
            const tread = 0.25;

            // --- 1. Top/West Run (Descending North) ---

            const numWestSteps = 9; // Steps along West Wall
            const westShape = new THREE.Shape();

            // Start profile at Bottom Normal (0,0) = North end of Upper Run.
            // Go UP and RIGHT (Positive X).
            // X represents Z-distance traveling South.
            // Y represents Height.

            // Start point (Bottom of run)
            westShape.moveTo(0, 0);

            // Iterate steps UP
            for (let i = 0; i < numWestSteps; i++) {
                const yBot = i * stepH;
                const yTop = (i + 1) * stepH;
                const xNear = i * tread;
                const xFar = (i + 1) * tread;

                westShape.lineTo(xNear, yTop); // Riser Up
                westShape.lineTo(xFar, yTop);  // Tread Right
            }

            const totalLen = numWestSteps * tread;
            const totalH = numWestSteps * stepH;

            // Soffit
            const angle = Math.atan2(stepH, tread);
            const dx = 0.3 * Math.sin(angle);
            const dy = 0.3 * Math.cos(angle);

            westShape.lineTo(totalLen + dx, totalH - dy); // Top Corner Soffit
            westShape.lineTo(0 + dx, 0 - dy);             // Bottom Corner Soffit
            westShape.lineTo(0, 0);                       // Close

            const extrudeSettings = { depth: 0.6, bevelEnabled: false };
            const westGeo = new THREE.ExtrudeGeometry(westShape, extrudeSettings);

            // Rotation:
            // Shape X (Run) -> needs to map to World Z+ (South).
            // Shape Y (Up) -> needs to map to World Y (Up).
            // Extrude Z (Width) -> needs to map to World X+ (East).

            // Rotation -90 deg Y (-PI/2):
            // X basis (1,0,0) -> Z (0,0,1)  [South] -- CORRECT
            // Y basis (0,1,0) -> Y (0,1,0)  [Up]    -- CORRECT
            // Z basis (0,0,1) -> X (1,0,0)  [East]  -- CORRECT

            westGeo.rotateY(-Math.PI / 2);

            const westMesh = new THREE.Mesh(westGeo, stairMat);

            // Positioning
            // Origin (0,0,0) of geometry corresponds to:
            // Shape(0,0) [North-Bottom of run]
            // Extrude(0) [West face]
            // This point should be at:
            // X = -2 (West Wall)
            // Y = Height of Start (Winder Height? Or absolute?)
            // Let's assume Winder is at bottom.
            // Run starts AFTER winder.
            // Winder is at Corner (-1.64, -1.64).
            // Run starts North of Winder? No, Run is Upper?
            // Wait, "Descending from Mezzanine"
            // Mezzanine is TOP. (South).
            // So Run starts at TOP (South) and goes Down (North).
            // My Shape went UP from North to South. That is correct.
            // Top of Shape corresponds to Mezzanine Level.
            // Bottom of Shape corresponds to Winder Level.

            // Bottom of Shape is at (0,0) local.
            // This is the North end of the run.
            // Winder is at corner NW? No, corner NW is (-2, -2).
            // Wait, Winder connects West Run to North Run?
            // Previous logic: Winder was in NW corner?
            // Run 1: Mezzanine(S) -> Corner(NW). (Descending)
            // Run 2: Corner(NW) -> North Wall?
            // Or Corner -> East?
            // User said: "Staircase (West Wall -> North Wall)".
            // So it goes West Wall (South to North) -> Turn Corner (NW) -> North Wall (West to East).

            // So Winder is at NW Corner.
            // West Run Bottom (North End) connects to Winder Top.
            // Winder Top Y = 2 * stepH.
            // So West Run Bottom Y = 2 * stepH.

            // Where is Reference Point (0,0,0) of Mesh?
            // Corresponds to Shape(0,0) [North End].
            // This point should be at:
            // X = -2 (West Wall).
            // Y = 2 * stepH (Top of Winder).
            // Z = ?
            // Corner is at approx Z = -1.64 (inside room).
            // Run should end near corner. Let's say Z = -1.34.

            westMesh.position.set(-2, 2 * stepH, -1.34);
            registerArch(westMesh);

            // --- 2. Corner Winder (Steps 1, 2) in NW Corner ---

            // Step 2 (Upper Winder)
            // Box 0.6x0.6?
            const step2Geo = new THREE.BoxGeometry(0.6, stepH, 0.6);
            const step2 = new THREE.Mesh(step2Geo, stairMat);
            // Positioned at Corner (-1.7, -1.7)?
            // Center of box.
            step2.position.set(-1.7, 1.5 * stepH, -1.7);
            registerArch(step2);

            // Step 1 (Lower Winder)
            const step1Geo = new THREE.BoxGeometry(0.6, stepH, 0.6);
            const step1 = new THREE.Mesh(step1Geo, stairMat);
            step1.position.set(-1.7, 0.5 * stepH, -1.7);
            registerArch(step1);

            // --- 3. Lower/North Run (Descending East) ---
            // Wait, Steps 1,2 are Winder.
            // Steps 3..11 are West Run.
            // Is there a lower run? 
            // "Staircase (West Wall -> North Wall)" typically means one long run or L-shape.
            // Mezzanine (High, S) -> Runs North along West Wall -> Corner NW -> Runs East along North Wall (Low).
            // If Mezzanine is @ 2.225. 13 risers.
            // Corner NW is Low?
            // If Corner NW corresponds to Steps 1,2.
            // Then West Run is Steps 3..13.

            // My West Run Shape was 9 steps. Let's stick with that.
            // Steps 3..11.

            // Lower Run (North Wall). Steps 0? Or exit?
            // Let's assume exit is at North Wall East end?
            // Or maybe just Winder is the bottom?
            // If Winder is steps 1,2.
            // Where is Step 0? Or is Step 1 the floor?
            // Let's just add a small landing or final step.

            // If user said "Staircase (West Wall -> North Wall)", maybe they meant:
            // Top @ Mezzanine (S).
            // Run down West Wall.
            // Turn at NW Corner.
            // Run down North Wall (East).

            // Let's add the North Wall run.
            // Run East from Corner.
            // Shape: Top at West (Corner), Bottom at East.
            // Descending East.
            // Shape in XY (Ascending Right/East).
            // Left end (X=0) is Bottom. Right end is Top.
            // No, we want Left (Corner) to be High. Right (East) to be Low?
            // Let's define shape: Low (X=0, East end) -> High (X=Run, West end).
            // Riser Up, Tread Left (-X)? No.
            // Standard ascending shape (X+ is Up).
            // Rotate: Shape X (Up/Right) -> World -X (West).
            // Then Start (Low) is at East. End (High) is at West.

            // Let's simplify and just put a landing/exit at the bottom of the winder for now unless specified.
            // The user previously said "North Wall". I will assume a short exit run.

        }

        createMezzanine();
        createStaircase();

        // --- Build Walls ---
        const SW = new THREE.Vector3(-2, 0, 2);
        const SE = new THREE.Vector3(2, 0, 2);
        const NW = new THREE.Vector3(-2, 0, -2);
        const NorthCut = new THREE.Vector3(0.75, 0, -2);
        const EastCut = new THREE.Vector3(2, 0, -0.75);

        createWall(SE, SW, 'window', 'south_wall');
        createWall(SW, NW, 'window', 'west_wall');
        createWall(NW, NorthCut, 'window', 'north_wall');
        createWall(EastCut, SE, 'window', 'east_wall');
        createWall(NorthCut, EastCut, 'chamfer', 'chamfer_wall');

        // --- Raycasting ---
        const rc = new THREE.Raycaster();
        const ptr = new THREE.Vector2();

        function onPointerDown(event) {
            if (event.target !== renderer.domElement) return;

            ptr.x = (event.clientX / window.innerWidth) * 2 - 1;
            ptr.y = - (event.clientY / window.innerHeight) * 2 + 1;

            rc.setFromCamera(ptr, camera);

            const visibleChildren = scene.children.filter(obj => obj.visible);
            const intersects = rc.intersectObjects(visibleChildren);

            if (intersects.length > 0) {
                let targetObj = intersects[0].object;
                if (targetObj.userData && targetObj.userData.tile) {
                    const tile = targetObj.userData.tile;
                    if (event.button === 0) {
                        tile.toggle();
                    } else if (event.button === 2) {
                        handleRightClick(tile);
                    }
                }
            }
        }

        window.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('pointerdown', onPointerDown);

        function handleRightClick(tile) {
            if (!state.selectedTile) {
                state.selectedTile = tile;
                tile.setSelection(true);
            } else {
                if (state.selectedTile === tile) {
                    state.selectedTile = null;
                    tile.setSelection(false);
                    return;
                }
                if (state.selectedTile.wallId === tile.wallId) {
                    performBlockFill(state.selectedTile, tile);
                    state.selectedTile.setSelection(false);
                    state.selectedTile = null;
                } else {
                    state.selectedTile.setSelection(false);
                    state.selectedTile = tile;
                    tile.setSelection(true);
                }
            }
        }

        function performBlockFill(t1, t2) {
            const wallId = t1.wallId;
            const minX = Math.min(t1.gridX, t2.gridX);
            const maxX = Math.max(t1.gridX, t2.gridX);
            const minY = Math.min(t1.gridY, t2.gridY);
            const maxY = Math.max(t1.gridY, t2.gridY);

            const tilesInRange = state.tiles.filter(t =>
                t.wallId === wallId &&
                t.gridX >= minX && t.gridX <= maxX &&
                t.gridY >= minY && t.gridY <= maxY
            );

            if (tilesInRange.length === 0) return;

            const counts = { 0: 0, 1: 0, 2: 0 };
            tilesInRange.forEach(t => counts[t.state]++);

            let commonState = 0;
            let maxCount = -1;
            for (let s = 0; s <= 2; s++) {
                if (counts[s] > maxCount) {
                    maxCount = counts[s];
                    commonState = s;
                }
            }

            const nextState = (commonState + 1) % 3;
            tilesInRange.forEach(t => t.setState(nextState));
            scheduleSave();
        }

        // --- Buttons ---
        document.getElementById('btn-reset').onclick = () => {
            state.tiles.forEach(t => t.setState(0));
            scheduleSave();
        };
        document.getElementById('btn-render-all').onclick = () => {
            state.tiles.forEach(t => t.setState(1));
            scheduleSave();
        };
        document.getElementById('btn-flush-all').onclick = () => {
            state.tiles.forEach(t => t.setState(2));
            scheduleSave();
        };
        document.getElementById('btn-wireframe').onclick = () => {
            state.isWireframe = !state.isWireframe;
            scene.traverse(obj => {
                if (obj.isMesh) {
                    obj.material.wireframe = state.isWireframe;
                }
            });
        };
        document.getElementById('btn-export').onclick = () => {
            saveToFirebase();
        };

        document.getElementById('opacity-slider').oninput = (e) => {
            const val = parseFloat(e.target.value);
            scene.traverse(obj => {
                if (obj.userData && obj.userData.isArchitecture) {
                    obj.material.opacity = val;
                    obj.visible = (val > 0.05);
                }
            });
        };

        // --- Firebase Init ---
        signInAnonymously(auth).then(() => {
            onSnapshot(doc(db, 'artifacts', APP_ID, 'configurations', DOC_ID), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.tiles && Array.isArray(data.tiles)) {
                        state.remoteUpdateInProgress = true;
                        data.tiles.forEach((val, idx) => {
                            if (state.tiles[idx]) {
                                state.tiles[idx].setState(val);
                            }
                        });
                        state.remoteUpdateInProgress = false;
                        updateStats();
                    }
                }
            });
        }).catch(console.error);

        updateStats();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
