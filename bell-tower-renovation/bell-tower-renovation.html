<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bell Tower Renovation Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            width: 250px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2em;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #ccc;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #444;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #555;
        }

        button.primary {
            background: #0078d4;
        }

        button.primary:hover {
            background: #106ebe;
        }

        .stats {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
            font-size: 0.85em;
            color: #aaa;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .instructions {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 15px;
            font-style: italic;
        }

        .saved-status {
            color: #4caf50;
            font-weight: bold;
            transition: opacity 0.5s;
            opacity: 0;
            float: right;
        }

        input[type=range] {
            width: 100%;
        }

        /* Context Menu hint */
        .tooltip {
            position: absolute;
            pointer-events: none;
            background: #333;
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            display: none;
            z-index: 100;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.3/build/index.module.js",
                "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.16/build/index.module.js"
            }
        }
    </script>
</head>

<body>

    <div id="ui-panel">
        <h2>Renovation Controls <span id="saved-indicator" class="saved-status">Saved ✓</span></h2>
        <div class="instructions">
            Left-Click: Toggle Tile<br>
            Right-Click: Select Start -> End (Rect Fill)
        </div>

        <div class="control-group">
            <label>Architecture Transparency</label>
            <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="1">
        </div>

        <div class="control-group">
            <button id="btn-reset" class="primary">Reset to Exposed Brick</button>
            <button id="btn-render-all">Set All to Insulated</button>
            <button id="btn-flush-all">Set All to Flush Render</button>
            <button id="btn-wireframe">Toggle Wireframe</button>
            <button id="btn-export">Force Save</button>
        </div>

        <div class="stats">
            <div class="stat-row">
                <span>Total Tiles:</span>
                <span id="stat-total">0</span>
            </div>
            <div class="stat-row">
                <span>Insulated (60mm):</span>
                <span id="stat-insulated">0</span>
            </div>
            <div class="stat-row">
                <span>Flush Render:</span>
                <span id="stat-flush">0</span>
            </div>
            <div class="stat-row">
                <span>Coverage:</span>
                <span id="stat-percent">0%</span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>
    <div id="tooltip" class="tooltip"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyBcezJRuEx8vsThQKhi8Az_XdL_XSM6u8g",
            authDomain: "st-mary-somerset.firebaseapp.com",
            projectId: "st-mary-somerset",
            storageBucket: "st-mary-somerset.firebasestorage.app",
            messagingSenderId: "924281338278",
            appId: "1:924281338278:web:83affbb1aff93ba797f767"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const APP_ID = 'bell-tower';
        const DOC_ID = 'visualizer_state';

        // --- Configuration ---
        const CONFIG = {
            roomSize: 4.0,           // 4x4m footprint
            wallHeight: 6.0,         // Default 6m height
            chamferStart: 0.75,      // Distance from center where chamfer starts (at window edge)
            window: {
                width: 1.5,
                heightRect: 3.1,
                archRadius: 0.75,
                heightTotal: 3.85,
                depth: 0.45 // Reveal depth
            },
            door: {
                width: 0.7,
                height: 1.5
            },
            tileSize: 0.25,          // 25cm grid
            insulationDepth: 0.06,   // 60mm offset
            colors: {
                brick: 0x8b4513,     // SaddleBrown
                render: 0xffffff,    // White
                flushRender: 0xeeeeee, // Slightly off-white
                wireframe: 0x333333,
                background: 0x202020,
                selection: 0x00ff00, // Green selection glow
                mezzanine: 0x808080, // Grey concrete
                stairs: 0x606060,
                glass: 0x88ccff,
                wallSolid: 0xffffff
            }
        };

        // --- State ---
        const state = {
            tiles: [], // Array of Tile objects
            isWireframe: false,
            remoteUpdateInProgress: false,
            selectedTile: null // For range selection
        };

        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.colors.background);

        // Add some fog for depth
        scene.fog = new THREE.Fog(CONFIG.colors.background, 5, 20);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4, 0); // Start inside/above looking down
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 2, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffaa00, 0.5, 10);
        pointLight.position.set(0, 4, 0);
        scene.add(pointLight);

        // --- CSG Evaluator ---
        const csgEvaluator = new Evaluator();

        function createWindowCutter() {
            const cylGeo = new THREE.CylinderGeometry(CONFIG.window.archRadius, CONFIG.window.archRadius, 2.0, 32);
            cylGeo.rotateX(Math.PI / 2);
            const cylBrush = new Brush(cylGeo);
            cylBrush.position.y = CONFIG.window.heightRect;
            cylBrush.updateMatrixWorld();
            return cylBrush;
        }

        const archCutter = createWindowCutter();


        // --- Helper Functions (Hoisted) ---
        function updateStats() {
            if (!state.tiles.length) return;
            const total = state.tiles.length;
            const insulated = state.tiles.filter(t => t.state === 1).length;
            const flush = state.tiles.filter(t => t.state === 2).length;
            const percent = Math.round(((insulated + flush) / total) * 100);

            const elTotal = document.getElementById('stat-total');
            if (elTotal) elTotal.innerText = total;

            const elIns = document.getElementById('stat-insulated');
            if (elIns) elIns.innerText = insulated;

            const elFlush = document.getElementById('stat-flush');
            if (elFlush) elFlush.innerText = flush;

            const elPerc = document.getElementById('stat-percent');
            if (elPerc) elPerc.innerText = percent + '%';
        }

        // --- Persistence Logic ---
        let saveTimeout = null;

        function scheduleSave() {
            if (state.remoteUpdateInProgress) return;

            const indicator = document.getElementById('saved-indicator');
            if (indicator) indicator.style.opacity = '0';

            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveToFirebase, 1000);
        }

        async function saveToFirebase() {
            if (!auth.currentUser) return;

            const tileStates = state.tiles.map(t => t.state);

            try {
                await setDoc(doc(db, 'artifacts', APP_ID, 'configurations', DOC_ID), {
                    tiles: tileStates,
                    updatedAt: new Date().toISOString(),
                    updatedBy: auth.currentUser.uid
                }, { merge: true });

                const indicator = document.getElementById('saved-indicator');
                if (indicator) indicator.style.opacity = '1';
            } catch (e) {
                // console.error("Save failed", e); // Silence unless needed
            }
        }

        // --- Helper Classes ---

        class Tile {
            constructor(position, normal, width, height, type = 'wall', wallId, gx, gy, existingGeometry = null) {
                this.state = 0; // 0: Brick, 1: Insulated, 2: Flush Render
                this.originalPosition = position.clone();
                this.normal = normal.clone();
                this.type = type; // 'wall', 'reveal'
                this.wallId = wallId;
                this.gridX = gx;
                this.gridY = gy;
                this.isSelected = false;

                // Create geometry
                let geometry;
                if (existingGeometry) {
                    geometry = existingGeometry;
                } else {
                    geometry = new THREE.BoxGeometry(width * 0.95, height * 0.95, 0.02);
                }

                this.material = new THREE.MeshStandardMaterial({
                    color: CONFIG.colors.brick,
                    roughness: 0.9,
                    metalness: 0.1,
                    emissive: 0x000000
                });

                this.mesh = new THREE.Mesh(geometry, this.material);
                this.mesh.position.copy(this.originalPosition);

                if (!existingGeometry) {
                    this.mesh.lookAt(this.originalPosition.clone().add(this.normal));
                } else {
                    this.mesh.lookAt(this.originalPosition.clone().add(this.normal));
                }

                this.mesh.userData = { tile: this };

                scene.add(this.mesh);
            }

            toggle() {
                this.state = (this.state + 1) % 3;
                this.updateVisuals();
                scheduleSave();
            }

            setState(newState) {
                if (this.state === newState) return;
                this.state = newState;
                this.updateVisuals();
            }

            setSelection(selected) {
                this.isSelected = selected;
                this.material.emissive.setHex(selected ? CONFIG.colors.selection : 0x000000);
                this.material.emissiveIntensity = selected ? 0.5 : 0;
            }

            updateVisuals() {
                // Defer stats update 
                requestAnimationFrame(updateStats);

                if (this.state === 1) { // Insulated
                    this.material.color.setHex(CONFIG.colors.render);
                    this.material.roughness = 0.5;
                    const offset = this.normal.clone().multiplyScalar(CONFIG.insulationDepth);
                    this.mesh.position.copy(this.originalPosition.clone().add(offset));
                } else if (this.state === 2) { // Flush Render
                    this.material.color.setHex(CONFIG.colors.flushRender);
                    this.material.roughness = 0.5;
                    this.mesh.position.copy(this.originalPosition);
                } else { // Brick
                    this.material.color.setHex(CONFIG.colors.brick);
                    this.material.roughness = 0.9;
                    this.mesh.position.copy(this.originalPosition);
                }
            }
        }

        // --- Wall Generation Logic ---

        function isInsideHole(localX, localY) {
            // Standard check for skipping
            // Check Rectangular part
            const halfW = CONFIG.window.width / 2;
            if (localX > -halfW && localX < halfW && localY < CONFIG.window.heightRect) {
                return true;
            }
            // Check Arch part (approximate for skipping full tiles)
            if (localY >= CONFIG.window.heightRect) {
                const dy = localY - CONFIG.window.heightRect;
                // Strict check: Is the tile center DEEP inside?
                if (localX * localX + dy * dy < (CONFIG.window.archRadius - 0.1) ** 2) {
                    return true;
                }
            }
            return false;
        }

        function isIntersectingArch(localX, localY, width, height) {
            // Only care if above rect height
            const tileBottom = localY - height / 2;
            const tileTop = localY + height / 2;

            if (tileTop < CONFIG.window.heightRect) return false; // purely rectangular part

            // Define tile bounds
            const minX = localX - width / 2;
            const maxX = localX + width / 2;
            const minY = localY - height / 2;
            const maxY = localY + height / 2;

            const dy = Math.max(0, localY - CONFIG.window.heightRect);
            const dist = Math.sqrt(localX * localX + dy * dy);

            // Use a wider tolerance to catch all boundary tiles
            const tolerance = Math.max(width, height) * 2.5;
            if (dist > CONFIG.window.archRadius - tolerance && dist < CONFIG.window.archRadius + tolerance) {
                return true;
            }
            return false;
        }

        function createWall(p1, p2, type = 'solid', wallId) {
            const length = p1.distanceTo(p2);
            const height = CONFIG.wallHeight;

            const wallDir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const upDir = new THREE.Vector3(0, 1, 0);
            let normal = new THREE.Vector3().crossVectors(wallDir, upDir).normalize();

            const midPoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            if (normal.dot(midPoint) > 0) normal.negate();

            const stepsX = Math.ceil(length / CONFIG.tileSize);
            const stepsY = Math.ceil(height / CONFIG.tileSize);
            const realTileW = length / stepsX;
            const realTileH = height / stepsY;

            let holeCenterX = length / 2;
            if (type === 'window' || type === 'door') {
                if (Math.abs(p1.z + 2) < 0.01 && p1.x < 0) { holeCenterX = 2.0; }
                if (Math.abs(p1.x - 2) < 0.01 && p1.z < 0) { holeCenterX = 0.75; }
            }
            if (type === 'chamfer') { type = 'door'; holeCenterX = length / 2; }

            for (let ix = 0; ix < stepsX; ix++) {
                for (let iy = 0; iy < stepsY; iy++) {
                    const localX = (ix + 0.5) * realTileW;
                    const localY = (iy + 0.5) * realTileH;
                    const relativeX = localX - holeCenterX;

                    // 1. Fully Inside -> Skip
                    // Use slightly stricter check to ensure we don't delete border tiles

                    // Check if this tile should be skipped (fully inside window)
                    let skip = false;
                    if (type === 'window') {
                        // Rect part
                        if (relativeX > -CONFIG.window.width / 2 && relativeX < CONFIG.window.width / 2 && localY < CONFIG.window.heightRect) {
                            skip = true;
                        }
                        // Arch part - loose check
                        else if (localY >= CONFIG.window.heightRect) {
                            const dy = localY - CONFIG.window.heightRect;
                            // Only skip if safely inside
                            if (relativeX * relativeX + dy * dy < (CONFIG.window.archRadius * 0.9) ** 2) {
                                skip = true;
                            }
                        }
                    }

                    if (type === 'door' && isHoleDoor(relativeX, localY)) skip = true;

                    if (skip) continue;

                    const pos = p1.clone()
                        .add(wallDir.clone().multiplyScalar(localX))
                        .add(upDir.clone().multiplyScalar(localY));

                    // 2. Arch Intersection -> CSG Tile
                    if (type === 'window' && isIntersectingArch(relativeX, localY, realTileW, realTileH)) {
                        // Create Tile Brush
                        const tileGeo = new THREE.BoxGeometry(realTileW * 0.95, realTileH * 0.95, 0.02);
                        const tileBrush = new Brush(tileGeo);

                        const localHoleX = -relativeX;
                        const localHoleY = CONFIG.window.heightRect - localY;

                        archCutter.position.set(localHoleX, localHoleY, 0);
                        archCutter.updateMatrixWorld();

                        tileBrush.updateMatrixWorld();

                        const result = csgEvaluator.evaluate(tileBrush, archCutter, SUBTRACTION);
                        const resGeo = result.geometry;

                        const tile = new Tile(pos, normal, realTileW, realTileH, 'wall', wallId, ix, iy, resGeo);
                        state.tiles.push(tile);

                    } else {
                        const tile = new Tile(pos, normal, realTileW, realTileH, 'wall', wallId, ix, iy);
                        state.tiles.push(tile);
                    }
                }
            }

            if (type === 'window') {
                const holeCenterPos = p1.clone().add(wallDir.clone().multiplyScalar(holeCenterX));
                createReveal(holeCenterPos, normal, wallDir, wallId);
            }
        }

        function isHoleDoor(localX, localY) {
            const halfW = CONFIG.door.width / 2;
            return (localX > -halfW && localX < halfW && localY < CONFIG.door.height);
        }

        function createReveal(centerPos, wallNormal, wallDir, parentWallId) {
            const halfW = CONFIG.window.width / 2;
            const depth = CONFIG.window.depth;

            const stepsY = Math.ceil(CONFIG.window.heightRect / CONFIG.tileSize);
            const stepsD = Math.ceil(depth / CONFIG.tileSize);

            const tileH = CONFIG.window.heightRect / stepsY;
            const tileD = depth / stepsD;

            // 1. Left Reveal
            const leftId = parentWallId + '_reveal_left';
            for (let iy = 0; iy < stepsY; iy++) {
                for (let id = 0; id < stepsD; id++) {
                    const ly = (iy + 0.5) * tileH;
                    const ld = (id + 0.5) * tileD;

                    const pos = centerPos.clone()
                        .sub(wallDir.clone().multiplyScalar(halfW))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(ly))
                        .sub(wallNormal.clone().multiplyScalar(ld));

                    const tile = new Tile(pos, wallDir, tileD, tileH, 'reveal', leftId, id, iy);
                    state.tiles.push(tile);
                }
            }

            // 2. Right Reveal 
            const rightId = parentWallId + '_reveal_right';
            for (let iy = 0; iy < stepsY; iy++) {
                for (let id = 0; id < stepsD; id++) {
                    const ly = (iy + 0.5) * tileH;
                    const ld = (id + 0.5) * tileD;

                    const pos = centerPos.clone()
                        .add(wallDir.clone().multiplyScalar(halfW))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(ly))
                        .sub(wallNormal.clone().multiplyScalar(ld));

                    const tile = new Tile(pos, wallDir.clone().negate(), tileD, tileH, 'reveal', rightId, id, iy);
                    state.tiles.push(tile);
                }
            }

            // 3. Arch Reveal
            const archId = parentWallId + '_reveal_arch';
            const archCenter = centerPos.clone().add(new THREE.Vector3(0, 1, 0).multiplyScalar(CONFIG.window.heightRect));
            const arcSteps = 12;
            const arcLen = Math.PI * CONFIG.window.archRadius;
            const tileArcLen = arcLen / arcSteps;

            for (let i = 0; i < arcSteps; i++) {
                const theta = (i + 0.5) * (Math.PI / arcSteps);
                const localX = Math.cos(theta) * CONFIG.window.archRadius;
                const localY = Math.sin(theta) * CONFIG.window.archRadius;

                for (let id = 0; id < stepsD; id++) {
                    const ld = (id + 0.5) * tileD;
                    const pos = archCenter.clone()
                        .add(wallDir.clone().multiplyScalar(localX))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(localY))
                        .sub(wallNormal.clone().multiplyScalar(ld));

                    const tileNormal = wallDir.clone().multiplyScalar(Math.cos(theta))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(Math.sin(theta)))
                        .negate()
                        .normalize();

                    const tile = new Tile(pos, tileNormal, tileD, tileArcLen, 'reveal', archId, id, i);
                    state.tiles.push(tile);
                }
            }
        }

        // --- Architecture Helpers ---
        function registerArch(mesh) {
            mesh.userData.isArchitecture = true;
            scene.add(mesh);
        }

        // --- Mezzanine Generation ---
        function createMezzanine() {
            const mainGeo = new THREE.BoxGeometry(4, 0.25, 1);
            const mainMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.mezzanine, roughness: 0.8, transparent: true });
            const mainMesh = new THREE.Mesh(mainGeo, mainMat);
            mainMesh.position.set(0, 2.225, 1.5);
            mainMesh.receiveShadow = true;
            mainMesh.castShadow = true;
            registerArch(mainMesh);

            const extGeo = new THREE.BoxGeometry(CONFIG.window.width, 0.25, CONFIG.window.depth);
            const extMesh = new THREE.Mesh(extGeo, mainMat);
            extMesh.position.set(0, 2.225, 2 + CONFIG.window.depth / 2);
            extMesh.receiveShadow = true;
            registerArch(extMesh);
        }

        // --- Staircase & Features Generation ---
        function createStaircase() {
            // Stairs along West Wall (X=-2) from Mezzanine (Z=1, H=2.35) -> North
            // Mezzanine Floor: 2.35m.
            // Total steps = 13. StepH = 2.35/13 = 0.18m.
            // Thread = 0.25m.
            // Width = 0.6m.

            const stairMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.stairs, roughness: 0.7, transparent: true });
            const stepH = 2.35 / 13;
            const tread = 0.25;
            const width = 0.6;

            // --- 1. Top/West Run (Descending North) ---
            // Steps 13 down to 5. (9 steps).
            // Step 13 (Top): Riser from H(12) to H(13) (2.35). Tread at H(13)? No, tread at H(12) usually for top step if it meets floor? 
            // Or Top step is flush with floor.
            // Let's assume Top Step Tread is at 2.35 - stepH.
            // Riser at Z=1.0. Tread extends North (-Z).
            // Z start = 1.0.
            // Shape in Z-Y plane.
            // Vertices (Clockwise or CCW):

            const shape = new THREE.Shape();
            shape.moveTo(0, 2.35 - stepH); // Top Tread Start (at Z=0 relative to start?)
            // Let's define origin at (Z=1.0, Y=0).
            // Local Z goes negative (North).

            const numWestSteps = 9; // 13 down to 5
            let currentH = 2.35 - stepH;
            let currentZ = 0;

            // Zig Zag Top
            for (let i = 0; i < numWestSteps; i++) {
                // Horizontal Tread
                shape.lineTo(currentZ - tread, currentH);
                currentZ -= tread;

                // Vertical Riser (down)
                if (i < numWestSteps - 1) {
                    currentH -= stepH;
                    shape.lineTo(currentZ, currentH);
                }
            }

            // Now at bottom of last riser (Step 5).
            // CurrentZ = -9 * 0.25 = -2.25.
            // CurrentH = Step 5 Height - stepH? 
            // Step 5 H = 5 * stepH. 
            // We are at H = (13 - 9) * stepH = 4 * stepH?
            // Wait. 
            // Top Step is 13.
            // i=0: Tread 13 (at H 12.something). Riser down to H 11.something?
            // Let's count heights properly.
            // Floor is H=2.35.
            // Step 13 Tread Level = 2.35. (If flush). Or 2.35 - stepH?
            // Usually top tread is floor level.
            // So Step 13 Tread is at 2.35.
            // Riser drops to 2.35 - stepH.
            // But we start from Mezzanine edge.

            // Re-do Profile:
            // Start at (0, 2.35). (Mezzanine Edge).
            // Riser Down -> (0, 2.35 - stepH).
            // Tread Forward -> (-0.25, 2.35 - stepH).
            // Riser Down -> (-0.25, 2.35 - 2*stepH).
            // ...

            const westShape = new THREE.Shape();
            westShape.moveTo(0, 2.35);

            for (let i = 0; i < numWestSteps; i++) {
                const hTop = 2.35 - i * stepH;
                const hBot = 2.35 - (i + 1) * stepH;
                const zNear = -i * tread;
                const zFar = -(i + 1) * tread;

                westShape.lineTo(zNear, hBot); // Riser down
                westShape.lineTo(zFar, hBot);  // Tread forward
            }

            // Bottom Point: (zFar_last, hBot_last).
            // Z = -2.25. H = 2.35 - 9*stepH = 4*stepH. (Correct, reaches Step 4 level).

            // Slope Bottom (Soffit)
            // Normal depth 300mm.
            // Calculate vector from Top Nosing (0, 2.35) to Bottom Nosing (-2.25, 4*stepH).
            // Or simpler: Offset the zigzag points? No, flat slope.
            // Start Point Soffit: Top offset.
            // End Point Soffit: Bottom offset.
            // Let's just create a thick slab.
            // Slope line from (-2.25, 4*stepH - 0.3?) to (0, 2.35 - 0.3?).
            // Actual efficient calculation:
            // Angle of stairs = atan(stepH / tread).
            // Normal vector (-sin, cos).
            // Offset = 0.3.
            // dx = 0.3 * sin(ang). dy = -0.3 * cos(ang).

            const angle = Math.atan2(stepH, tread);
            const dx = 0.3 * Math.sin(angle);
            const dy = 0.3 * Math.cos(angle);

            // Bottom corner point
            const zLast = -numWestSteps * tread;
            const hLast = 2.35 - numWestSteps * stepH;

            westShape.lineTo(zLast + dx, hLast - dy); // Bottom Soffit Corner
            westShape.lineTo(0 + dx, 2.35 - dy);      // Top Soffit Corner
            westShape.lineTo(0, 2.35);                // Close

            const extrudeSettings = { depth: 0.6, bevelEnabled: false };
            const westGeo = new THREE.ExtrudeGeometry(westShape, extrudeSettings);

            // Rotate to align with West Wall (Face East).
            // Shape is in XY. We treated X as Z.
            // So Rotate Y -90? Or just manual mesh positioning.
            // Current: +Y is Up. +X is -Z (North).
            // Extrude Depth is +Z (which is +X in world).
            // We want Extrusion along +X world (Width). 0.6.
            // We want Shape X to map to World Z.
            // We want Shape Y to map to World Y.

            const westMesh = new THREE.Mesh(westGeo, stairMat);
            // Default: Extrude along Z. Shape in XY.
            // Rotate Y 90 deg -> Shape in ZY. Extrude along X.
            westMesh.rotation.y = Math.PI / 2;
            // Position: 
            // Origin (0,0) of shape maps to (0,0,0) of Mesh.
            // We want Origin (Top Edge) to be at (X=-1.94, Y=0, Z=1.0).
            // BUT Rotation Y 90 maps +X_shape to +Z_world? 
            // Let's check rotation. R_y(90): (x,y,z) -> (z, y, -x).
            // Shape pt (z_s, y_s, 0). -> (0, y_s, -z_s).
            // Wait, shape X was "Negative Z". so z_s is negative. -z_s is positive.
            // That means stairs go South. We want North (Negative Z).
            // So we need Shape X (negative) to map to World Z (negative).
            // So (z_s, y_s, 0) -> (0, y_s, z_s).
            // Rotation Y -90? (z, y, x)? No.
            // Let's just rotate Y 90 and Flip Z? 
            // Simplest: Rotate Y -90 -> ( -z, y, x ).
            // Shape X is negative. -X is positive. Maps to Z positive. Wrong.

            // Let's manually rotate geometry.
            westGeo.rotateY(Math.PI / 2);
            // Now X_shape -> Z_world. Y_shape -> Y_world. Z_extrude -> X_world.
            // Shape X (0 to -2.25) -> World Z (0 to -2.25). Correct (goes North).
            // Extrude (0 to 0.6) -> World X (0 to 0.6).
            // We want World X to be [-1.94, -1.34].
            // Currently 0..0.6.
            // Position Mesh at X = -1.94.
            // Z Origin was 1.0. Shape starts at 0. So Mesh Z = 1.0.

            westMesh.position.set(-1.94, 0, 1.0);
            registerArch(westMesh);

            // --- 2. Corner Winder (Steps 3, 4) ---
            // Heights: Step 3 (2*stepH to 3*stepH). Step 4 (3*stepH to 4*stepH).
            // Corner Box: X[-1.94, -1.34], Z[-1.94, -1.34].
            // Step 4 (Higher): North-West half? Or?
            // Transitioning from West Run (Ends at Z=-1.25, H=4*stepH) to North Run.
            // West Run ends at Z = 1.0 - 2.25 = -1.25.
            // Corner starts at Z = -1.34.
            // Gap filled by landing/winder.
            // Let's put Step 4 at the landing of West Run.
            // Actually West Run ends at Step 5 base (H=4*stepH). 
            // So Step 4 is the next one down.
            // Step 4 should be the Top Winder.
            // Step 3 is Bottom Winder.

            // Let's make Step 4 a Triangle.
            // (X,Z) points: (-1.94, -1.25) [Connects to West Run?], (-1.34, -1.25), (-1.94, -1.94)? 
            // West Run ends at Z=-1.25.
            // Winder Box is Z[-1.94, -1.34]. 
            // Gap of 0.09m? Let's assume West Run connects flush.

            // Winder Geometry: 2 Prisms.
            // Prism 1 (Step 4): H = 4*stepH. Thickness stepH? 
            // Shape: Square minus Triangle?
            // Let's just make 2 Box stairs for robustness in low-fidelity.
            // Or 2 Triangles.

            const winderMat = stairMat;
            const cornerSize = 0.6;
            const cornerX = -1.94;
            const cornerZ = -1.94;

            // Step 4 (Top Corner)
            // Shape: Triangle (0,0) -> (0.6, 0) -> (0, 0.6).
            // In XZ plane.
            const s4Shape = new THREE.Shape();
            s4Shape.moveTo(0, 0);
            s4Shape.lineTo(cornerSize, 0);
            s4Shape.lineTo(0, cornerSize);
            s4Shape.lineTo(0, 0);

            const s4Geo = new THREE.ExtrudeGeometry(s4Shape, { depth: stepH, bevelEnabled: false });
            s4Geo.rotateX(Math.PI / 2); // Make flat
            s4Geo.translate(cornerX, 4 * stepH - stepH, cornerZ + cornerSize); // Adjust pos
            // Wait orientation...
            // Needs to connect West Run (North End) to Step 3.
            // Let's just use a Box for Step 4 at corner, and Box for Step 3.
            // Step 4: Box at (-1.94, 3*stepH, -1.34) size (0.6, stepH, 0.6)? No.

            // Simple Winder:
            // Step 4 (Higher): Box 0.6 x stepH x 0.6. Pos: Corner.
            // Step 3 (Lower): Box 0.6 x stepH x 0.6 ?? No overlap.
            // Let's split corner: 
            // Step 4: North Half? (-1.94, -1.64) to (-1.34, -1.34)?
            // Let's just make Step 3 and 4 fill the corner block height 2*stepH to 4*stepH.
            // Step 4 is a platform 0.6x0.6 at H=3.5stepH (mid).
            // Just a box for now as requested "geometry isn't quite right" implies it needs fixing.
            // "double height step" was the complaint.
            // Ensure H levels match.
            // West End H = 4*stepH.
            // Step 4 Top = 4*stepH.
            // Step 3 Top = 3*stepH.
            // North Start H = 2*stepH.

            const step4Geo = new THREE.BoxGeometry(0.6, stepH, 0.6);
            const step4 = new THREE.Mesh(step4Geo, winderMat);
            step4.position.set(-1.64, 3.5 * stepH, -1.64);
            registerArch(step4);

            const step3Geo = new THREE.BoxGeometry(0.6, stepH, 0.6);
            const step3 = new THREE.Mesh(step3Geo, winderMat);
            step3.position.set(-1.64, 2.5 * stepH, -1.64);
            // Shrink step 3 to indicate winder? 
            // User wants "Winder".
            // Let's Cut Step 3 in half diagonally.
            // But for now stacked boxes are safer than broken geometry.
            registerArch(step3);

            // --- 3. North Run (Steps 1, 2) ---
            // Going East from Corner.
            // Starts X = -1.34.
            // Step 2 Top = 2*stepH.
            // Step 1 Top = 1*stepH.
            // Length = 2 treads = 0.5m.
            // Ends X = -0.84.

            const northShape = new THREE.Shape();
            northShape.moveTo(0, 2 * stepH);

            // Step 2
            northShape.lineTo(tread, 2 * stepH); // Tread
            northShape.lineTo(tread, stepH);   // Riser
            // Step 1
            northShape.lineTo(tread * 2, stepH);
            northShape.lineTo(tread * 2, 0);

            // Soffit
            // Slope back
            const nDx = 0.3 * Math.sin(angle);
            const nDy = 0.3 * Math.cos(angle);

            northShape.lineTo(tread * 2 - nDx, 0 - nDy);
            northShape.lineTo(0 - nDx, 2 * stepH - nDy);
            northShape.lineTo(0, 2 * stepH);

            const northGeo = new THREE.ExtrudeGeometry(northShape, extrudeSettings);
            // Extrude along Z (0.6).
            // North Wall is at Z=-2. Gap 60mm -> Z=-1.94.
            // Face South.
            // Shape X -> World X. Shape Y -> World Y.
            // Extrude Z -> World Z.
            // Shape starts X=0. We want X=-1.34.
            // Extrude 0..0.6. We want Z[-1.94, -1.34].
            // So Position Z = -1.94.

            const northMesh = new THREE.Mesh(northGeo, stairMat);
            northMesh.position.set(-1.34, 0, -1.94);
            registerArch(northMesh);

            // --- Solid Wall ---
            const wGeo = new THREE.BoxGeometry(0.2, 3.35, 2.34);
            const wMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.wallSolid, transparent: true });
            const wMesh = new THREE.Mesh(wGeo, wMat);
            wMesh.position.set(-1.24, 3.35 / 2, 1.0 - 2.34 / 2);
            registerArch(wMesh);

            // --- Glass Balustrade ---
            const gGeo = new THREE.BoxGeometry(3.14, 1.0, 0.05);
            const gMat = new THREE.MeshPhysicalMaterial({
                color: CONFIG.colors.glass,
                transmission: 0.9,
                opacity: 1, // Will be controlled by slider?
                transparent: true
            });
            const gMesh = new THREE.Mesh(gGeo, gMat);
            gMesh.position.set(0.43, 2.35 + 0.5, 1.0);
            registerArch(gMesh);
        }

        createMezzanine();
        createStaircase();

        // --- Build Geometry ---
        const SW = new THREE.Vector3(-2, 0, 2);
        const SE = new THREE.Vector3(2, 0, 2);
        const NW = new THREE.Vector3(-2, 0, -2);
        const NorthCut = new THREE.Vector3(0.75, 0, -2);
        const EastCut = new THREE.Vector3(2, 0, -0.75);

        createWall(SE, SW, 'window', 'south_wall');
        createWall(SW, NW, 'window', 'west_wall');
        createWall(NW, NorthCut, 'window', 'north_wall');
        createWall(EastCut, SE, 'window', 'east_wall');
        createWall(NorthCut, EastCut, 'chamfer', 'chamfer_wall');

        // --- Raycasting & Interaction Setup ---
        const rc = new THREE.Raycaster();
        const ptr = new THREE.Vector2();

        function onPointerDown(event) {
            if (event.target !== renderer.domElement) return;

            ptr.x = (event.clientX / window.innerWidth) * 2 - 1;
            ptr.y = - (event.clientY / window.innerHeight) * 2 + 1;

            rc.setFromCamera(ptr, camera);
            const intersects = rc.intersectObjects(scene.children);

            if (intersects.length > 0) {
                let targetObj = intersects[0].object;
                // Traverse up if we hit a child of a group (if any)
                // But here we just use userData check
                if (targetObj.userData && targetObj.userData.tile) {
                    const tile = targetObj.userData.tile;
                    if (event.button === 0) { // Left Click
                        tile.toggle();
                    } else if (event.button === 2) { // Right Click
                        handleRightClick(tile);
                    }
                }
            }
        }

        window.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('pointerdown', onPointerDown);

        function handleRightClick(tile) {
            if (!state.selectedTile) {
                state.selectedTile = tile;
                tile.setSelection(true);
            } else {
                if (state.selectedTile === tile) {
                    state.selectedTile = null;
                    tile.setSelection(false);
                    return;
                }
                if (state.selectedTile.wallId === tile.wallId) {
                    performBlockFill(state.selectedTile, tile);
                    state.selectedTile.setSelection(false);
                    state.selectedTile = null;
                } else {
                    state.selectedTile.setSelection(false);
                    state.selectedTile = tile;
                    tile.setSelection(true);
                }
            }
        }

        function performBlockFill(t1, t2) {
            const wallId = t1.wallId;
            const minX = Math.min(t1.gridX, t2.gridX);
            const maxX = Math.max(t1.gridX, t2.gridX);
            const minY = Math.min(t1.gridY, t2.gridY);
            const maxY = Math.max(t1.gridY, t2.gridY);

            const tilesInRange = state.tiles.filter(t =>
                t.wallId === wallId &&
                t.gridX >= minX && t.gridX <= maxX &&
                t.gridY >= minY && t.gridY <= maxY
            );

            if (tilesInRange.length === 0) return;

            const counts = { 0: 0, 1: 0, 2: 0 };
            tilesInRange.forEach(t => counts[t.state]++);

            let commonState = 0;
            let maxCount = -1;
            for (let s = 0; s <= 2; s++) {
                if (counts[s] > maxCount) {
                    maxCount = counts[s];
                    commonState = s;
                }
            }

            const nextState = (commonState + 1) % 3;
            tilesInRange.forEach(t => t.setState(nextState));
            scheduleSave();
        }

        // --- UI Listeners Setup ---
        document.getElementById('btn-reset').onclick = () => {
            state.tiles.forEach(t => t.setState(0)); // Brick
            scheduleSave();
        };
        document.getElementById('btn-render-all').onclick = () => {
            state.tiles.forEach(t => t.setState(1)); // Insulated
            scheduleSave();
        };
        document.getElementById('btn-flush-all').onclick = () => {
            state.tiles.forEach(t => t.setState(2)); // Flush
            scheduleSave();
        };
        document.getElementById('btn-wireframe').onclick = () => {
            state.isWireframe = !state.isWireframe;
            scene.traverse(obj => {
                if (obj.isMesh) {
                    obj.material.wireframe = state.isWireframe;
                }
            });
        };
        document.getElementById('btn-export').onclick = () => {
            saveToFirebase();
        };

        document.getElementById('opacity-slider').oninput = (e) => {
            const val = parseFloat(e.target.value);
            scene.traverse(obj => {
                if (obj.userData && obj.userData.isArchitecture) {
                    obj.material.opacity = val;
                    // If opacity is 1, maybe turn off transparent to deal with depth sorting if needed? 
                    // But generally fine to leave transparent=true.
                }
            });
        };

        // --- Firebase Init ---
        signInAnonymously(auth).then(() => {
            onSnapshot(doc(db, 'artifacts', APP_ID, 'configurations', DOC_ID), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.tiles && Array.isArray(data.tiles)) {
                        state.remoteUpdateInProgress = true;
                        data.tiles.forEach((val, idx) => {
                            if (state.tiles[idx]) {
                                state.tiles[idx].setState(val);
                            }
                        });
                        state.remoteUpdateInProgress = false;
                        updateStats();
                    }
                }
            });
        }).catch(console.error);

        updateStats();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
