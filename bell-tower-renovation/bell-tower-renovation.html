<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bell Tower Renovation Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            width: 250px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2em;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #ccc;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #444;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #555;
        }

        button.primary {
            background: #0078d4;
        }

        button.primary:hover {
            background: #106ebe;
        }

        .stats {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
            font-size: 0.85em;
            color: #aaa;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .instructions {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 15px;
            font-style: italic;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="ui-panel">
        <h2>Renovation Controls</h2>
        <div class="instructions">Click tiles to toggle: Brick -> Insulated -> Flush Render.</div>

        <div class="control-group">
            <button id="btn-reset" class="primary">Reset to Exposed Brick</button>
            <button id="btn-render-all">Set All to Insulated</button>
            <button id="btn-flush-all">Set All to Flush Render</button>
            <button id="btn-wireframe">Toggle Wireframe</button>
            <button id="btn-export">Export Configuration</button>
        </div>

        <div class="stats">
            <div class="stat-row">
                <span>Total Tiles:</span>
                <span id="stat-total">0</span>
            </div>
            <div class="stat-row">
                <span>Insulated (60mm):</span>
                <span id="stat-insulated">0</span>
            </div>
            <div class="stat-row">
                <span>Flush Render:</span>
                <span id="stat-flush">0</span>
            </div>
            <div class="stat-row">
                <span>Coverage:</span>
                <span id="stat-percent">0%</span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const CONFIG = {
            roomSize: 4.0,           // 4x4m footprint
            wallHeight: 6.0,         // Default 6m height
            chamferStart: 0.75,      // Distance from center where chamfer starts (at window edge)
            window: {
                width: 1.5,
                heightRect: 3.1,
                archRadius: 0.75,
                heightTotal: 3.85,
                depth: 0.45 // Reveal depth
            },
            door: {
                width: 0.7,
                height: 1.5
            },
            tileSize: 0.25,          // 25cm grid
            insulationDepth: 0.06,   // 60mm offset
            colors: {
                brick: 0x8b4513,     // SaddleBrown
                render: 0xffffff,    // White
                flushRender: 0xeeeeee, // Slightly off-white to distinguish? Or stick to white. user said "same finish... negligable thickness"
                wireframe: 0x333333,
                background: 0x202020
            }
        };

        // --- State ---
        const state = {
            tiles: [], // Array of Tile objects
            isWireframe: false
        };

        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.colors.background);

        // Add some fog for depth
        scene.fog = new THREE.Fog(CONFIG.colors.background, 5, 20);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4, 0); // Start inside/above looking down
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 2, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffaa00, 0.5, 10);
        pointLight.position.set(0, 4, 0);
        scene.add(pointLight);

        // --- Helper Functions (Hoisted) ---
        function updateStats() {
            const total = state.tiles.length;
            const insulated = state.tiles.filter(t => t.state === 1).length;
            const flush = state.tiles.filter(t => t.state === 2).length;
            const percent = Math.round(((insulated + flush) / total) * 100);

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-insulated').innerText = insulated;
            document.getElementById('stat-flush').innerText = flush;
            document.getElementById('stat-percent').innerText = percent + '%';
        }

        // --- Helper Classes ---

        class Tile {
            constructor(position, normal, width, height, type = 'wall') {
                this.state = 0; // 0: Brick, 1: Insulated, 2: Flush Render
                this.originalPosition = position.clone();
                this.normal = normal.clone();
                this.type = type; // 'wall', 'reveal'

                // Create geometry
                // Use user data width/height for box
                const geometry = new THREE.BoxGeometry(width * 0.95, height * 0.95, 0.02);

                // Create materials logic handled in updateVisuals
                this.material = new THREE.MeshStandardMaterial({
                    color: CONFIG.colors.brick,
                    roughness: 0.9,
                    metalness: 0.1
                });

                this.mesh = new THREE.Mesh(geometry, this.material);
                this.mesh.position.copy(this.originalPosition);

                // Orient functionality: Look at position + normal
                // Box default faces Z. So lookAt(pos + normal) aligns Z axis with normal. Correct.
                this.mesh.lookAt(this.originalPosition.clone().add(this.normal));

                this.mesh.userData = { tile: this }; // Link back to class

                scene.add(this.mesh);
            }

            toggle() {
                this.state = (this.state + 1) % 3;
                this.updateVisuals();
            }

            setState(newState) {
                this.state = newState;
                this.updateVisuals();
            }

            updateVisuals() {
                // Defer stats update to avoid layout thrashing if mass updating
                requestAnimationFrame(updateStats);

                if (this.state === 1) { // Insulated
                    this.material.color.setHex(CONFIG.colors.render);
                    this.material.roughness = 0.5;
                    // Move inwards along normal
                    const offset = this.normal.clone().multiplyScalar(CONFIG.insulationDepth);
                    this.mesh.position.copy(this.originalPosition.clone().add(offset));
                } else if (this.state === 2) { // Flush Render
                    this.material.color.setHex(CONFIG.colors.flushRender); // Same white basically
                    this.material.roughness = 0.5; // Smooth plaster
                    this.mesh.position.copy(this.originalPosition); // No offset
                } else { // Brick
                    this.material.color.setHex(CONFIG.colors.brick);
                    this.material.roughness = 0.9;
                    this.mesh.position.copy(this.originalPosition);
                }
            }
        }

        // --- Wall Generation Logic ---

        // Helper to check if a point is within a window or door
        function isHole(localX, localY, type) {
            if (type === 'window') {
                // Check Rectangular part
                const halfW = CONFIG.window.width / 2;
                if (localX > -halfW && localX < halfW && localY < CONFIG.window.heightRect) {
                    return true;
                }
                // Check Arch part
                if (localY >= CONFIG.window.heightRect) {
                    const dy = localY - CONFIG.window.heightRect;
                    // Circle equation: x^2 + dy^2 < r^2
                    if (localX * localX + dy * dy < CONFIG.window.archRadius * CONFIG.window.archRadius) {
                        return true;
                    }
                }
            } else if (type === 'door') {
                const halfW = CONFIG.door.width / 2;
                if (localX > -halfW && localX < halfW && localY < CONFIG.door.height) {
                    return true;
                }
            }
            return false;
        }

        function createWall(p1, p2, type = 'solid') {
            const length = p1.distanceTo(p2);
            const height = CONFIG.wallHeight;

            // Calculate basis vectors
            const wallDir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const upDir = new THREE.Vector3(0, 1, 0);

            // Normal calculation:
            let normal = new THREE.Vector3().crossVectors(wallDir, upDir).normalize();

            // Check inward facing
            const midPoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            if (normal.dot(midPoint) > 0) {
                normal.negate();
            }

            const stepsX = Math.ceil(length / CONFIG.tileSize);
            const stepsY = Math.ceil(height / CONFIG.tileSize);

            const realTileW = length / stepsX;
            const realTileH = height / stepsY;

            // Determine hole center X offset based on wall type
            let holeCenterX = length / 2;

            if (type === 'window' || type === 'door') {
                if (Math.abs(p1.z + 2) < 0.01 && p1.x < 0) { holeCenterX = 2.0; } // North Wall detection
                if (Math.abs(p1.x - 2) < 0.01 && p1.z < 0) { holeCenterX = 0.75; } // East Wall detection
            }

            if (type === 'chamfer') {
                type = 'door';
                holeCenterX = length / 2;
            }

            for (let ix = 0; ix < stepsX; ix++) {
                for (let iy = 0; iy < stepsY; iy++) {
                    // Calculate center of tile in 2D Wall Space (Start at P1)
                    const localX = (ix + 0.5) * realTileW;
                    const localY = (iy + 0.5) * realTileH;

                    // Center the coords relative to the Hole Center
                    const relativeX = localX - holeCenterX;

                    // Check holes
                    let skip = false;
                    if (type === 'window') {
                        if (isHole(relativeX, localY, 'window')) skip = true;
                    } else if (type === 'door') {
                        if (isHole(relativeX, localY, 'door')) skip = true;
                    }

                    if (!skip) {
                        const pos = p1.clone()
                            .add(wallDir.clone().multiplyScalar(localX))
                            .add(upDir.clone().multiplyScalar(localY));

                        const tile = new Tile(pos, normal, realTileW, realTileH);
                        state.tiles.push(tile);
                    }
                }
            }

            // If it's a window wall, generate Reveal Tiles
            if (type === 'window') {
                // Find world position of hole center
                const holeCenterPos = p1.clone().add(wallDir.clone().multiplyScalar(holeCenterX));
                createReveal(holeCenterPos, normal, wallDir);
            }
        }

        function createReveal(centerPos, wallNormal, wallDir) {
            // centerPos is at Y=0 (bottom center of window)
            // wallNormal points INWARDS (towards room center)
            // wallDir points along wall length (Right)

            // We want reveal tiles to face perpendicular to wall normal.
            // Depth goes OUTWARDS (opposite to wallNormal).
            // BUT wait, if wallNormal points IN, then -wallNormal points OUT.
            // Reveal tiles are surfaces.
            // Left Reveal (on -X side) faces +X (Right).
            // Right Reveal (on +X side) faces -X (Left).
            // Arch Reveal faces Center.

            const halfW = CONFIG.window.width / 2;
            const depth = CONFIG.window.depth;

            // Calculate verticals
            const stepsY = Math.ceil(CONFIG.window.heightRect / CONFIG.tileSize);
            const stepsD = Math.ceil(depth / CONFIG.tileSize);

            const tileH = CONFIG.window.heightRect / stepsY;
            const tileD = depth / stepsD;

            // 1. Left Reveal (on the -X side relative to window center)
            // Its position starts at centerPos - halfW*wallDir.
            // It extends backwards along -wallNormal.
            // Its Normal points towards +wallDir (Right).

            for (let iy = 0; iy < stepsY; iy++) {
                for (let id = 0; id < stepsD; id++) {
                    const ly = (iy + 0.5) * tileH;
                    const ld = (id + 0.5) * tileD; // depth from inner face

                    const pos = centerPos.clone()
                        .sub(wallDir.clone().multiplyScalar(halfW)) // Left Edge
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(ly)) // Up
                        .sub(wallNormal.clone().multiplyScalar(ld)); // Back

                    const tile = new Tile(pos, wallDir, tileD, tileH, 'reveal');
                    state.tiles.push(tile);
                }
            }

            // 2. Right Reveal (on the +X side)
            // Normal points -wallDir (Left).
            for (let iy = 0; iy < stepsY; iy++) {
                for (let id = 0; id < stepsD; id++) {
                    const ly = (iy + 0.5) * tileH;
                    const ld = (id + 0.5) * tileD;

                    const pos = centerPos.clone()
                        .add(wallDir.clone().multiplyScalar(halfW)) // Right Edge
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(ly))
                        .sub(wallNormal.clone().multiplyScalar(ld));

                    const tile = new Tile(pos, wallDir.clone().negate(), tileD, tileH, 'reveal');
                    state.tiles.push(tile);
                }
            }

            // 3. Arch Reveal
            // Curved surface. Center is at Top of Rect.
            const archCenter = centerPos.clone().add(new THREE.Vector3(0, 1, 0).multiplyScalar(CONFIG.window.heightRect));
            const arcSteps = 12;
            const arcLen = Math.PI * CONFIG.window.archRadius; // Half circumference
            const tileArcLen = arcLen / arcSteps;

            for (let i = 0; i < arcSteps; i++) {
                // Angle goes from 0 to PI.
                // 0 corresponds to Right side (+wallDir).
                // PI corresponds to Left side (-wallDir).
                const theta = (i + 0.5) * (Math.PI / arcSteps);

                // Calc local pos on arc
                // X along wallDir = cos(theta) * R
                // Y along Up = sin(theta) * R
                const localX = Math.cos(theta) * CONFIG.window.archRadius;
                const localY = Math.sin(theta) * CONFIG.window.archRadius;

                // Loop Depth
                for (let id = 0; id < stepsD; id++) {
                    const ld = (id + 0.5) * tileD;

                    // Position
                    const pos = archCenter.clone()
                        .add(wallDir.clone().multiplyScalar(localX))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(localY))
                        .sub(wallNormal.clone().multiplyScalar(ld));

                    // Normal points towards center (inwards).
                    // Vector from Pos to Center (projected on plane).
                    // Normal = -(cos(theta)*wallDir + sin(theta)*Up)
                    const tileNormal = wallDir.clone().multiplyScalar(Math.cos(theta))
                        .add(new THREE.Vector3(0, 1, 0).multiplyScalar(Math.sin(theta)))
                        .negate()
                        .normalize();

                    // For Arch tiles, width is tileD, height is ArcLen
                    const tile = new Tile(pos, tileNormal, tileD, tileArcLen, 'reveal');
                    state.tiles.push(tile);
                }
            }

        }

        // --- Build Geometry ---
        // Room: 4x4m centered at 0,0. Corners: +/- 2.

        // Corners:
        const SW = new THREE.Vector3(-2, 0, 2);
        const SE = new THREE.Vector3(2, 0, 2);
        const NW = new THREE.Vector3(-2, 0, -2);
        const NorthCut = new THREE.Vector3(0.75, 0, -2);
        const EastCut = new THREE.Vector3(2, 0, -0.75);

        // 1. South Wall (Full)
        createWall(SE, SW, 'window');

        // 2. West Wall (Full)
        createWall(SW, NW, 'window');

        // 3. North Wall (Partial)
        createWall(NW, NorthCut, 'window');

        // 4. East Wall (Partial)
        createWall(EastCut, SE, 'window');

        // 5. Chamfer Wall
        createWall(NorthCut, EastCut, 'chamfer');


        // --- Raycasting & Interaction Setup ---
        const rc = new THREE.Raycaster();
        const ptr = new THREE.Vector2();

        function onPointerDown(event) {
            ptr.x = (event.clientX / window.innerWidth) * 2 - 1;
            ptr.y = - (event.clientY / window.innerHeight) * 2 + 1;

            rc.setFromCamera(ptr, camera);

            const intersects = rc.intersectObjects(scene.children);

            for (let i = 0; i < intersects.length; i++) {
                const obj = intersects[i].object;
                if (obj.userData && obj.userData.tile) {
                    obj.userData.tile.toggle();
                    break;
                }
            }
        }
        window.addEventListener('pointerdown', onPointerDown);


        // --- UI Listeners Setup ---
        document.getElementById('btn-reset').onclick = () => {
            state.tiles.forEach(t => t.setState(0)); // Brick
        };
        document.getElementById('btn-render-all').onclick = () => {
            state.tiles.forEach(t => t.setState(1)); // Insulated
        };
        document.getElementById('btn-flush-all').onclick = () => {
            state.tiles.forEach(t => t.setState(2)); // Flush
        };
        document.getElementById('btn-wireframe').onclick = () => {
            state.isWireframe = !state.isWireframe;
            scene.traverse(obj => {
                if (obj.isMesh && obj.userData.tile) {
                    obj.material.wireframe = state.isWireframe;
                    obj.material.needsUpdate = true;
                }
            });
        };
        document.getElementById('btn-export').onclick = () => {
            const total = state.tiles.length;
            const insulated = state.tiles.filter(t => t.state === 1).length;
            const flush = state.tiles.filter(t => t.state === 2).length;
            const percent = Math.round(((insulated + flush) / total) * 100);

            alert(`Export:\nAdjusted Area: ${(total * CONFIG.tileSize * CONFIG.tileSize).toFixed(1)}m²\nInsulated: ${insulated}\nFlush Render: ${flush}\nTotal Covered: ${percent}%`);
        };

        // Initial stats
        updateStats();

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
