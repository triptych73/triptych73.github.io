    <!-- Error Handler -->

        window.onerror = function (msg, url, line, col, error) {
            const div = document.createElement('div');
            div.style.color = 'red';
            div.style.padding = '20px';
            div.style.fontFamily = 'monospace';
            div.style.backgroundColor = '#fee';
            div.style.borderBottom = '1px solid #ecc';
            div.innerHTML = `<h3>Application Error</h3><p><strong>${msg}</strong></p><p>Location: ${url}:${line}:${col}</p><pre>${error ? error.stack : ''}</pre>`;

            return false;
        };
    </script>

    <script type="text/babel">
        // Globals Check
        if (!window.React) console.error("React missing!");
        if (!window.ReactDOM) console.error("ReactDOM missing!");
        if (!window.Recharts) console.error("Recharts missing!");

        // Access Global DB
        const db = window.db;

        // Fallback for Recharts if it fails to expose globally immediately
        const Recharts = window.Recharts || window.recharts;

        if (!window.React || !window.ReactDOM || !Recharts) {
            throw new Error(`Libraries failed (React: ${!!window.React}, ReactDOM: ${!!window.ReactDOM}, Recharts: ${!!Recharts}). Check console.`);
        }

        // --- Configuration & Default Data ---
        const COST_DATA = {
            unindexed: 2462470.74,
            indexed: 2901788.39
        };



        const APP_DATA = null;

        // Static Yearly Summary (Consolidated from Excel 'Costs' sheet)
        const COST_SUMMARY = [
            { "year": 2004, "unindexed": 0, "indexed": 89947.58 },
            { "year": 2005, "unindexed": 0, "indexed": 236655.82 },
            { "year": 2006, "unindexed": 248919.0, "indexed": 246193.17 },
            { "year": 2007, "unindexed": 0.0, "indexed": 206511.65 },
            { "year": 2008, "unindexed": 100681.0, "indexed": 333387.80 },
            { "year": 2009, "unindexed": 559810.0, "indexed": 424242.98 },
            { "year": 2010, "unindexed": 95595.0, "indexed": 23514.07 },
            { "year": 2011, "unindexed": 4632.0, "indexed": 1913.92 },
            { "year": 2012, "unindexed": -25832.0, "indexed": 0.0 },
            { "year": 2013, "unindexed": -20355.0, "indexed": 0.0 },
            { "year": 2014, "unindexed": 56215.0, "indexed": 75405.30 },
            { "year": 2015, "unindexed": 29710.0, "indexed": 99220.71 },
            { "year": 2016, "unindexed": 117948.0, "indexed": 193419.85 },
            { "year": 2017, "unindexed": 184314.0, "indexed": 158359.21 },
            { "year": 2018, "unindexed": 127190.0, "indexed": 135661.79 },
            { "year": 2019, "unindexed": 69339.0, "indexed": 80405.89 },
            { "year": 2020, "unindexed": 55180.0, "indexed": 41303.94 },
            { "year": 2021, "unindexed": 30121.0, "indexed": 109098.38 },
            { "year": 2022, "unindexed": 117245.0, "indexed": 163720.55 },
            { "year": 2023, "unindexed": 0, "indexed": 22825.77 }
        ];

        // Shared Logic Helper
        const isAdvancedLoan = (t) => {
            const s = (t.source || "").toLowerCase();
            const amount = Math.abs(t.amount);

            // Condition 1: Existing keywords
            if (s.includes('loan') || s.includes('borrow') || (s.includes('advance') && !s.includes('electronics') && !s.includes('boltin'))) {
                if (s.includes('electronic') || s.includes('boltin')) return false;
                return true;
            }

            // Condition 2: Renwick/Salafia Credit Round Hundred
            if ((s.includes('renwick') || s.includes('salafia')) && amount >= 99 && amount % 100 === 0) {
                return true;
            }
            return false;
        };

        const DEFAULT_DATA = {
            salePrice: 3250000,
            useIndexedCosts: true,
            saleYear: 2026,
            currentYear: new Date().getFullYear(),
            enabledSources: [], // To be populated dynamically
            insurance: {
                enabled: true,
                premium: 2000,
                payout: 1000000,
                termStartYear: 2022
            }
        };

        const { useState, useEffect, useMemo, useCallback } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

        // --- Utility Functions ---
        const formatCurrency = (val) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP', minimumFractionDigits: 0 }).format(val);

        const getTaperRate = (years) => {
            if (years < 3) return 1.0;
            if (years < 4) return 0.8;
            if (years < 5) return 0.6;
            if (years < 6) return 0.4;
            if (years < 7) return 0.2;
            return 0.0;
        };

        // --- Components ---

        const Card = ({ title, children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-100 p-6 ${className}`}>
                <h3 className="text-lg font-semibold text-gray-800 mb-4">{title}</h3>
                {children}
            </div>
        );

        const NumberInput = ({ label, value, onChange, prefix = "£" }) => (
            <div className="flex flex-col space-y-1">
                <label className="text-sm font-medium text-gray-600">{label}</label>
                <div className="relative">
                    {prefix && <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">{prefix}</span>}
                    <input
                        type="number"
                        value={value}
                        onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
                        className={`w-full pl-${prefix ? '8' : '3'} pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all`}
                    />
                </div>
            </div>
        );

        const SliderInput = ({ label, value, onChange, min, max, unit = "" }) => (
            <div className="flex flex-col space-y-2">
                <div className="flex justify-between items-end">
                    <label className="text-sm font-medium text-gray-600">{label}</label>
                    <span className="text-base font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{value} {unit}</span>
                </div>
                <input
                    type="range"
                    min={min}
                    max={max}
                    value={value}
                    onChange={(e) => onChange(parseInt(e.target.value))}
                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                />
                <div className="flex justify-between text-xs text-gray-400 font-mono">
                    <span>{min}</span>
                    <span>{max}</span>
                </div>
            </div>
        );

        const Toggle = ({ enabled, onChange, label }) => (
            <div className="flex items-center justify-between cursor-pointer" onClick={() => onChange(!enabled)}>
                <span className="text-sm font-medium text-gray-700">{label}</span>
                <div className={`relative w-11 h-6 bg-gray-200 rounded-full peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 ${enabled ? 'bg-blue-600' : ''}`}>
                    <div className={`absolute top-[2px] left-[2px] bg-white border-gray-300 border rounded-full h-5 w-5 transition-all ${enabled ? 'translate-x-full border-white' : ''}`}></div>
                </div>
            </div>
        );

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="bg-white p-3 border border-gray-200 shadow-lg rounded-lg text-sm z-50">
                        <p className="font-bold text-gray-800 mb-2">{label}</p>
                        <div className="space-y-1">
                            <p className="text-emerald-600 font-medium whitespace-nowrap">
                                Net Wealth: {formatCurrency(payload[0].value)}
                            </p>
                            <p className="text-red-500 font-medium whitespace-nowrap">
                                IHT Tax: {formatCurrency(payload[1].value)}
                            </p>
                            <div className="pt-2 mt-1 border-t border-gray-100 text-xs text-gray-500 whitespace-nowrap">
                                Total Created: {formatCurrency(payload[0].value + payload[1].value)}
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const MathWalkthrough = ({ calc, inputs, getTaper }) => {
            const profit = inputs.salePrice - inputs.devCosts;
            const yearsSinceSale = inputs.deathYear - inputs.saleYear;
            const taperA = getTaper(yearsSinceSale);

            return (
                <Card title="Calculation Logic (Step-by-Step)" className="mt-8 border-l-4 border-blue-500 bg-slate-50">
                    <div className="space-y-6 text-sm font-mono text-gray-700">

                        {/* 1. Corp Tax */}
                        <div>
                            <h4 className="font-bold text-gray-900 border-b pb-1 mb-2">1. Corporate Level</h4>
                            <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                                <span>Gross Sale:</span> <span className="text-right">{formatCurrency(inputs.salePrice)}</span>
                                <span>- Dev Costs:</span> <span className="text-right text-red-600">({formatCurrency(inputs.devCosts)})</span>
                                <span className="font-semibold">= Profit:</span> <span className="text-right font-semibold">{formatCurrency(profit)}</span>
                                <span>x Corp Tax (25%):</span> <span className="text-right text-red-600">({formatCurrency(calc.corpTax)})</span>
                                <span className="font-bold border-t border-gray-300 pt-1">= Net Cash in Co:</span> <span className="text-right font-bold border-t border-gray-300 pt-1">{formatCurrency(calc.netCashFromCompany)}</span>
                            </div>
                        </div>

                        {/* 2. Strategy A */}
                        <div>
                            <h4 className="font-bold text-gray-900 border-b pb-1 mb-2">2. Strategy A (New Gift)</h4>
                            <p className="mb-2 italic text-xs text-gray-500">Assumption: All Net Cash ({formatCurrency(calc.netCashFromCompany)}) is extracted and gifted at Sale Year ({inputs.saleYear}).</p>
                            <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                                <span>Taxable Amount:</span> <span className="text-right">{formatCurrency(calc.netCashFromCompany)}</span>
                                <span>IHT Rate (40%):</span> <span className="text-right text-red-600">{formatCurrency(calc.netCashFromCompany * 0.4)}</span>
                                <span>x Taper Relief ({Math.round((1 - taperA) * 100)}% off):</span> <span className="text-right text-blue-600">x {taperA.toFixed(2)}</span>
                                <span className="font-bold border-t border-gray-300 pt-1">= IHT Liability:</span> <span className="text-right font-bold border-t border-gray-300 pt-1">{formatCurrency(calc.strategyA.tax)}</span>
                            </div>
                        </div>

                        {/* 3. Strategy B */}
                        <div>
                            <h4 className="font-bold text-gray-900 border-b pb-1 mb-2">3. Strategy B (Loan Assignment)</h4>
                            <p className="mb-2 italic text-xs text-gray-500">Breakdown of taxable components based on their individual gift dates.</p>
                            <table className="w-full text-right">
                                <thead className="text-gray-500 text-xs border-b">
                                    <tr>
                                        <th className="text-left pb-1">Component</th>
                                        <th className="pb-1">Amount</th>
                                        <th className="pb-1">Gift Period</th>
                                        <th className="pb-1">Years Elapsed</th>
                                        <th className="pb-1">Eff. Rate</th>
                                        <th className="pb-1">Tax</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {/* Equity */}
                                    <tr>
                                        <td className="text-left py-1">New Equity Dist.</td>
                                        <td>{formatCurrency(Math.max(0, calc.netCashFromCompany - inputs.loans.reduce((a, b) => a + b.amount, 0)))}</td>
                                        <td>{inputs.saleYear}</td>
                                        <td>{yearsSinceSale}</td>
                                        <td>{(40 * taperA).toFixed(1)}%</td>
                                        <td>{formatCurrency(Math.max(0, calc.netCashFromCompany - inputs.loans.reduce((a, b) => a + b.amount, 0)) * 0.4 * taperA)}</td>
                                    </tr>
                                    {/* Loans */}
                                    {inputs.loans.map(l => {
                                        const isAssigned = l.type === 'assigned' && l.assignmentYear;
                                        const giftYear = isAssigned ? l.assignmentYear : inputs.saleYear;
                                        const elapsed = inputs.deathYear - giftYear;
                                        const taper = getTaper(elapsed);
                                        return (
                                            <tr key={l.id}>
                                                <td className="text-left py-1">{l.source}</td>
                                                <td>{formatCurrency(l.amount)}</td>
                                                <td>{l.period || giftYear}</td>
                                                <td>{Math.max(0, elapsed)}</td>
                                                <td>{(40 * taper).toFixed(1)}%</td>
                                                <td>{formatCurrency(l.amount * 0.4 * taper)}</td>
                                            </tr>
                                        );
                                    })}
                                    <tr className="border-t font-bold">
                                        <td className="text-left pt-2">TOTAL</td>
                                        <td colSpan="4"></td>
                                        <td className="pt-2">{formatCurrency(calc.strategyB.tax)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        {/* 4. Insurance Hedge */}
                        {inputs.insurance.enabled && (
                            <div>
                                <h4 className="font-bold text-gray-900 border-b pb-1 mb-2">4. Insurance Hedge</h4>
                                <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                                    <span>Payout (Death Benefit):</span> <span className="text-right text-green-600">{formatCurrency(inputs.insurance.payout)}</span>
                                    <span>- Total Premiums Paid:</span> <span className="text-right text-red-600">({formatCurrency(inputs.insurance.premium * Math.max(0, inputs.deathYear - inputs.insurance.termStartYear))})</span>
                                    <span className="font-bold border-t border-gray-300 pt-1">= Net Insurance Effect:</span> <span className="text-right font-bold border-t border-gray-300 pt-1">{formatCurrency(calc.insuranceEffect)}</span>
                                </div>
                            </div>
                        )}

                        {/* 5. Summary */}
                        <div>
                            <h4 className="font-bold text-gray-900 border-b pb-1 mb-2">5. Net Wealth Reconciliation</h4>
                            <table className="w-full text-right">
                                <thead className="text-gray-500 text-xs border-b">
                                    <tr>
                                        <th className="text-left pb-1">step</th>
                                        <th className="pb-1">Strategy A</th>
                                        <th className="pb-1">Strategy B</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td className="text-left py-1">Net Cash in Co</td>
                                        <td>{formatCurrency(calc.netCashFromCompany)}</td>
                                        <td>{formatCurrency(calc.netCashFromCompany)}</td>
                                    </tr>
                                    <tr>
                                        <td className="text-left py-1">- IHT Liability</td>
                                        <td className="text-red-600">({formatCurrency(calc.strategyA.tax)})</td>
                                        <td className="text-red-600">({formatCurrency(calc.strategyB.tax)})</td>
                                    </tr>
                                    <tr>
                                        <td className="text-left py-1">+ Insurance Net</td>
                                        <td className="text-green-600">{formatCurrency(calc.insuranceEffect)}</td>
                                        <td className="text-green-600">{formatCurrency(calc.insuranceEffect)}</td>
                                    </tr>
                                    <tr className="border-t border-gray-400 font-bold bg-gray-100">
                                        <td className="text-left py-2 pl-2 rounded-l">FINAL WEALTH</td>
                                        <td className="py-2 text-emerald-700">{formatCurrency(calc.strategyA.wealth)}</td>
                                        <td className="py-2 pr-2 rounded-r text-emerald-700">{formatCurrency(calc.strategyB.wealth)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </Card>
            );
        };

        // --- Development Costs Component ---
        const DevelopmentCostsView = ({ expandedYear, setExpandedYear, enabledSources, costs }) => {
            const [searchQuery, setSearchQuery] = useState("");

            // 1. Filter Transactions (Global Filter AND Exclude Disabled Loans)
            const filteredCosts = useMemo(() => {
                let data = costs || [];
                // Exclude items selected as active loans
                data = data.filter(c => !enabledSources.includes(c.source));

                if (!searchQuery) return data;
                const lowerQ = searchQuery.toLowerCase();
                return data.filter(c => (c.source || "").toLowerCase().includes(lowerQ));
            }, [searchQuery, enabledSources, costs]);

            // 2. Derive Rows from Filtered Data
            const dynamicRows = useMemo(() => {
                // Get all unique years from filtered data, plus years from summary for completeness if no filter
                const years = new Set(filteredCosts.map(c => c.year));
                if (!searchQuery) {
                    COST_SUMMARY.forEach(row => years.add(row.year));
                }

                const sortedYears = Array.from(years).sort((a, b) => a - b);

                return sortedYears.map(year => {
                    const yearTrans = filteredCosts.filter(c => c.year === year);
                    const sumUnindexed = yearTrans.reduce((acc, c) => acc + c.amount, 0);
                    // Dynamically calculate indexed sum if transaction data has it
                    const sumIndexed = yearTrans.reduce((acc, c) => acc + (c.indexed_amount || 0), 0);

                    // Fallback to summary if no transactions for that year but summary exists?
                    // Actually, let's prefer the dynamic sum if we have transactions.
                    // If no transactions, check summary.
                    let finalIndexed = sumIndexed;
                    if (yearTrans.length === 0 && !searchQuery) {
                        const sRow = COST_SUMMARY.find(r => r.year === year);
                        if (sRow) finalIndexed = sRow.indexed;
                    }

                    return {
                        year,
                        unindexed: sumUnindexed,
                        indexed: finalIndexed,
                        hasTransactions: yearTrans.length > 0
                    };
                });
            }, [filteredCosts, searchQuery]);

            // 3. Calculate Totals from Visible Rows
            const totalUnindexed = dynamicRows.reduce((acc, row) => acc + row.unindexed, 0);
            const totalIndexed = dynamicRows.reduce((acc, row) => acc + row.indexed, 0);

            return (
                <div className="space-y-6">
                    <Card title="Yearly Development Costs">
                        {/* Global Search Bar */}
                        <div className="mb-4 flex justify-between items-center">
                            <p className="text-sm text-gray-500">
                                {searchQuery ? `Showing matched transactions across all years.` : `Showing costs (excluding selected loans).`}
                            </p>
                            <div className="relative">
                                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
                                <input
                                    type="text"
                                    placeholder="Search description..."
                                    className="pl-9 pr-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm w-64 shadow-sm"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-gray-50 text-gray-500 border-b border-gray-100">
                                    <tr>
                                        <th className="py-3 px-4">Year</th>
                                        <th className="py-3 px-4 text-right">Unindexed</th>
                                        <th className="py-3 px-4 text-right">Indexed</th>
                                        <th className="py-3 px-4 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {dynamicRows.map(row => (
                                        <React.Fragment key={row.year}>
                                            <tr className={`hover:bg-gray-50 transition-colors ${row.hasTransactions ? '' : 'opacity-50'}`}>
                                                <td className="py-3 px-4 font-medium">{row.year}</td>
                                                <td className="py-3 px-4 text-right text-gray-600">{formatCurrency(row.unindexed)}</td>
                                                <td className="py-3 px-4 text-right font-mono font-medium">
                                                    {formatCurrency(row.indexed)}
                                                </td>
                                                <td className="py-3 px-4 text-right">
                                                    {row.hasTransactions && (
                                                        <button
                                                            onClick={() => setExpandedYear(expandedYear === row.year ? null : row.year)}
                                                            className="text-blue-600 hover:text-blue-800 text-xs font-medium"
                                                        >
                                                            {expandedYear === row.year ? 'Hide' : 'Details'}
                                                        </button>
                                                    )}
                                                </td>
                                            </tr>
                                            {expandedYear === row.year && row.hasTransactions && (
                                                <tr>
                                                    <td colSpan="4" className="bg-gray-50 p-4">
                                                        <div className="max-h-96 overflow-y-auto bg-white rounded border border-gray-200 shadow-inner">
                                                            <table className="w-full text-xs">
                                                                <thead className="bg-gray-100 text-gray-500 sticky top-0">
                                                                    <tr>
                                                                        <th className="py-2 px-3 text-left">Date</th>
                                                                        <th className="py-2 px-3 text-left">Description</th>
                                                                        <th className="py-2 px-3 text-right">Unindexed</th>
                                                                        <th className="py-2 px-3 text-right">Indexed</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody className="divide-y divide-gray-100">
                                                                    {filteredCosts.filter(c => c.year === row.year).map(c => (
                                                                        <tr key={c.id}>
                                                                            <td className="py-2 px-3 text-gray-500 whitespace-nowrap">{c.period}</td>
                                                                            <td className="py-2 px-3 text-gray-700">{c.source}</td>
                                                                            <td className="py-2 px-3 text-right font-mono">{formatCurrency(c.amount)}</td>
                                                                            <td className="py-2 px-3 text-right font-mono text-gray-500">{formatCurrency(c.indexed_amount || 0)}</td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </React.Fragment>
                                    ))}
                                    {/* Footer Totals */}
                                    <tr className="bg-gray-100 font-bold border-t-2 border-gray-200">
                                        <td className="py-3 px-4">TOTAL</td>
                                        <td className="py-3 px-4 text-right">{formatCurrency(totalUnindexed)}</td>
                                        <td className="py-3 px-4 text-right">{formatCurrency(totalIndexed)}</td>
                                        <td className="py-3 px-4"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            // Data State
            // Data State
            const [loading, setLoading] = useState(true);
            const [user, setUser] = useState(null);
            const [rawTransactions, setRawTransactions] = useState([]);

            // Sub-States
            const [showMath, setShowMath] = useState(false);
            const [salePrice, setSalePrice] = useState(DEFAULT_DATA.salePrice);
            const [useIndexedCosts, setUseIndexedCosts] = useState(DEFAULT_DATA.useIndexedCosts);
            const [saleYear, setSaleYear] = useState(DEFAULT_DATA.saleYear);
            const [deathYear, setDeathYear] = useState(DEFAULT_DATA.saleYear + 1);
            const [enabledSources, setEnabledSources] = useState(DEFAULT_DATA.enabledSources);
            const [insurance, setInsurance] = useState(DEFAULT_DATA.insurance);

            const [activeTab, setActiveTab] = useState('loans');
            const [expandedYear, setExpandedYear] = useState(null);
            const [isLoanSourcesOpen, setIsLoanSourcesOpen] = useState(true);

            // 1. Auth & Data
            useEffect(() => {
                const unsubscribeAuth = firebase.auth().onAuthStateChanged(u => {
                    setUser(u);
                    if (u) {
                        // Load Settings
                        db.collection('settings').doc(u.uid).get().then(doc => {
                            if (doc.exists) {
                                const s = doc.data();
                                if (s.salePrice) setSalePrice(s.salePrice);
                                if (s.useIndexedCosts !== undefined) setUseIndexedCosts(s.useIndexedCosts);
                                if (s.saleYear) setSaleYear(s.saleYear);
                                if (s.deathYear) setDeathYear(s.deathYear);
                                if (s.enabledSources) setEnabledSources(s.enabledSources);
                                if (s.insurance) setInsurance(s.insurance);
                                console.log("Loaded settings from Firestore");
                            }
                        });

                        // Load Data
                        const unsubscribeData = db.collection('transactions').onSnapshot(snapshot => {
                            const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            setRawTransactions(data);
                            setLoading(false);
                        });
                        return () => unsubscribeData();
                    } else {
                        setLoading(false);
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            // 2. Identify Candidate Loan Sources
            const loanSources = useMemo(() => {
                const uniqueSources = new Set();
                rawTransactions.forEach(t => {
                    if (isAdvancedLoan(t)) {
                        uniqueSources.add(t.source);
                    }
                });
                return [...uniqueSources].sort();
            }, [rawTransactions]);

            // 3. Dynamic Split: Active Loans vs. Costs
            const { activeLoans, effectiveCosts } = useMemo(() => {
                const l = [];
                const c = [];

                rawTransactions.forEach(t => {
                    if (enabledSources.includes(t.source)) {
                        let loan = { ...t };
                        // FIX: Always treat loan amounts as positive debts for calculations
                        // This prevents credit/debit cancellations.
                        loan.amount = Math.abs(loan.amount);
                        l.push(loan);
                    } else {
                        c.push(t);
                    }
                });

                return { activeLoans: l, effectiveCosts: c };
            }, [rawTransactions, enabledSources]);

            // 4. Persistence Save
            const saveData = async () => {
                if (!user) {
                    alert("You must be logged in to save settings.");
                    return;
                }
                const settings = { salePrice, useIndexedCosts, saleYear, deathYear, enabledSources, insurance };
                try {
                    await db.collection('settings').doc(user.uid).set(settings);
                    alert("Settings saved to Firebase!");
                } catch (e) {
                    console.error("Save failed", e);
                    alert("Failed to save settings: " + e.message);
                }
            };

            const resetData = () => {
                if (confirm("Reset layout to defaults?")) {
                    setSalePrice(DEFAULT_DATA.salePrice);
                    setSaleYear(DEFAULT_DATA.saleYear);
                    // ... partial reset or full reload?
                    window.location.reload();
                }
            };

            const devCostsObj = useMemo(() => {
                const unindexed = effectiveCosts.reduce((acc, c) => acc + c.amount, 0);
                const indexed = effectiveCosts.reduce((acc, c) => acc + (c.indexed_amount || 0), 0);
                if (indexed === 0 && COST_DATA.indexed > 0) {
                    return { unindexed: COST_DATA.unindexed, indexed: COST_DATA.indexed };
                }
                return { unindexed, indexed };
            }, [effectiveCosts]);

            const devCosts = useIndexedCosts ? devCostsObj.indexed : devCostsObj.unindexed;

            const toggleSource = (source) => {
                if (enabledSources.includes(source)) {
                    setEnabledSources(enabledSources.filter(s => s !== source));
                } else {
                    setEnabledSources([...enabledSources, source]);
                }
            };

            // Calculations
            const calculations = useMemo(() => {
                const corpTaxRate = 0.25;
                const profit = Math.max(0, salePrice - devCosts);
                const corpTax = profit * corpTaxRate;

                const totalLoans = activeLoans.reduce((acc, l) => acc + l.amount, 0);

                const netCashFromCompany = Math.max(0, salePrice - corpTax);
                const equityAfterLoans = Math.max(0, netCashFromCompany - totalLoans);

                // Strategy A (No Loan Planning)
                const yearsElapsedA = Math.max(0, deathYear - saleYear);
                const taperFactorA = getTaperRate(yearsElapsedA);

                const wealthToTransfer = netCashFromCompany;
                const taxAtDeathA_Base = wealthToTransfer * 0.40;
                const taxAtDeathA_Actual = taxAtDeathA_Base * taperFactorA;

                // Strategy B (Loan Assignment / Gifting)
                let totalTaxB = 0;
                // Part 1: Equity remaining in company (treated same as Strategy A)
                totalTaxB += (equityAfterLoans * 0.40) * taperFactorA;

                // Part 2: Assigned Loans (Gifts)
                activeLoans.forEach(loan => {
                    // FIX: Assume ALL active loans are assigned/gifted at their transaction date.
                    // If no year, assume current saleYear (conservative? no, aggressive).
                    // Let's use loan.year if available.
                    const giftYear = loan.year || saleYear;
                    const yearsSinceGift = Math.max(0, deathYear - giftYear);
                    const taper = getTaperRate(yearsSinceGift);
                    totalTaxB += (loan.amount * 0.40) * taper;
                });

                // Insurance
                const duration = Math.max(0, deathYear - insurance.termStartYear);
                const insuranceCost = insurance.enabled ? insurance.premium * duration : 0;
                const insurancePayout = insurance.enabled ? insurance.payout : 0;

                const wealthA = wealthToTransfer - taxAtDeathA_Actual + insurancePayout - insuranceCost;
                const wealthB = wealthToTransfer - totalTaxB + insurancePayout - insuranceCost;

                return {
                    corpTax,
                    netCashFromCompany,
                    wealthToTransfer,
                    strategyA: { tax: taxAtDeathA_Actual, wealth: wealthA },
                    strategyB: { tax: totalTaxB, wealth: wealthB },
                    insuranceEffect: insurancePayout - insuranceCost
                };
            }, [salePrice, devCosts, saleYear, deathYear, activeLoans, insurance]);

            const chartData = [
                { name: 'Strategy A', wealth: calculations.strategyA.wealth, tax: calculations.strategyA.tax },
                { name: 'Strategy B', wealth: calculations.strategyB.wealth, tax: calculations.strategyB.tax },
            ];

            // --- EXCEL IMPORT LOGIC ---
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setLoading(true);
                const reader = new FileReader();

                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        // Find Transactions Sheet
                        const sheetName = workbook.SheetNames.find(n => n.toUpperCase().includes('TRANSACT') || n.toUpperCase().includes('FULL'));
                        if (!sheetName) {
                            alert("Could not find a 'TRANSACTIONS' or 'FULL' sheet in this Excel file.");
                            setLoading(false);
                            return;
                        }

                        console.log("Processing sheet:", sheetName);
                        const worksheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 }); // Array of arrays

                        if (json.length < 2) {
                            alert("Sheet appears empty.");
                            setLoading(false);
                            return;
                        }

                        // Header Mapping
                        const headers = json[0].map(h => String(h).trim());
                        const dateIdx = headers.findIndex(h => h.match(/Date/i));
                        const descIdx = headers.findIndex(h => h.match(/Desc/i));
                        const payeeIdx = headers.findIndex(h => h.match(/Payee/i));
                        const debitIdx = headers.findIndex(h => h.match(/Debit/i));
                        const creditIdx = headers.findIndex(h => h.match(/Credit/i));
                        const indexedIdx = headers.findIndex(h => h.match(/Indexed/i));

                        const newTransactions = [];
                        let count = 0;

                        // Helper for cleaning amounts
                        const cleanAmt = (val) => {
                            if (typeof val === 'number') return val;
                            if (!val) return 0;
                            if (val === 'nan' || val === 'NaN') return 0;
                            const num = parseFloat(String(val).replace(/[£,]/g, ''));
                            return isNaN(num) ? 0 : num;
                        };

                        // helper for Excel Date
                        const parseDate = (val) => {
                            if (!val) return null;
                            if (val instanceof Date) return val;
                            // Excel serial
                            if (typeof val === 'number') {
                                return new Date(Math.round((val - 25569) * 86400 * 1000));
                            }
                            // String
                            const d = new Date(val);
                            return isNaN(d) ? null : d;
                        };

                        for (let i = 1; i < json.length; i++) {
                            const row = json[i];
                            const dateVal = row[dateIdx];
                            if (!dateVal) continue;

                            const dt = parseDate(dateVal);
                            if (!dt || isNaN(dt.getTime())) continue;

                            const year = dt.getFullYear();
                            if (year < 2004 || year > 2030) continue;

                            const period = `${year}-${String(dt.getMonth() + 1).padStart(2, '0')}`;

                            let desc = row[descIdx] || "Unknown";
                            let payee = row[payeeIdx];
                            let source = payee ? `${desc} - ${payee}` : desc;
                            source = String(source).replace(/["\n]/g, ' ').trim().replace(/-$/, '').trim();

                            let debit = cleanAmt(row[debitIdx]);
                            let credit = cleanAmt(row[creditIdx]);
                            let indexed = cleanAmt(row[indexedIdx]);

                            let amount = debit;
                            if (amount === 0 && credit > 0) amount = -credit;

                            if (Math.abs(amount) < 0.01) continue;

                            newTransactions.push({
                                period,
                                source,
                                amount,
                                indexed_amount: indexed,
                                year
                            });
                            count++;
                        }

                        if (count === 0) {
                            alert("No valid transactions extracted.");
                            setLoading(false);
                            return;
                        }

                        // Batch Write to Firestore
                        const batchLimit = 450;

                        console.log("Deleting existing records...");
                        const snap = await db.collection('transactions').get();
                        const deleteBatches = [];
                        let currentDeleteBatch = db.batch();
                        let deleteCount = 0;
                        snap.forEach(doc => {
                            currentDeleteBatch.delete(doc.ref);
                            deleteCount++;
                            if (deleteCount % batchLimit === 0) {
                                deleteBatches.push(currentDeleteBatch);
                                currentDeleteBatch = db.batch();
                            }
                        });
                        deleteBatches.push(currentDeleteBatch);
                        await Promise.all(deleteBatches.map(b => b.commit()));

                        console.log("Uploading new records...");
                        const writeBatches = [];
                        let currentWriteBatch = db.batch();
                        let writeCount = 0;
                        newTransactions.forEach(t => {
                            const ref = db.collection('transactions').doc(); // Auto ID
                            currentWriteBatch.set(ref, t);
                            writeCount++;
                            if (writeCount % batchLimit === 0) {
                                writeBatches.push(currentWriteBatch);
                                currentWriteBatch = db.batch();
                            }
                        });
                        writeBatches.push(currentWriteBatch);
                        await Promise.all(writeBatches.map(b => b.commit()));

                        alert(`Successfully imported ${count} transactions!`);
                        setLoading(false);

                    } catch (err) {
                        console.error("Import failed:", err);
                        alert("Import failed: " + err.message);
                        setLoading(false);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const triggerFileInput = () => {
                document.getElementById('excel-upload').click();
            };

            // Calculated total for SELECTED sources
            const selectedLoansTotal = activeLoans.reduce((acc, l) => acc + l.amount, 0);

            if (loading) {
                return (
                    <div className="flex h-screen items-center justify-center bg-gray-50">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                            <h2 className="text-xl font-bold text-gray-700">Loading Data...</h2>
                            <p className="text-gray-500">Connecting to Firestore</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8 pb-32">
                    <header className="flex flex-col md:flex-row md:justify-between md:items-center pb-6 border-b border-gray-200">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-900 tracking-tight">Tax Strategy Engine</h1>
                            <p className="text-gray-500 mt-1">Modeling the liquidation of STMS Ltd & IHT Planning</p>
                        </div>
                        <div className="mt-4 md:mt-0 flex items-center gap-2">
                            <input type="file" id="excel-upload" accept=".xlsx,.xls" className="hidden" onChange={handleFileUpload} />
                            <button onClick={triggerFileInput} className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium text-sm hover:bg-emerald-700 transition-colors shadow-sm flex items-center gap-2">
                                <span>Update Data</span>
                            </button>
                            <div className="bg-emerald-50 text-emerald-700 px-4 py-2 rounded-lg font-medium text-sm border border-emerald-100 hidden md:block">
                                Corp: {formatCurrency(calculations.corpTax)}
                            </div>
                            <button onClick={saveData} className="bg-gray-800 text-white px-4 py-2 rounded-lg font-medium text-sm hover:bg-gray-900 transition-colors shadow-sm flex items-center gap-2">
                                <span>Save</span>
                            </button>
                            <button
                                onClick={() => setShowMath(!showMath)}
                                className={`px-4 py-2 rounded-lg font-medium text-sm border transition-colors ${showMath ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                            >
                                {showMath ? 'Hide Math' : 'Show Logic'}
                            </button>
                            <button onClick={resetData} className="text-gray-400 hover:text-red-500 p-2 rounded-full transition-colors" title="Reset to Defaults">
                                ↺
                            </button>
                            <button onClick={() => firebase.auth().signOut().then(() => window.location.reload())} className="text-gray-400 hover:text-red-500 text-xs uppercase font-medium ml-2 transition-colors">
                                Log Out
                            </button>
                        </div>
                    </header>

                    {/* Tab Navigation */}
                    <div className="flex space-x-6 border-b border-gray-200 mb-8">
                        <button
                            onClick={() => setActiveTab('loans')}
                            className={`pb-3 px-2 font-medium text-sm transition-all border-b-2 ${activeTab === 'loans' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}
                        >
                            Director Loan Strategy
                        </button>
                        <button
                            onClick={() => setActiveTab('costs')}
                            className={`pb-3 px-2 font-medium text-sm transition-all border-b-2 ${activeTab === 'costs' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}
                        >
                            Development Costs Analysis
                        </button>
                    </div>

                    {/* VIEW: Development Costs */}
                    {activeTab === 'costs' && (
                        <DevelopmentCostsView
                            expandedYear={expandedYear}
                            setExpandedYear={setExpandedYear}
                            enabledSources={enabledSources}
                            costs={effectiveCosts}
                        />
                    )}

                    {/* VIEW: Loans Strategy (Main Dashboard) */}
                    <div className={`grid grid-cols-1 lg:grid-cols-12 gap-8 ${activeTab === 'loans' ? 'block' : 'hidden'}`}>
                        {/* LEFT: Controls (4 cols) */}
                        <div className="lg:col-span-4 space-y-6">
                            <Card title="Timeline Stress Test">
                                <div className="space-y-6">
                                    <SliderInput
                                        label="Asset Sale Year"
                                        value={saleYear}
                                        onChange={setSaleYear}
                                        min={2024}
                                        max={2030}
                                    />
                                    <SliderInput
                                        label="Projected Death Year"
                                        value={deathYear}
                                        onChange={setDeathYear}
                                        min={saleYear}
                                        max={saleYear + 15}
                                    />

                                    <div className={`p-4 rounded-lg text-sm border ${(deathYear - saleYear) >= 7 ? 'bg-green-50 border-green-200 text-green-800' :
                                        'bg-amber-50 border-amber-200 text-amber-800'
                                        }`}>
                                        <strong>{deathYear - saleYear} Years</strong> elapsed since sale. <br />
                                        PET Taper Relief: {Math.round((1 - getTaperRate(deathYear - saleYear)) * 100)}%
                                    </div>
                                </div>
                            </Card>

                            <Card title="Structure & Values">
                                <div className="space-y-4">
                                    <NumberInput label="Sale Price" value={salePrice} onChange={setSalePrice} />

                                    {/* Cost Basis Toggle */}
                                    <div className="space-y-2">
                                        <label className="text-sm font-medium text-gray-600">Cost Basis</label>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => setUseIndexedCosts(false)}
                                                className={`flex-1 py-2 px-3 text-sm rounded-lg border transition-all ${!useIndexedCosts ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                                            >
                                                Unindexed
                                            </button>
                                            <button
                                                onClick={() => setUseIndexedCosts(true)}
                                                className={`flex-1 py-2 px-3 text-sm rounded-lg border transition-all ${useIndexedCosts ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                                            >
                                                Indexed
                                            </button>
                                        </div>
                                        <div className="text-xs text-gray-500 bg-gray-50 p-2 rounded">
                                            Using: <span className="font-semibold">{formatCurrency(devCosts)}</span>
                                            <span className="text-gray-400 ml-2">
                                                ({useIndexedCosts ? 'RPI Adjusted' : 'Original Costs'})
                                            </span>
                                        </div>
                                    </div>

                                    <div className="pt-4 border-t border-gray-100">
                                        <Toggle
                                            label="Life Insurance Hedge"
                                            enabled={insurance.enabled}
                                            onChange={(v) => setInsurance({ ...insurance, enabled: v })}
                                        />
                                        {insurance.enabled && (
                                            <div className="mt-4 space-y-3 pl-4 border-l-2 border-blue-100 animation-fade-in">
                                                <NumberInput
                                                    label="Death Benefit (Payout)"
                                                    value={insurance.payout}
                                                    onChange={(v) => setInsurance({ ...insurance, payout: v })}
                                                />
                                                <NumberInput
                                                    label="Annual Premium"
                                                    value={insurance.premium}
                                                    onChange={(v) => setInsurance({ ...insurance, premium: v })}
                                                />
                                                <NumberInput
                                                    label="Policy Start Year"
                                                    value={insurance.termStartYear || 2022}
                                                    onChange={(v) => setInsurance({ ...insurance, termStartYear: v })}
                                                    prefix=""
                                                />
                                                <div className="text-xs text-gray-500 mt-2">
                                                    Total Cost to Date: {formatCurrency(insurance.premium * Math.max(0, deathYear - (insurance.termStartYear || 2022)))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </Card>

                            <Card title={
                                <div className="flex justify-between items-center w-full">
                                    <div className="flex items-center gap-2">
                                        <span>Director Loan Sources</span>
                                        <button
                                            onClick={(e) => { e.stopPropagation(); setIsLoanSourcesOpen(!isLoanSourcesOpen); }}
                                            className="text-xs font-normal text-blue-600 bg-blue-50 px-2 py-1 rounded hover:bg-blue-100"
                                        >
                                            {isLoanSourcesOpen ? 'Collapse' : 'Expand'}
                                        </button>
                                    </div>
                                    <span className="text-sm font-bold text-gray-600">
                                        Total: {formatCurrency(activeLoans.reduce((acc, l) => acc + l.amount, 0))}
                                    </span>
                                </div>
                            }>
                                {isLoanSourcesOpen && (
                                    <div className="space-y-2 animation-fade-in">
                                        <p className="text-xs text-gray-500 mb-3">Select which loan sources to include in the calculation. All are treated as assigned loans from their original date.</p>
                                        {loanSources.map(source => {
                                            // Calculate total for this source from RAW data
                                            const sourceLoans = rawTransactions.filter(l => l.source === source);

                                            // FIX: Sum all amounts, then take Absolute Value. 
                                            // This assumes the net result of a "Loan Source" is a Debt (Positive).
                                            const rawSum = sourceLoans.reduce((a, b) => a + b.amount, 0);
                                            const sourceTotal = Math.abs(rawSum);

                                            const isEnabled = enabledSources.includes(source);
                                            return (
                                                <label key={source} className={`flex items-center justify-between p-3 rounded-lg border cursor-pointer transition-all ${isEnabled ? 'bg-blue-50 border-blue-200' : 'bg-gray-50 border-gray-200 opacity-60'}`}>
                                                    <div className="flex items-center gap-3">
                                                        <input
                                                            type="checkbox"
                                                            checked={isEnabled}
                                                            onChange={() => toggleSource(source)}
                                                            className="w-4 h-4 text-blue-600 rounded"
                                                        />
                                                        <span className="text-sm font-medium text-gray-700">{source}</span>
                                                    </div>
                                                    <span className={`text-sm font-mono ${isEnabled ? 'text-blue-700' : 'text-gray-400'}`}>
                                                        {formatCurrency(sourceTotal)}
                                                    </span>
                                                </label>
                                            );
                                        })}
                                    </div>
                                )}
                                {!isLoanSourcesOpen && (
                                    <div className="text-sm text-gray-400 italic">
                                        {enabledSources.length} sources selected. Click "Expand" to modify selection.
                                    </div>
                                )}
                            </Card>
                        </div>

                        {/* RIGHT: Visuals (8 cols) */}
                        <div className="lg:col-span-8 space-y-8">

                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                                <h3 className="text-lg font-semibold text-gray-800 mb-6">Wealth Retention Analysis</h3>
                                <div className="h-96 w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={chartData} margin={{ top: 20, right: 30, left: 20, bottom: 5 }}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                            <XAxis dataKey="name" axisLine={false} tickLine={false} />
                                            <YAxis axisLine={false} tickLine={false} tickFormatter={(val) => `£${val / 1000000}m`} />
                                            <Tooltip content={<CustomTooltip />} cursor={{ fill: '#f8fafc' }} />
                                            <Legend iconType="circle" />
                                            <Bar dataKey="wealth" name="Net Wealth to Heirs" fill="#10b981" radius={[4, 4, 0, 0]} barSize={60} />
                                            <Bar dataKey="tax" name="IHT Liability" fill="#ef4444" radius={[4, 4, 0, 0]} barSize={60} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                                <div className="mt-8 grid grid-cols-2 gap-4 text-center">
                                    <div className="p-4 bg-gray-50 rounded-lg">
                                        <div className="text-sm text-gray-500 uppercase tracking-wide">Strategy A Tax</div>
                                        <div className="text-2xl font-bold text-red-600 mt-1">{formatCurrency(calculations.strategyA.tax)}</div>
                                        <div className="text-xs text-gray-400 mt-1">Based on new gift at {saleYear}</div>
                                    </div>
                                    <div className="p-4 bg-blue-50 rounded-lg">
                                        <div className="text-sm text-blue-600 uppercase tracking-wide">Strategy B Tax</div>
                                        <div className="text-2xl font-bold text-blue-700 mt-1">{formatCurrency(calculations.strategyB.tax)}</div>
                                        <div className="text-xs text-blue-400 mt-1">Saves {formatCurrency(calculations.strategyA.tax - calculations.strategyB.tax)}</div>
                                    </div>
                                </div>
                            </div>

                            <Card title="Detailed Breakdown">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-gray-50 text-gray-500 border-b border-gray-100">
                                            <tr>
                                                <th className="py-3 px-4 font-medium">Component</th>
                                                <th className="py-3 px-4 font-medium text-right">Value</th>
                                                <th className="py-3 px-4 font-medium text-right text-red-500">IHT Risk (Strat A)</th>
                                                <th className="py-3 px-4 font-medium text-right text-blue-600">IHT Risk (Strat B)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100">
                                            <tr>
                                                <td className="py-3 px-4">Net Equity (Cash after Corp Tax & Loans)</td>
                                                <td className="py-3 px-4 text-right font-mono">{formatCurrency(calculations.netCashFromCompany - calculations.wealthToTransfer + calculations.strategyA.wealth + calculations.strategyA.tax - calculations.insuranceEffect)}</td>
                                                <td className="py-3 px-4 text-right text-red-500">{formatCurrency((calculations.netCashFromCompany - activeLoans.reduce((a, b) => a + b.amount, 0)) * 0.4 * getTaperRate(deathYear - saleYear))}</td>
                                                <td className="py-3 px-4 text-right text-blue-600">{formatCurrency((calculations.netCashFromCompany - activeLoans.reduce((a, b) => a + b.amount, 0)) * 0.4 * getTaperRate(deathYear - saleYear))}</td>
                                            </tr>
                                            {activeLoans.map(loan => (
                                                <tr key={loan.id}>
                                                    <td className="py-3 px-4">{loan.source} <span className="text-xs text-gray-400">({loan.period || loan.assignmentYear})</span></td>
                                                    <td className="py-3 px-4 text-right font-mono">{formatCurrency(loan.amount)}</td>
                                                    <td className="py-3 px-4 text-right text-red-500">{formatCurrency(loan.amount * 0.4 * getTaperRate(deathYear - saleYear))}</td>
                                                    <td className="py-3 px-4 text-right text-blue-600">{
                                                        loan.type === 'assigned'
                                                            ? formatCurrency(loan.amount * 0.4 * getTaperRate(deathYear - (loan.assignmentYear || 2018)))
                                                            : formatCurrency(loan.amount * 0.4 * getTaperRate(deathYear - saleYear))
                                                    }</td>
                                                </tr>
                                            ))}
                                            <tr className="bg-gray-50 font-bold">
                                                <td className="py-3 px-4">TOTAL TAX DUE</td>
                                                <td className="py-3 px-4 text-right"></td>
                                                <td className="py-3 px-4 text-right text-red-600">{formatCurrency(calculations.strategyA.tax)}</td>
                                                <td className="py-3 px-4 text-right text-blue-700">{formatCurrency(calculations.strategyB.tax)}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </Card>

                            {showMath && <MathWalkthrough calc={calculations} inputs={{ salePrice, devCosts, saleYear, deathYear, loans: activeLoans, insurance }} getTaper={getTaperRate} />}

                        </div >
                    </div >
                </div >
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <script>
        if (typeof firebase !== 'undefined') {
            // Already initialized in head

            firebase.auth().onAuthStateChanged((user) => {
                const overlay = document.getElementById('loading-overlay');
                const root = document.getElementById('root');

                if (user) {
                    // Authenticated
                    setTimeout(() => {
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 500);
                        root.style.display = 'block';
                    }, 800);
                } else {
                    // Redirect to login (root directory)
                    window.location.href = '../login.html';
                }
            });
        } else {
            console.error("Firebase SDK or Config missing");
            alert("Error: Could not load authentication configuration. Check your network or file paths.");
        }
    </script>
</body>

</html>
