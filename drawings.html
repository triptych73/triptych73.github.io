<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St Mary Somerset | Drawings Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/drawings-manager.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'portland': '#F5F5F0',
                        'midnight': '#0F1115',
                        'bronze': '#9A8C74',
                        'bronze-dark': '#5c5240',
                        'surface': '#1A1D23',
                        'surface-light': '#252932'
                    },
                    fontFamily: {
                        'serif': ['Cinzel', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-midnight text-portland font-sans min-h-screen flex flex-col overflow-hidden">

    <!-- Navigation Bar -->
    <nav
        class="shrink-0 w-full border-b border-white/5 bg-midnight/95 backdrop-blur-md z-50 px-6 py-3 flex justify-between items-center text-[11px] tracking-widest uppercase font-mono">
        <div class="flex items-center gap-4 text-bronze">
            <span class="font-bold">SMS-1694</span>
            <span class="text-white/20">|</span>
            <span class="text-portland/80">Drawings Manager</span>
        </div>
        <div class="flex items-center gap-6">
            <a href="projectexecutive.html" class="hover:text-bronze transition-colors text-white/40">Back to Portal</a>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar: Categories/Sheets -->
        <aside class="w-64 bg-surface/50 border-r border-white/5 flex flex-col shrink-0">
            <div class="p-5 border-b border-white/5">
                <h2 class="font-serif text-bronze text-sm">Drawing Packages</h2>
            </div>

            <div id="sidebar-list" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1">
                <!-- Javascript will populate this -->
                <div class="text-xs text-white/20 text-center py-4">Loading sheets...</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-grid-pattern relative">

            <!-- Header / Toolbar -->
            <header
                class="p-6 border-b border-white/5 bg-midnight/80 backdrop-blur-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 id="current-category-title" class="font-serif text-2xl text-portland">All Drawings</h1>
                    <p id="current-category-count"
                        class="text-[10px] font-mono text-white/40 uppercase tracking-widest mt-1">0 ITEMS</p>
                </div>

                <div class="flex items-center gap-3 w-full md:w-auto">
                    <!-- Search -->
                    <div class="relative group w-full md:w-64">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-white/20 group-hover:text-bronze transition-colors" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <input type="text" id="search-input"
                            class="block w-full pl-10 pr-3 py-2 border border-white/10 rounded-md leading-5 bg-surface-light/50 text-white placeholder-white/20 focus:outline-none focus:border-bronze focus:ring-1 focus:ring-bronze sm:text-xs transition-all"
                            placeholder="Find drawing...">
                    </div>
                </div>
            </header>

            <!-- Data Grid -->
            <div class="flex-1 overflow-auto custom-scrollbar p-6">
                <div class="glass-panel rounded-lg overflow-hidden border border-white/5">
                    <table class="w-full text-left">
                        <thead
                            class="bg-surface-light/30 text-[10px] text-white/40 uppercase tracking-widest font-mono">
                            <tr>
                                <th class="px-6 py-3 font-medium select-none w-20">Preview</th>
                                <th class="px-6 py-3 font-medium cursor-pointer hover:text-white select-none"
                                    data-sort="number">Number</th>
                                <th class="px-6 py-3 font-medium cursor-pointer hover:text-white select-none"
                                    data-sort="title">Title / Description</th>
                                <th class="px-6 py-3 font-medium cursor-pointer hover:text-white select-none w-24"
                                    data-sort="revision">Rev</th>
                                <th class="px-6 py-3 font-medium cursor-pointer hover:text-white select-none w-32"
                                    data-sort="scale">Scale</th>
                                <th class="px-6 py-3 font-medium cursor-pointer hover:text-white select-none w-32"
                                    data-sort="size">Size</th>
                                <th class="px-6 py-3 font-medium cursor-pointer hover:text-white select-none w-32"
                                    data-sort="date">Date</th>
                                <th class="px-6 py-3 font-medium cursor-pointer hover:text-white select-none w-32"
                                    data-sort="status">Status</th>
                            </tr>
                        </thead>
                        <tbody id="drawings-table-body" class="divide-y divide-white/5 text-sm text-white/80">
                            <!-- JS populates this -->
                        </tbody>
                    </table>

                    <!-- Empty State -->
                    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-white/20">
                        <svg class="w-12 h-12 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                            </path>
                        </svg>
                        <p class="font-mono text-xs">No drawings found</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="js/drawings-manager.js"></script>
</body>

</html>
