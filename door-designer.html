<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Firebase Auth Guard (Standard) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.min.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            firebase.auth().onAuthStateChanged((user) => {
                if (!user) window.location.href = 'login.html';
            });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panelled Door Designer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        /* === Color Palette (matching triptych73-site theme) === */
        :root {
            --midnight: #0F1115;
            --void: #050505;
            --panel: #16191D;
            --border: #2A2E35;
            --stone: #F5F5F0;
            --bronze: #9A8C74;
            --bronze-dark: #5C5242;
            --emerald: #10B981;
            --alert: #EF4444;
            --glass: rgba(255, 255, 255, 0.05);
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--midnight);
            font-family: 'Inter', sans-serif;
            color: var(--stone);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* === Info Overlay Panel === */
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-width: 320px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: max-height 0.3s ease;
            pointer-events: auto;
        }

        #overlay-header {
            padding: 12px 16px;
            background: var(--void);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        #overlay-header:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        #overlay-content {
            padding: 12px 16px;
            overflow-y: auto;
        }

        .minimized #overlay-content {
            display: none;
        }

        h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--stone);
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h2 {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            color: var(--bronze);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 12px 0 6px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .toggle-btn {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--gray-500);
            font-size: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .stat-label {
            color: var(--gray-400);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--stone);
            font-size: 11px;
        }

        /* === Loading Screen === */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: var(--bronze);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* === Custom lil-gui styling === */
        .lil-gui {
            --background-color: var(--panel) !important;
            --text-color: var(--stone) !important;
            --title-background-color: var(--void) !important;
            --title-text-color: var(--stone) !important;
            --widget-color: var(--border) !important;
            --hover-color: rgba(255, 255, 255, 0.05) !important;
            --focus-color: var(--bronze) !important;
            --number-color: var(--bronze) !important;
            --string-color: var(--bronze) !important;
            font-family: 'Inter', sans-serif !important;
        }

        .lil-gui .title {
            font-family: 'Inter', sans-serif !important;
            font-size: 11px !important;
            letter-spacing: 0.05em !important;
            text-transform: uppercase !important;
        }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="loading">Loading Workshop...</div>
    <div id="canvas-container"></div>

    <div id="overlay">
        <div id="overlay-header" onclick="document.getElementById('overlay').classList.toggle('minimized')">
            <h1>Door Designer</h1>
            <span class="toggle-btn">[-]</span>
        </div>
        <div id="overlay-content">
            <h2>Dimensions</h2>
            <div class="stat-row"><span class="stat-label">Total Width:</span><span class="stat-value"
                    id="disp-width">--</span></div>
            <div class="stat-row"><span class="stat-label">Total Height:</span><span class="stat-value"
                    id="disp-height">--</span></div>
            <div class="stat-row"><span class="stat-label">Arch Radius:</span><span class="stat-value"
                    id="disp-radius">--</span></div>

            <h2>Configuration</h2>
            <div class="stat-row"><span class="stat-label">Leaf Style:</span><span class="stat-value"
                    id="disp-style">--</span></div>
            <div class="stat-row"><span class="stat-label">Est. Weight:</span><span class="stat-value"
                    id="disp-weight">-- kg</span></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // ------------------------------------------------------------------
        // CLASS: Door
        // ------------------------------------------------------------------
        class Door {
            constructor(scene, config = {}) {
                this.scene = scene;
                this.meshGroup = new THREE.Group();
                this.scene.add(this.meshGroup);

                // Default Configuration
                this.config = Object.assign({
                    width: 1800,        // Total width (mm)
                    height: 2400,       // Total height to apex (mm)
                    thickness: 55,      // Door thickness (mm)

                    isDoubleLeaf: true, // Single or Double

                    // Arch Parameters
                    hasArch: true,
                    archSpringHeight: 1800, // Height where arch starts (mm)

                    // Frame & Panels
                    stileWidth: 150,    // Vertical beams
                    railWidth: 150,     // Horizontal beams (top/bottom)
                    muntinWidth: 80,    // Internal beams

                    panelRows: 3,
                    panelCols: 2,       // Per leaf

                    panelProfile: 'Chamfered', // Square, Chamfered, Ogee

                    woodType: 'Oak'     // Oak, Walnut, Painted
                }, config);

                this.materials = this.initMaterials();
                this.generate();
            }

            initMaterials() {
                // Placeholder materials - will be upgraded to textures later
                return {
                    oak: new THREE.MeshStandardMaterial({
                        color: 0x8B5A2B,
                        roughness: 0.7,
                        metalness: 0.1,
                        name: 'OakMat'
                    }),
                    glass: new THREE.MeshPhysicalMaterial({
                        color: 0xffffff,
                        metalness: 0,
                        roughness: 0,
                        transmission: 0.95,
                        transparent: true,
                        name: 'GlassMat'
                    })
                };
            }

            updateConfig(newConfig) {
                Object.assign(this.config, newConfig);
                this.generate();
            }

            generate() {
                // Clear existing geometry
                while (this.meshGroup.children.length > 0) {
                    const child = this.meshGroup.children[0];
                    if (child.geometry) child.geometry.dispose();
                    this.meshGroup.remove(child);
                }

                const { width, height, thickness, isDoubleLeaf, hasArch } = this.config;

                // Calculate Leaf Dimensions
                // If double leaf, each leaf is half width minus a small gap (e.g. 3mm)
                const gap = isDoubleLeaf ? 3 : 0;
                const leafWidth = isDoubleLeaf ? (width - gap) / 2 : width;

                // Position offsets
                const leftPos = isDoubleLeaf ? -width / 4 - gap / 4 : 0;
                const rightPos = isDoubleLeaf ? width / 4 + gap / 4 : 0;

                // Generate Left/Single Leaf
                const leftLeaf = this.createLeaf(leafWidth, height, thickness, true);
                leftLeaf.position.set(leftPos / 1000, 0, 0);
                this.meshGroup.add(leftLeaf);

                // Generate Right Leaf if needed
                if (isDoubleLeaf) {
                    const rightLeaf = this.createLeaf(leafWidth, height, thickness, false);
                    rightLeaf.position.set(rightPos / 1000, 0, 0);
                    // Mirror logic if needed (e.g. for rebates), for now identical
                    this.meshGroup.add(rightLeaf);
                }

                this.updateUI();
            }

            createLeaf(width, height, thickness, isLeft) {
                const group = new THREE.Group();
                const { stileWidth, railWidth, woodType, hasArch, archSpringHeight } = this.config;
                // Clamp spring height
                const effSpringH = hasArch ? Math.min(archSpringHeight, height) : height;

                // Helper to create members
                const createMember = (w, h, d, x, y, name) => {
                    const geo = new THREE.BoxGeometry(w / 1000, h / 1000, d / 1000);
                    const mesh = new THREE.Mesh(geo, this.materials.oak);
                    mesh.position.set(x / 1000, y / 1000, 0);
                    mesh.name = name;
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    return mesh;
                };

                // 1. Stiles (Vertical Side Beams)
                // Left Stile
                group.add(createMember(stileWidth, effSpringH, thickness, -width / 2 + stileWidth / 2, effSpringH / 2, 'Stile_Left'));
                // Right Stile
                group.add(createMember(stileWidth, effSpringH, thickness, width / 2 - stileWidth / 2, effSpringH / 2, 'Stile_Right'));

                // 2. Rails (Horizontal Beams)
                // Bottom Rail
                group.add(createMember(width - 2 * stileWidth, railWidth, thickness, 0, railWidth / 2, 'Rail_Bottom'));

                // Middle/Lock Rail - Only if space permits
                const lockRailHeight = 1000;
                // Check if panel rows > 1 before adding lock rail by default? 
                // Or does panel/muntin logic override this?
                // Let's keep Lock Rail as a "feature" but Panel logic handles the rest.
                // Actually, if we generate panels, we generate MUNTINS. 
                // A "Lock Rail" is just a wider muntin usually. 
                // Let's implicitely assume panelRows will generate horizontal bars.
                // WE REMOVE EXPLICIT LOCK RAIL here to rely on generatePanels, 
                // UNLESS panelRows is 1, then maybe we want a lock rail?
                // Let's KEEP Lock rail as a helper visual but be careful of overlap.
                // Actually, let's remove it and let generatePanels do the work.

                // 3. Top Rail / Arch
                if (hasArch) {
                    const archShape = new THREE.Shape();
                    const w = width / 1000;
                    const h_total = height / 1000;
                    const h_spring = effSpringH / 1000;
                    const t_rail = railWidth / 1000;
                    const t_stile = stileWidth / 1000;

                    const xRadius = w / 2;
                    const yRadius = h_total - h_spring;

                    // OUTER CURVE (Top of door)
                    // Box center is 0,0 for X.
                    archShape.absellipse(0, h_spring, xRadius, yRadius, Math.PI, 0, true);

                    // INNER CURVE (Bottom of rail)
                    const innerXRadius = Math.max(0.01, xRadius - t_stile);
                    const innerYRadius = Math.max(0.01, yRadius - t_rail);

                    archShape.lineTo(innerXRadius, h_spring);
                    archShape.absellipse(0, h_spring, innerXRadius, innerYRadius, 0, Math.PI, false);

                    archShape.closePath();

                    const extrudeSettings = {
                        steps: 1,
                        depth: thickness / 1000,
                        bevelEnabled: false
                    };

                    const archGeo = new THREE.ExtrudeGeometry(archShape, extrudeSettings);
                    archGeo.translate(0, 0, - (thickness / 1000) / 2);

                    const archMesh = new THREE.Mesh(archGeo, this.materials.oak);
                    archMesh.name = 'Rail_Arch';
                    archMesh.castShadow = true;
                    archMesh.receiveShadow = true;
                    group.add(archMesh);

                } else {
                    // Standard Top Rail
                    group.add(createMember(width - 2 * stileWidth, railWidth, thickness, 0, height - railWidth / 2, 'Rail_Top'));
                }

                // 4. Panels & Muntins
                this.generatePanels(group, width, effSpringH, thickness);

                return group;
            }

            generatePanels(group, leafWidth, leafHeight, thickness) {
                const { stileWidth, railWidth, muntinWidth, panelRows, panelCols } = this.config;

                // Working Area (Between Stiles and Main Rails)
                // Valid Panel Height = leafHeight - 2 * railWidth
                // Valid Panel Width = leafWidth - 2 * stileWidth

                const validW = leafWidth - 2 * stileWidth;
                const validH = leafHeight - 2 * railWidth;

                if (validW <= 0 || validH <= 0) return; // No space

                // Calculate Slot Dimensions
                const panelSlotW = (validW - (panelCols - 1) * muntinWidth) / panelCols;
                const panelSlotH = (validH - (panelRows - 1) * muntinWidth) / panelRows;

                if (panelSlotW <= 0 || panelSlotH <= 0) return;

                // Start Positions (Bottom-Left of valid area)
                // Center is 0,0. 
                // X Start = -leafWidth/2 + stileWidth
                // Y Start = railWidth (since bottom rail height is railWidth)

                const startX = -leafWidth / 2 + stileWidth;
                const startY = railWidth;

                // HELPER: Create Muntin
                const createMuntin = (w, h, x, y, name) => {
                    const geo = new THREE.BoxGeometry(w / 1000, h / 1000, thickness / 1000); // Full thickness for frame
                    const mesh = new THREE.Mesh(geo, this.materials.oak);
                    mesh.position.set(x / 1000, y / 1000, 0);
                    mesh.name = name;
                    mesh.castShadow = true;
                    group.add(mesh);
                };

                // HELPER: Create Panel
                const createPanel = (w, h, x, y) => {
                    const pThick = thickness * 0.6;
                    const geo = new THREE.BoxGeometry(w / 1000, h / 1000, pThick / 1000);
                    const mesh = new THREE.Mesh(geo, this.materials.oak);
                    mesh.position.set(x / 1000, y / 1000, 0);
                    mesh.name = 'Panel';
                    mesh.castShadow = true;
                    group.add(mesh);
                };

                // Grid Loop
                for (let r = 0; r < panelRows; r++) {
                    for (let c = 0; c < panelCols; c++) {
                        const x = startX + c * (panelSlotW + muntinWidth) + panelSlotW / 2;
                        const y = startY + r * (panelSlotH + muntinWidth) + panelSlotH / 2;

                        createPanel(panelSlotW, panelSlotH, x, y);

                        // Vertical Muntin (to the right if not last)
                        if (c < panelCols - 1) {
                            const mx = startX + (c + 1) * panelSlotW + c * muntinWidth + muntinWidth / 2;
                            const my = y;
                            createMuntin(muntinWidth, panelSlotH, mx, my, 'Muntin_Vert');
                        }
                    }

                    // Horizontal Muntin (above if not last)
                    if (r < panelRows - 1) {
                        const ry = startY + (r + 1) * panelSlotH + r * muntinWidth + muntinWidth / 2;
                        const rx = 0; // Center X (spans full valid width)
                        // Wait, rx should be 0 because validW is centered.
                        createMuntin(validW, muntinWidth, rx, ry, 'Muntin_Horz');
                    }
                }
            }

            updateUI() {
                document.getElementById('disp-width').textContent = `${this.config.width} mm`;
                document.getElementById('disp-height').textContent = `${this.config.height} mm`;
                document.getElementById('disp-radius').textContent = this.config.hasArch ? `Spring: ${this.config.archSpringHeight}mm` : 'N/A';
                document.getElementById('disp-style').textContent = this.config.isDoubleLeaf ? 'Double Leaf' : 'Single Leaf';

                // Crude weight calc (Oak approx 750kg/m3)
                const vol = (this.config.width / 1000) * (this.config.height / 1000) * (this.config.thickness / 1000);
                const weight = Math.round(vol * 750 * 0.8);
                document.getElementById('disp-weight').textContent = weight;
            }
        }

        // ------------------------------------------------------------------
        // APP INIT
        // ------------------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0F1115); // Matches --midnight
        // scene.fog = new THREE.Fog(0x0F1115, 5, 20);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1.2, 0);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Grid
        const gridHelper = new THREE.GridHelper(10, 10, 0x2A2E35, 0x16191D);
        scene.add(gridHelper);

        // Initialize Door
        const door = new Door(scene);

        // GUI Setup
        const gui = new GUI({ title: 'Workshop Controls' });

        const dimFolder = gui.addFolder('Dimensions');
        dimFolder.add(door.config, 'width', 800, 4000).onChange(() => door.generate());
        dimFolder.add(door.config, 'height', 1800, 4000).onChange(() => door.generate());
        dimFolder.add(door.config, 'thickness', 35, 80).onChange(() => door.generate());

        const styleFolder = gui.addFolder('Style');
        styleFolder.add(door.config, 'isDoubleLeaf').name('Double Leaf').onChange(() => door.generate());
        styleFolder.add(door.config, 'hasArch').name('Arched Top').onChange(() => door.generate());
        styleFolder.add(door.config, 'archSpringHeight', 1000, 3000).name('Arch Spring H').onChange(() => door.generate());

        const panelFolder = gui.addFolder('Panels');
        panelFolder.add(door.config, 'panelRows', 1, 6, 1).onChange(() => door.generate());
        panelFolder.add(door.config, 'panelCols', 1, 4, 1).onChange(() => door.generate());
        panelFolder.add(door.config, 'muntinWidth', 40, 200, 5).name('Muntin Width').onChange(() => door.generate());
        panelFolder.add(door.config, 'stileWidth', 80, 400, 5).name('Stile Width').onChange(() => door.generate());
        panelFolder.add(door.config, 'railWidth', 80, 400, 5).name('Rail Width').onChange(() => door.generate());

        document.getElementById('loading').style.display = 'none';

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
