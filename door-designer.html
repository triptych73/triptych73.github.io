    <style>
        :root {
            --midnight: #0F1115;
            --void: #050505;
            --panel: #16191D;
            --border: #2A2E35;
            --stone: #F5F5F0;
            --bronze: #9A8C74;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--midnight);
            font-family: 'Inter', sans-serif;
            color: var(--stone);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-width: 320px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
        }

        #overlay-header {
            padding: 12px 16px;
            background: var(--void);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        #overlay-header:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        #overlay-content {
            padding: 12px 16px;
            overflow-y: auto;
        }

        .minimized #overlay-content {
            display: none;
        }

        h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--stone);
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h2 {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            color: var(--bronze);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 12px 0 6px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .toggle-btn {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--gray-500);
            font-size: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .stat-label {
            color: var(--gray-400);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--stone);
            font-size: 11px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: var(--bronze);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .lil-gui {
            --background-color: var(--panel) !important;
            --text-color: var(--stone) !important;
            --title-background-color: var(--void) !important;
            --title-text-color: var(--stone) !important;
            --widget-color: var(--border) !important;
            --hover-color: rgba(255, 255, 255, 0.05) !important;
            --focus-color: var(--bronze) !important;
            --number-color: var(--bronze) !important;
            font-family: 'Inter', sans-serif !important;
        }

        .lil-gui .title {
            font-family: 'Inter', sans-serif !important;
            font-size: 11px !important;
            letter-spacing: 0.05em !important;
            text-transform: uppercase !important;
        }
    </style>

<body>
    <div id="loading">Loading Workshop...</div>
    <div id="canvas-container"></div>

    <div id="overlay">
        <div id="overlay-header" onclick="document.getElementById('overlay').classList.toggle('minimized')">
            <h1>Door Designer</h1>
            <span class="toggle-btn">[-]</span>
        </div>
        <div id="overlay-content">
            <h2>Dimensions</h2>
            <div class="stat-row"><span class="stat-label">Total Width:</span><span class="stat-value"
                    id="disp-width">--</span></div>
            <div class="stat-row"><span class="stat-label">Apex Height:</span><span class="stat-value"
                    id="disp-height">--</span></div>
            <div class="stat-row"><span class="stat-label">Arch Radius:</span><span class="stat-value"
                    id="disp-radius">--</span></div>
            <div class="stat-row"><span class="stat-label">Arch Center Y:</span><span class="stat-value"
                    id="disp-center">--</span></div>
            <h2>Configuration</h2>
            <div class="stat-row"><span class="stat-label">Leaf Style:</span><span class="stat-value"
                    id="disp-style">--</span></div>
            <div class="stat-row"><span class="stat-label">Est. Weight:</span><span class="stat-value"
                    id="disp-weight">-- kg</span></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        class Door {
            constructor(scene, config = {}) {
                this.scene = scene;
                this.meshGroup = new THREE.Group();
                this.scene.add(this.meshGroup);

                this.config = Object.assign({
                    width: 1800,
                    thickness: 55,
                    isDoubleLeaf: true,

                    hasArch: true,
                    archRadius: 1200,
                    archCenterY: 1600,

                    stileWidth: 120,
                    railWidth: 120,
                    muntinWidth: 60,

                    panelRowHeights: [500, 450, 400],
                    panelCols: 2,
                    panelProfile: 'Raised', // Flat, Raised, Ogee, Bead

                    woodType: 'Oak'
                }, config);

                this.materials = this.initMaterials();
                this.generate();
            }

            initMaterials() {
                return {
                    oak: new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.7, metalness: 0.1, side: THREE.DoubleSide }),
                    oakDark: new THREE.MeshStandardMaterial({ color: 0x6B4420, roughness: 0.75, metalness: 0.1, side: THREE.DoubleSide }),
                };
            }

            generate() {
                while (this.meshGroup.children.length > 0) {
                    const child = this.meshGroup.children[0];
                    if (child.geometry) child.geometry.dispose();
                    this.meshGroup.remove(child);
                }

                const { width, thickness, isDoubleLeaf } = this.config;

                const gap = isDoubleLeaf ? 3 : 0;
                const leafWidth = isDoubleLeaf ? (width - gap) / 2 : width;

                const leftPos = isDoubleLeaf ? -width / 4 - gap / 4 : 0;
                const rightPos = isDoubleLeaf ? width / 4 + gap / 4 : 0;

                const leftLeaf = this.createLeaf(leafWidth, thickness, true, leftPos);
                this.meshGroup.add(leftLeaf);

                if (isDoubleLeaf) {
                    const rightLeaf = this.createLeaf(leafWidth, thickness, false, rightPos);
                    this.meshGroup.add(rightLeaf);
                }

                this.updateUI();
            }

            // Get Y on circle at global X. Circle: x² + (y - cy)² = r²
            getArchY(xGlobal) {
                const { archRadius, archCenterY } = this.config;
                const r = archRadius / 1000;
                const cy = archCenterY / 1000;
                if (Math.abs(xGlobal) > r) return cy;
                return cy + Math.sqrt(r * r - xGlobal * xGlobal);
            }

            createLeaf(leafWidth, thickness, isLeft, leafCenterX) {
                const group = new THREE.Group();
                group.position.set(leafCenterX / 1000, 0, 0);

                const { stileWidth, railWidth, muntinWidth, panelRowHeights, panelCols, hasArch, archRadius, archCenterY } = this.config;

                const w = leafWidth / 1000;
                const t = thickness / 1000;
                const sw = stileWidth / 1000;
                const rw = railWidth / 1000;
                const mw = muntinWidth / 1000;
                const r = archRadius / 1000;
                const cy = archCenterY / 1000;

                const innerLeftX = -w / 2 + sw;
                const innerRightX = w / 2 - sw;
                const innerWidth = innerRightX - innerLeftX;

                // Global X coordinates for arch calculations
                const gLeftOuter = leafCenterX / 1000 - w / 2;
                const gLeftInner = leafCenterX / 1000 - w / 2 + sw;
                const gRightOuter = leafCenterX / 1000 + w / 2;
                const gRightInner = leafCenterX / 1000 + w / 2 - sw;

                // Helper for boxes
                const createBox = (bw, bh, bd, x, y, mat, name) => {
                    const geo = new THREE.BoxGeometry(bw, bh, bd);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, y, 0);
                    mesh.name = name;
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    return mesh;
                };

                // --- STILES with curved top ---
                if (hasArch) {
                    // Left stile: rectangle from y=0 to arch curve
                    const leftStile = this.createCurvedStile(
                        -w / 2, -w / 2 + sw,  // local x range
                        gLeftOuter, gLeftInner,  // global x range (for arch)
                        t, 'Stile_Left'
                    );
                    group.add(leftStile);

                    // Right stile
                    const rightStile = this.createCurvedStile(
                        w / 2 - sw, w / 2,  // local x range
                        gRightInner, gRightOuter,  // global x range
                        t, 'Stile_Right'
                    );
                    group.add(rightStile);
                } else {
                    // Simple box stiles for non-arch
                    const stileH = 2.5; // Fixed height if no arch
                    group.add(createBox(sw, stileH, t, -w / 2 + sw / 2, stileH / 2, this.materials.oak, 'Stile_Left'));
                    group.add(createBox(sw, stileH, t, w / 2 - sw / 2, stileH / 2, this.materials.oak, 'Stile_Right'));
                }

                // --- BOTTOM RAIL ---
                group.add(createBox(innerWidth, rw, t, 0, rw / 2, this.materials.oak, 'Rail_Bottom'));

                // --- PANELS & HORIZONTAL MUNTINS ---
                let currentY = rw;
                const numRows = panelRowHeights.length;

                for (let row = 0; row < numRows; row++) {
                    const rowH = panelRowHeights[row] / 1000;
                    const rowCenterY = currentY + rowH / 2;
                    const rowTopY = currentY + rowH;

                    const colW = (innerWidth - (panelCols - 1) * mw) / panelCols;
                    for (let c = 0; c < panelCols; c++) {
                        const panelX = innerLeftX + c * (colW + mw) + colW / 2;
                        const profiledPanel = this.createProfiledPanel(colW, rowH, t, panelX, rowCenterY);
                        group.add(profiledPanel);

                        if (c < panelCols - 1) {
                            const mx = innerLeftX + (c + 1) * colW + c * mw + mw / 2;
                            group.add(createBox(mw, rowH, t, mx, rowCenterY, this.materials.oak, 'Muntin_V'));
                        }
                    }

                    if (row < numRows - 1) {
                        const hmy = currentY + rowH + mw / 2;
                        group.add(createBox(innerWidth, mw, t, 0, hmy, this.materials.oak, 'Muntin_H'));
                    }

                    currentY += rowH + (row < numRows - 1 ? mw : 0);
                }

                // --- TOP RAIL ---
                const topRailY = currentY + rw / 2;
                group.add(createBox(innerWidth, rw, t, 0, topRailY, this.materials.oak, 'Rail_Top'));

                // --- ARCHED TOP PANEL ---
                if (hasArch) {
                    const archStartY = currentY + rw;
                    const curvedPanel = this.createLeafArchPanel(leafWidth, thickness, leafCenterX, archStartY);
                    if (curvedPanel) group.add(curvedPanel);

                    // --- ARCHED TOP RAIL (frame around the curved panel) ---
                    const archedRail = this.createArchedTopRail(leafWidth, thickness, leafCenterX, archStartY);
                    if (archedRail) group.add(archedRail);
                }

                return group;
            }

            createProfiledPanel(width, height, thickness, x, y) {
                // Creates a panel with classical moulding profile
                const { panelProfile } = this.config;
                const w = width;
                const h = height;
                const t = thickness * 0.6; // Panel is thinner than frame

                let geometry;
                const margin = Math.min(w, h) * 0.15; // Moulding margin

                switch (panelProfile) {
                    case 'Raised': {
                        // Raised/Fielded panel: raised center with beveled edges
                        const shape = new THREE.Shape();
                        shape.moveTo(-w / 2, -h / 2);
                        shape.lineTo(w / 2, -h / 2);
                        shape.lineTo(w / 2, h / 2);
                        shape.lineTo(-w / 2, h / 2);
                        shape.closePath();

                        // Create bevel extrude
                        geometry = new THREE.ExtrudeGeometry(shape, {
                            steps: 1,
                            depth: t,
                            bevelEnabled: true,
                            bevelThickness: t * 0.3,
                            bevelSize: margin,
                            bevelOffset: -margin,
                            bevelSegments: 2
                        });
                        geometry.translate(0, 0, -t / 2);
                        break;
                    }

                    case 'Ogee': {
                        // Ogee profile: S-curve moulding around the edge
                        const shape = new THREE.Shape();
                        const m = margin;

                        // Outer rectangle
                        shape.moveTo(-w / 2, -h / 2);
                        shape.lineTo(w / 2, -h / 2);
                        shape.lineTo(w / 2, h / 2);
                        shape.lineTo(-w / 2, h / 2);
                        shape.closePath();

                        // Inner cutout (raised field)
                        const hole = new THREE.Path();
                        hole.moveTo(-w / 2 + m, -h / 2 + m);
                        hole.lineTo(w / 2 - m, -h / 2 + m);
                        hole.lineTo(w / 2 - m, h / 2 - m);
                        hole.lineTo(-w / 2 + m, h / 2 - m);
                        hole.closePath();
                        shape.holes.push(hole);

                        // Moulding border (thin)
                        const borderGeo = new THREE.ExtrudeGeometry(shape, {
                            steps: 1,
                            depth: t * 0.4,
                            bevelEnabled: true,
                            bevelThickness: t * 0.2,
                            bevelSize: m * 0.3,
                            bevelOffset: 0,
                            bevelSegments: 3
                        });

                        // Center field (raised)
                        const fieldShape = new THREE.Shape();
                        fieldShape.moveTo(-w / 2 + m, -h / 2 + m);
                        fieldShape.lineTo(w / 2 - m, -h / 2 + m);
                        fieldShape.lineTo(w / 2 - m, h / 2 - m);
                        fieldShape.lineTo(-w / 2 + m, h / 2 - m);
                        fieldShape.closePath();

                        const fieldGeo = new THREE.ExtrudeGeometry(fieldShape, {
                            steps: 1,
                            depth: t,
                            bevelEnabled: false
                        });

                        // Merge geometries
                        borderGeo.translate(0, 0, -t * 0.3);
                        fieldGeo.translate(0, 0, -t / 2);

                        const merged = new THREE.BufferGeometry();
                        // Use simpler approach: just use raised field
                        geometry = fieldGeo;
                        borderGeo.dispose();
                        break;
                    }

                    case 'Bead': {
                        // Bead profile: rounded bead edge around panel
                        const shape = new THREE.Shape();
                        shape.moveTo(-w / 2, -h / 2);
                        shape.lineTo(w / 2, -h / 2);
                        shape.lineTo(w / 2, h / 2);
                        shape.lineTo(-w / 2, h / 2);
                        shape.closePath();

                        geometry = new THREE.ExtrudeGeometry(shape, {
                            steps: 1,
                            depth: t,
                            bevelEnabled: true,
                            bevelThickness: t * 0.25,
                            bevelSize: margin * 0.5,
                            bevelOffset: -margin * 0.3,
                            bevelSegments: 8 // Smooth round bead
                        });
                        geometry.translate(0, 0, -t / 2);
                        break;
                    }

                    case 'Flat':
                    default: {
                        // Simple flat panel
                        geometry = new THREE.BoxGeometry(w, h, t);
                        break;
                    }
                }

                const mesh = new THREE.Mesh(geometry, this.materials.oakDark);
                mesh.position.set(x, y, 0);
                mesh.name = 'Panel';
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                return mesh;
            }

            createArchedTopRail(leafWidth, thickness, leafCenterX, archStartY) {
                // Creates the curved rail that frames the top arch panel
                const { archRadius, archCenterY, stileWidth, railWidth } = this.config;

                const w = leafWidth / 1000;
                const t = thickness / 1000;
                const sw = stileWidth / 1000;
                const rw = railWidth / 1000;
                const rOuter = archRadius / 1000;
                const rInner = rOuter - rw; // Inner radius (smaller)
                const cy = archCenterY / 1000;
                const startY = archStartY;

                // Edges of the panel area (inside the stiles)
                const localLeftX = -w / 2 + sw;
                const localRightX = w / 2 - sw;

                // Global X coordinates
                const globalLeftX = leafCenterX / 1000 + localLeftX;
                const globalRightX = leafCenterX / 1000 + localRightX;

                // Check outer bounds
                if (Math.abs(globalLeftX) > rOuter || Math.abs(globalRightX) > rOuter) return null;

                // Y positions on outer arc
                const yOuterLeft = cy + Math.sqrt(rOuter * rOuter - globalLeftX * globalLeftX);
                const yOuterRight = cy + Math.sqrt(rOuter * rOuter - globalRightX * globalRightX);

                if (startY >= Math.min(yOuterLeft, yOuterRight)) return null;

                const shape = new THREE.Shape();
                const numSegments = 32;

                // Bottom edge: trace inner arc from left to right
                // We sample points and use either inner arc or startY
                shape.moveTo(localLeftX, startY);

                // If inner radius is valid, draw inner arc from left to right
                if (rInner > 0) {
                    for (let i = 0; i <= numSegments; i++) {
                        const t_param = i / numSegments;
                        const localX = localLeftX + t_param * (localRightX - localLeftX);
                        const globalX = leafCenterX / 1000 + localX;

                        let py;
                        if (Math.abs(globalX) <= rInner) {
                            py = cy + Math.sqrt(rInner * rInner - globalX * globalX);
                            py = Math.max(startY, py); // Clamp to startY if below
                        } else {
                            py = startY; // Outside inner radius, use straight edge
                        }
                        shape.lineTo(localX, py);
                    }
                } else {
                    shape.lineTo(localRightX, startY);
                }

                // Top edge: trace outer arc from right to left
                const angleOuterRight = Math.atan2(yOuterRight - cy, globalRightX);
                const angleOuterLeft = Math.atan2(yOuterLeft - cy, globalLeftX);

                for (let i = 0; i <= numSegments; i++) {
                    const t_param = i / numSegments;
                    const angle = angleOuterRight + t_param * (angleOuterLeft - angleOuterRight);
                    const px = rOuter * Math.cos(angle) - leafCenterX / 1000;
                    const py = cy + rOuter * Math.sin(angle);
                    shape.lineTo(px, py);
                }

                shape.closePath();

                const extrudeSettings = { steps: 1, depth: t, bevelEnabled: false };
                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                geo.translate(0, 0, -t / 2);

                const mesh = new THREE.Mesh(geo, this.materials.oak);
                mesh.name = 'Rail_Arch';
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                return mesh;
            }

            createCurvedStile(localXLeft, localXRight, globalXLeft, globalXRight, depth, name) {
                // Creates a stile that follows the arch curve at the top
                const { archRadius, archCenterY } = this.config;
                const r = archRadius / 1000;
                const cy = archCenterY / 1000;

                // Get arch Y at both edges
                const yAtLeft = Math.abs(globalXLeft) <= r ? cy + Math.sqrt(r * r - globalXLeft * globalXLeft) : cy;
                const yAtRight = Math.abs(globalXRight) <= r ? cy + Math.sqrt(r * r - globalXRight * globalXRight) : cy;

                // Create shape: rectangle with curved top
                const shape = new THREE.Shape();

                // Start at bottom-left
                shape.moveTo(localXLeft, 0);
                // Bottom-right
                shape.lineTo(localXRight, 0);
                // Up to arch at right edge
                shape.lineTo(localXRight, yAtRight);

                // Arc from right to left (following the outer edge of the overall arch)
                // We need to draw a small arc segment between these two points
                // Both points are on the circle, so we use absarc
                const angleRight = Math.atan2(yAtRight - cy, globalXRight);
                const angleLeft = Math.atan2(yAtLeft - cy, globalXLeft);

                // Arc center in local coordinates: global center is (0, cy), so local center is (-leafCenterX, cy)
                // But stile shape is already in leaf-local coords. The arc center relative to stile is complex.
                // Simpler: just do a straight line for now if the arc segment is small.
                // OR: we can arc it properly.

                // For a stile, the arc segment is small. Let's just line it.
                shape.lineTo(localXLeft, yAtLeft);

                shape.closePath();

                const extrudeSettings = { steps: 1, depth: depth, bevelEnabled: false };
                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                geo.translate(0, 0, -depth / 2);

                const mesh = new THREE.Mesh(geo, this.materials.oak);
                mesh.name = name;
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                return mesh;
            }

            createLeafArchPanel(leafWidth, thickness, leafCenterX, archStartY) {
                const { archRadius, archCenterY, stileWidth } = this.config;

                const w = leafWidth / 1000;
                const t = (thickness * 0.6) / 1000;
                const sw = stileWidth / 1000;
                const r = archRadius / 1000;
                const cy = archCenterY / 1000;
                const startY = archStartY;

                const innerLeftX = -w / 2 + sw;
                const innerRightX = w / 2 - sw;

                const globalInnerLeft = leafCenterX / 1000 + innerLeftX;
                const globalInnerRight = leafCenterX / 1000 + innerRightX;

                if (Math.abs(globalInnerLeft) > r || Math.abs(globalInnerRight) > r) return null;

                const yAtLeft = cy + Math.sqrt(r * r - globalInnerLeft * globalInnerLeft);
                const yAtRight = cy + Math.sqrt(r * r - globalInnerRight * globalInnerRight);

                if (startY >= Math.min(yAtLeft, yAtRight)) return null;

                const shape = new THREE.Shape();

                shape.moveTo(innerLeftX, startY);
                shape.lineTo(innerRightX, startY);

                // Arc from right to left
                const localCenterX = -leafCenterX / 1000;
                const angleRight = Math.atan2(yAtRight - cy, globalInnerRight);
                const angleLeft = Math.atan2(yAtLeft - cy, globalInnerLeft);

                // Draw arc segment - need to sample points along the arc
                const numSegments = 32;
                for (let i = 0; i <= numSegments; i++) {
                    const t_param = i / numSegments;
                    const angle = angleRight + t_param * (angleLeft - angleRight);
                    const px = r * Math.cos(angle) - leafCenterX / 1000; // Local X
                    const py = cy + r * Math.sin(angle);
                    if (i === 0) {
                        shape.lineTo(px, py);
                    } else {
                        shape.lineTo(px, py);
                    }
                }

                shape.closePath();

                const extrudeSettings = { steps: 1, depth: t, bevelEnabled: false };
                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                geo.translate(0, 0, -t / 2);

                const mesh = new THREE.Mesh(geo, this.materials.oakDark);
                mesh.name = 'Panel_Arch';
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                return mesh;
            }

            updateUI() {
                const { width, archRadius, archCenterY, isDoubleLeaf, thickness, hasArch } = this.config;
                const apexHeight = hasArch ? archCenterY + archRadius : 'N/A';

                document.getElementById('disp-width').textContent = `${width} mm`;
                document.getElementById('disp-height').textContent = hasArch ? `${apexHeight} mm` : 'N/A';
                document.getElementById('disp-radius').textContent = hasArch ? `${archRadius} mm` : 'N/A';
                document.getElementById('disp-center').textContent = hasArch ? `${archCenterY} mm` : 'N/A';
                document.getElementById('disp-style').textContent = isDoubleLeaf ? 'Double Leaf' : 'Single Leaf';

                const vol = (width / 1000) * ((archCenterY + archRadius) / 1000) * (thickness / 1000);
                const weight = Math.round(vol * 750 * 0.65);
                document.getElementById('disp-weight').textContent = weight + ' kg';
            }
        }

        // --- APP INIT ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0F1115);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1.2, 0);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(10, 10, 0x2A2E35, 0x16191D);
        scene.add(gridHelper);

        const door = new Door(scene);

        // --- GUI ---
        const gui = new GUI({ title: 'Workshop Controls' });

        const dimFolder = gui.addFolder('Dimensions');
        dimFolder.add(door.config, 'width', 800, 4000).name('Width (mm)').onChange(() => door.generate());
        dimFolder.add(door.config, 'thickness', 35, 80).name('Thickness (mm)').onChange(() => door.generate());

        const archFolder = gui.addFolder('Arch');
        archFolder.add(door.config, 'hasArch').name('Enable Arch').onChange(() => door.generate());
        archFolder.add(door.config, 'archRadius', 500, 3000).name('Radius (mm)').onChange(() => door.generate());
        archFolder.add(door.config, 'archCenterY', 500, 2500).name('Center Y (mm)').onChange(() => door.generate());

        const styleFolder = gui.addFolder('Style');
        styleFolder.add(door.config, 'isDoubleLeaf').name('Double Leaf').onChange(() => door.generate());
        styleFolder.add(door.config, 'panelProfile', ['Flat', 'Raised', 'Ogee', 'Bead']).name('Panel Profile').onChange(() => door.generate());

        const frameFolder = gui.addFolder('Frame');
        frameFolder.add(door.config, 'stileWidth', 60, 300, 5).name('Stile W').onChange(() => door.generate());
        frameFolder.add(door.config, 'railWidth', 60, 300, 5).name('Rail W').onChange(() => door.generate());
        frameFolder.add(door.config, 'muntinWidth', 30, 150, 5).name('Muntin W').onChange(() => door.generate());

        const panelFolder = gui.addFolder('Panel Heights (mm)');
        const rowHeightControllers = [];
        function rebuildPanelGUI() {
            rowHeightControllers.forEach(c => c.destroy());
            rowHeightControllers.length = 0;
            door.config.panelRowHeights.forEach((h, i) => {
                const ctrl = panelFolder.add(door.config.panelRowHeights, i, 100, 800, 10).name(`Row ${i + 1}`).onChange(() => door.generate());
                rowHeightControllers.push(ctrl);
            });
        }
        rebuildPanelGUI();

        const panelOps = {
            addRow: () => { door.config.panelRowHeights.push(400); rebuildPanelGUI(); door.generate(); },
            removeRow: () => { if (door.config.panelRowHeights.length > 1) { door.config.panelRowHeights.pop(); rebuildPanelGUI(); door.generate(); } }
        };
        panelFolder.add(panelOps, 'addRow').name('+ Add Row');
        panelFolder.add(panelOps, 'removeRow').name('- Remove Row');
        panelFolder.add(door.config, 'panelCols', 1, 4, 1).name('Columns').onChange(() => door.generate());

        document.getElementById('loading').style.display = 'none';

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
