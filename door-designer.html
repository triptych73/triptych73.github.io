<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Firebase Auth Guard (Standard) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.min.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            firebase.auth().onAuthStateChanged((user) => {
                if (!user) window.location.href = 'login.html';
            });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panelled Door Designer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        /* === Color Palette (matching triptych73-site theme) === */
        :root {
            --midnight: #0F1115;
            --void: #050505;
            --panel: #16191D;
            --border: #2A2E35;
            --stone: #F5F5F0;
            --bronze: #9A8C74;
            --bronze-dark: #5C5242;
            --emerald: #10B981;
            --alert: #EF4444;
            --glass: rgba(255, 255, 255, 0.05);
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--midnight);
            font-family: 'Inter', sans-serif;
            color: var(--stone);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* === Info Overlay Panel === */
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-width: 320px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: max-height 0.3s ease;
            pointer-events: auto;
        }

        #overlay-header {
            padding: 12px 16px;
            background: var(--void);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        #overlay-header:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        #overlay-content {
            padding: 12px 16px;
            overflow-y: auto;
        }

        .minimized #overlay-content {
            display: none;
        }

        h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--stone);
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h2 {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            color: var(--bronze);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 12px 0 6px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .toggle-btn {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--gray-500);
            font-size: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .stat-label {
            color: var(--gray-400);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--stone);
            font-size: 11px;
        }

        /* === Loading Screen === */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: var(--bronze);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* === Custom lil-gui styling === */
        .lil-gui {
            --background-color: var(--panel) !important;
            --text-color: var(--stone) !important;
            --title-background-color: var(--void) !important;
            --title-text-color: var(--stone) !important;
            --widget-color: var(--border) !important;
            --hover-color: rgba(255, 255, 255, 0.05) !important;
            --focus-color: var(--bronze) !important;
            --number-color: var(--bronze) !important;
            --string-color: var(--bronze) !important;
            font-family: 'Inter', sans-serif !important;
        }

        .lil-gui .title {
            font-family: 'Inter', sans-serif !important;
            font-size: 11px !important;
            letter-spacing: 0.05em !important;
            text-transform: uppercase !important;
        }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="loading">Loading Workshop...</div>
    <div id="canvas-container"></div>

    <div id="overlay">
        <div id="overlay-header" onclick="document.getElementById('overlay').classList.toggle('minimized')">
            <h1>Door Designer</h1>
            <span class="toggle-btn">[-]</span>
        </div>
        <div id="overlay-content">
            <h2>Dimensions</h2>
            <div class="stat-row"><span class="stat-label">Total Width:</span><span class="stat-value"
                    id="disp-width">--</span></div>
            <div class="stat-row"><span class="stat-label">Total Height:</span><span class="stat-value"
                    id="disp-height">--</span></div>
            <div class="stat-row"><span class="stat-label">Arch Radius:</span><span class="stat-value"
                    id="disp-radius">--</span></div>
            <div class="stat-row"><span class="stat-label">Arch Center Y:</span><span class="stat-value"
                    id="disp-center">--</span></div>

            <h2>Configuration</h2>
            <div class="stat-row"><span class="stat-label">Leaf Style:</span><span class="stat-value"
                    id="disp-style">--</span></div>
            <div class="stat-row"><span class="stat-label">Est. Weight:</span><span class="stat-value"
                    id="disp-weight">-- kg</span></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        // ------------------------------------------------------------------
        // CLASS: Door
        // ------------------------------------------------------------------
        class Door {
            constructor(scene, config = {}) {
                this.scene = scene;
                this.meshGroup = new THREE.Group();
                this.scene.add(this.meshGroup);

                // Default Configuration
                this.config = Object.assign({
                    width: 1800,        // Total width (mm)
                    height: 2200,       // Height to top of rectangular section (mm)
                    thickness: 55,      // Door thickness (mm)

                    isDoubleLeaf: true, // Single or Double

                    // Overall Arch Parameters (Arch spans full width)
                    hasArch: true,
                    archRadius: 1200,   // Radius of the circular arch (mm)
                    archCenterY: 1800,  // Y position of the arch center (mm from floor)

                    // Frame & Panels
                    stileWidth: 150,    // Vertical beams
                    railWidth: 150,     // Horizontal beams (top/bottom)
                    muntinWidth: 80,    // Internal beams

                    panelRows: 3,
                    panelCols: 2,       // Per leaf

                    panelProfile: 'Chamfered', // Square, Chamfered, Ogee

                    woodType: 'Oak'     // Oak, Walnut, Painted
                }, config);

                this.materials = this.initMaterials();
                this.generate();
            }

            initMaterials() {
                return {
                    oak: new THREE.MeshStandardMaterial({
                        color: 0x8B5A2B,
                        roughness: 0.7,
                        metalness: 0.1,
                        name: 'OakMat'
                    }),
                    oakDark: new THREE.MeshStandardMaterial({
                        color: 0x6B4420,
                        roughness: 0.75,
                        metalness: 0.1,
                        name: 'OakDarkMat'
                    }),
                    glass: new THREE.MeshPhysicalMaterial({
                        color: 0xffffff,
                        metalness: 0,
                        roughness: 0,
                        transmission: 0.95,
                        transparent: true,
                        name: 'GlassMat'
                    })
                };
            }

            updateConfig(newConfig) {
                Object.assign(this.config, newConfig);
                this.generate();
            }

            generate() {
                // Clear existing geometry
                while (this.meshGroup.children.length > 0) {
                    const child = this.meshGroup.children[0];
                    if (child.geometry) child.geometry.dispose();
                    this.meshGroup.remove(child);
                }

                const { width, height, thickness, isDoubleLeaf, hasArch, archRadius, archCenterY, stileWidth, railWidth } = this.config;

                // Calculate Leaf Dimensions
                const gap = isDoubleLeaf ? 3 : 0;
                const leafWidth = isDoubleLeaf ? (width - gap) / 2 : width;

                // Position offsets
                const leftPos = isDoubleLeaf ? -width / 4 - gap / 4 : 0;
                const rightPos = isDoubleLeaf ? width / 4 + gap / 4 : 0;

                // Generate Left/Single Leaf
                const leftLeaf = this.createLeaf(leafWidth, height, thickness, true);
                leftLeaf.position.set(leftPos / 1000, 0, 0);
                this.meshGroup.add(leftLeaf);

                // Generate Right Leaf if needed
                if (isDoubleLeaf) {
                    const rightLeaf = this.createLeaf(leafWidth, height, thickness, false);
                    rightLeaf.position.set(rightPos / 1000, 0, 0);
                    this.meshGroup.add(rightLeaf);
                }

                // Generate Overall Arch Frame (spans entire width)
                if (hasArch) {
                    const archFrame = this.createOverallArchFrame(width, archRadius, archCenterY, thickness);
                    this.meshGroup.add(archFrame);

                    // Generate Curved Top Panel
                    const curvedPanel = this.createCurvedTopPanel(width, archRadius, archCenterY, height, thickness);
                    if (curvedPanel) this.meshGroup.add(curvedPanel);
                }

                this.updateUI();
            }

            createLeaf(width, height, thickness, isLeft) {
                const group = new THREE.Group();
                const { stileWidth, railWidth, woodType, hasArch, archCenterY, archRadius } = this.config;

                // Effective height for stiles (up to bottom of arch if arch exists)
                const effHeight = height;

                // Helper to create members
                const createMember = (w, h, d, x, y, name) => {
                    const geo = new THREE.BoxGeometry(w / 1000, h / 1000, d / 1000);
                    const mesh = new THREE.Mesh(geo, this.materials.oak);
                    mesh.position.set(x / 1000, y / 1000, 0);
                    mesh.name = name;
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    return mesh;
                };

                // 1. Stiles (Vertical Side Beams)
                group.add(createMember(stileWidth, effHeight, thickness, -width / 2 + stileWidth / 2, effHeight / 2, 'Stile_Left'));
                group.add(createMember(stileWidth, effHeight, thickness, width / 2 - stileWidth / 2, effHeight / 2, 'Stile_Right'));

                // 2. Rails (Horizontal Beams)
                // Bottom Rail
                group.add(createMember(width - 2 * stileWidth, railWidth, thickness, 0, railWidth / 2, 'Rail_Bottom'));

                // Top Rail (at the height, below the arch area)
                group.add(createMember(width - 2 * stileWidth, railWidth, thickness, 0, effHeight - railWidth / 2, 'Rail_Top'));

                // 3. Panels & Muntins
                this.generatePanels(group, width, effHeight, thickness);

                return group;
            }

            createOverallArchFrame(totalWidth, radius, centerY, thickness) {
                // The arch frame spans the full door width.
                // It's a circular arc segment.
                // Center is at (0, centerY) in door coordinates.
                // Radius is `radius`.

                const group = new THREE.Group();
                const { stileWidth, railWidth } = this.config;

                const w = totalWidth / 1000;
                const r = radius / 1000;
                const cy = centerY / 1000;
                const t_stile = stileWidth / 1000;
                const t_rail = railWidth / 1000;
                const depth = thickness / 1000;

                // Calculate angle at which the arch intersects the vertical edges of the door
                // Circle: (x)^2 + (y - cy)^2 = r^2
                // At x = +/- w/2, solve for y
                const halfW = w / 2;
                if (halfW > r) {
                    console.warn("Arch radius too small for door width.");
                    return group; // Can't form arch
                }

                // y - cy = sqrt(r^2 - halfW^2)
                // y = cy + sqrt(r^2 - halfW^2)  (top of circle)
                const yAtEdge = cy + Math.sqrt(r * r - halfW * halfW);

                // Outer arch curve
                const outerShape = new THREE.Shape();

                // Angle from center to left edge: atan2(yAtEdge - cy, -halfW) relative to center
                // Actually, let's use absarc.
                // Arc from left to right edge of outer circle.
                // Start angle: acos(halfW / r) -> angle from +X axis
                // We need angle from center (0, cy) to point (-halfW, yAtEdge).
                // Using atan2: angle = atan2(yAtEdge - cy, -halfW)
                // For absarc, center is (0, cy), radius is r.
                // Start at left edge, sweep to right edge.

                const startAngleOuter = Math.acos(halfW / r); // Angle from +X to right edge (mirrored)
                const endAngleOuter = Math.PI - startAngleOuter; // Angle to left edge

                // Outer arc (from left to right, going over the top)
                outerShape.absarc(0, cy, r, endAngleOuter, startAngleOuter, true); // Clockwise from left to right

                // Inner arc (smaller radius, from right back to left)
                const innerR = r - t_rail;
                if (innerR > 0 && halfW - t_stile < innerR) {
                    const innerHalfW = halfW - t_stile;
                    // Check if inner arc is valid
                    if (innerHalfW > 0 && innerHalfW < innerR) {
                        const startAngleInner = Math.acos(innerHalfW / innerR);
                        const endAngleInner = Math.PI - startAngleInner;

                        // Line down from outer right to inner right
                        const yAtEdgeInner = cy + Math.sqrt(innerR * innerR - innerHalfW * innerHalfW);
                        outerShape.lineTo(innerHalfW, yAtEdgeInner);

                        // Inner arc (counter-clockwise from right to left)
                        outerShape.absarc(0, cy, innerR, startAngleInner, endAngleInner, false);
                    }
                }

                outerShape.closePath();

                const extrudeSettings = { steps: 1, depth: depth, bevelEnabled: false };
                const archGeo = new THREE.ExtrudeGeometry(outerShape, extrudeSettings);
                archGeo.translate(0, 0, -depth / 2);

                const archMesh = new THREE.Mesh(archGeo, this.materials.oak);
                archMesh.name = 'Arch_Frame';
                archMesh.castShadow = true;
                archMesh.receiveShadow = true;
                group.add(archMesh);

                return group;
            }

            createCurvedTopPanel(totalWidth, radius, centerY, rectHeight, thickness) {
                // The curved panel fills the space between the top rail of the door
                // (at rectHeight) and the inner curve of the arch.

                const { stileWidth, railWidth } = this.config;

                const w = totalWidth / 1000;
                const r = radius / 1000;
                const cy = centerY / 1000;
                const rh = rectHeight / 1000;
                const t_stile = stileWidth / 1000;
                const t_rail = railWidth / 1000;
                const depth = (thickness * 0.6) / 1000; // Panel is thinner

                const halfW = w / 2;
                const innerR = r - t_rail;
                const panelHalfW = halfW - t_stile;

                if (innerR <= 0 || panelHalfW <= 0 || panelHalfW >= innerR) return null;

                // Bottom of panel is top of top rail = rh - t_rail (the TOP of the top rail is at rh - t_rail/2 + t_rail/2 = rh)
                // Wait, let's be precise:
                // Top Rail center Y = rh - t_rail / 2. So top edge of top rail = rh.
                // Panel bottom edge should be at rh.
                const panelBottomY = rh;

                // Check if arch curve is above panelBottomY within the panel width
                // Y at inner arch edge (at x = panelHalfW): cy + sqrt(innerR^2 - panelHalfW^2)
                const yAtPanelEdge = cy + Math.sqrt(innerR * innerR - panelHalfW * panelHalfW);

                if (yAtPanelEdge <= panelBottomY) return null; // Arch doesn't extend above rect

                // Shape: Bottom straight line, then arc, close
                const panelShape = new THREE.Shape();

                // Start at bottom-left
                panelShape.moveTo(-panelHalfW, panelBottomY);

                // Line to bottom-right
                panelShape.lineTo(panelHalfW, panelBottomY);

                // Arc up and over (from right to left, counter-clockwise relative to center)
                const startAngle = Math.acos(panelHalfW / innerR);
                const endAngle = Math.PI - startAngle;
                panelShape.absarc(0, cy, innerR, startAngle, endAngle, false);

                panelShape.closePath();

                const extrudeSettings = { steps: 1, depth: depth, bevelEnabled: false };
                const panelGeo = new THREE.ExtrudeGeometry(panelShape, extrudeSettings);
                panelGeo.translate(0, 0, -depth / 2);

                const panelMesh = new THREE.Mesh(panelGeo, this.materials.oakDark);
                panelMesh.name = 'Panel_CurvedTop';
                panelMesh.castShadow = true;
                panelMesh.receiveShadow = true;

                return panelMesh;
            }

            generatePanels(group, leafWidth, leafHeight, thickness) {
                const { stileWidth, railWidth, muntinWidth, panelRows, panelCols } = this.config;

                const validW = leafWidth - 2 * stileWidth;
                const validH = leafHeight - 2 * railWidth;

                if (validW <= 0 || validH <= 0) return;

                const panelSlotW = (validW - (panelCols - 1) * muntinWidth) / panelCols;
                const panelSlotH = (validH - (panelRows - 1) * muntinWidth) / panelRows;

                if (panelSlotW <= 0 || panelSlotH <= 0) return;

                const startX = -leafWidth / 2 + stileWidth;
                const startY = railWidth;

                const createMuntin = (w, h, x, y, name) => {
                    const geo = new THREE.BoxGeometry(w / 1000, h / 1000, thickness / 1000);
                    const mesh = new THREE.Mesh(geo, this.materials.oak);
                    mesh.position.set(x / 1000, y / 1000, 0);
                    mesh.name = name;
                    mesh.castShadow = true;
                    group.add(mesh);
                };

                const createPanel = (w, h, x, y) => {
                    const pThick = thickness * 0.6;
                    const geo = new THREE.BoxGeometry(w / 1000, h / 1000, pThick / 1000);
                    const mesh = new THREE.Mesh(geo, this.materials.oakDark);
                    mesh.position.set(x / 1000, y / 1000, 0);
                    mesh.name = 'Panel';
                    mesh.castShadow = true;
                    group.add(mesh);
                };

                for (let r = 0; r < panelRows; r++) {
                    for (let c = 0; c < panelCols; c++) {
                        const x = startX + c * (panelSlotW + muntinWidth) + panelSlotW / 2;
                        const y = startY + r * (panelSlotH + muntinWidth) + panelSlotH / 2;

                        createPanel(panelSlotW, panelSlotH, x, y);

                        if (c < panelCols - 1) {
                            const mx = startX + (c + 1) * panelSlotW + c * muntinWidth + muntinWidth / 2;
                            const my = y;
                            createMuntin(muntinWidth, panelSlotH, mx, my, 'Muntin_Vert');
                        }
                    }

                    if (r < panelRows - 1) {
                        const ry = startY + (r + 1) * panelSlotH + r * muntinWidth + muntinWidth / 2;
                        const rx = 0;
                        createMuntin(validW, muntinWidth, rx, ry, 'Muntin_Horz');
                    }
                }
            }

            updateUI() {
                document.getElementById('disp-width').textContent = `${this.config.width} mm`;
                document.getElementById('disp-height').textContent = `${this.config.height} mm`;
                document.getElementById('disp-radius').textContent = this.config.hasArch ? `${this.config.archRadius} mm` : 'N/A';
                document.getElementById('disp-center').textContent = this.config.hasArch ? `${this.config.archCenterY} mm` : 'N/A';
                document.getElementById('disp-style').textContent = this.config.isDoubleLeaf ? 'Double Leaf' : 'Single Leaf';

                const vol = (this.config.width / 1000) * (this.config.height / 1000) * (this.config.thickness / 1000);
                const weight = Math.round(vol * 750 * 0.8);
                document.getElementById('disp-weight').textContent = weight;
            }
        }

        // ------------------------------------------------------------------
        // APP INIT
        // ------------------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0F1115);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1.2, 0);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Grid
        const gridHelper = new THREE.GridHelper(10, 10, 0x2A2E35, 0x16191D);
        scene.add(gridHelper);

        // Initialize Door
        const door = new Door(scene);

        // GUI Setup
        const gui = new GUI({ title: 'Workshop Controls' });

        const dimFolder = gui.addFolder('Dimensions');
        dimFolder.add(door.config, 'width', 800, 4000).name('Width (mm)').onChange(() => door.generate());
        dimFolder.add(door.config, 'height', 1800, 3500).name('Height (mm)').onChange(() => door.generate());
        dimFolder.add(door.config, 'thickness', 35, 80).name('Thickness (mm)').onChange(() => door.generate());

        const archFolder = gui.addFolder('Arch');
        archFolder.add(door.config, 'hasArch').name('Enable Arch').onChange(() => door.generate());
        archFolder.add(door.config, 'archRadius', 500, 3000).name('Radius (mm)').onChange(() => door.generate());
        archFolder.add(door.config, 'archCenterY', 500, 3000).name('Center Y (mm)').onChange(() => door.generate());

        const styleFolder = gui.addFolder('Style');
        styleFolder.add(door.config, 'isDoubleLeaf').name('Double Leaf').onChange(() => door.generate());

        const panelFolder = gui.addFolder('Panels');
        panelFolder.add(door.config, 'panelRows', 1, 6, 1).name('Rows').onChange(() => door.generate());
        panelFolder.add(door.config, 'panelCols', 1, 4, 1).name('Cols').onChange(() => door.generate());
        panelFolder.add(door.config, 'muntinWidth', 40, 200, 5).name('Muntin Width').onChange(() => door.generate());
        panelFolder.add(door.config, 'stileWidth', 80, 400, 5).name('Stile Width').onChange(() => door.generate());
        panelFolder.add(door.config, 'railWidth', 80, 400, 5).name('Rail Width').onChange(() => door.generate());

        document.getElementById('loading').style.display = 'none';

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
