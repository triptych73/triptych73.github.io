<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Firebase Auth Guard (Standard) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.min.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            firebase.auth().onAuthStateChanged((user) => {
                if (!user) window.location.href = 'login.html';
            });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panelled Door Designer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --midnight: #0F1115;
            --void: #050505;
            --panel: #16191D;
            --border: #2A2E35;
            --stone: #F5F5F0;
            --bronze: #9A8C74;
            --bronze-dark: #5C5242;
            --emerald: #10B981;
            --alert: #EF4444;
            --glass: rgba(255, 255, 255, 0.05);
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--midnight);
            font-family: 'Inter', sans-serif;
            color: var(--stone);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-width: 320px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
        }

        #overlay-header {
            padding: 12px 16px;
            background: var(--void);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        #overlay-header:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        #overlay-content {
            padding: 12px 16px;
            overflow-y: auto;
        }

        .minimized #overlay-content {
            display: none;
        }

        h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--stone);
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h2 {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            color: var(--bronze);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 12px 0 6px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .toggle-btn {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--gray-500);
            font-size: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .stat-label {
            color: var(--gray-400);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            color: var(--stone);
            font-size: 11px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: var(--bronze);
            font-family: 'Cinzel', serif;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .lil-gui {
            --background-color: var(--panel) !important;
            --text-color: var(--stone) !important;
            --title-background-color: var(--void) !important;
            --title-text-color: var(--stone) !important;
            --widget-color: var(--border) !important;
            --hover-color: rgba(255, 255, 255, 0.05) !important;
            --focus-color: var(--bronze) !important;
            --number-color: var(--bronze) !important;
            --string-color: var(--bronze) !important;
            font-family: 'Inter', sans-serif !important;
        }

        .lil-gui .title {
            font-family: 'Inter', sans-serif !important;
            font-size: 11px !important;
            letter-spacing: 0.05em !important;
            text-transform: uppercase !important;
        }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>
</head>

<body>
    <div id="loading">Loading Workshop...</div>
    <div id="canvas-container"></div>

    <div id="overlay">
        <div id="overlay-header" onclick="document.getElementById('overlay').classList.toggle('minimized')">
            <h1>Door Designer</h1>
            <span class="toggle-btn">[-]</span>
        </div>
        <div id="overlay-content">
            <h2>Dimensions</h2>
            <div class="stat-row"><span class="stat-label">Total Width:</span><span class="stat-value"
                    id="disp-width">--</span></div>
            <div class="stat-row"><span class="stat-label">Total Height:</span><span class="stat-value"
                    id="disp-height">--</span></div>
            <div class="stat-row"><span class="stat-label">Arch Radius:</span><span class="stat-value"
                    id="disp-radius">--</span></div>
            <div class="stat-row"><span class="stat-label">Arch Center Y:</span><span class="stat-value"
                    id="disp-center">--</span></div>
            <h2>Configuration</h2>
            <div class="stat-row"><span class="stat-label">Leaf Style:</span><span class="stat-value"
                    id="disp-style">--</span></div>
            <div class="stat-row"><span class="stat-label">Est. Weight:</span><span class="stat-value"
                    id="disp-weight">-- kg</span></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        class Door {
            constructor(scene, config = {}) {
                this.scene = scene;
                this.meshGroup = new THREE.Group();
                this.scene.add(this.meshGroup);

                this.config = Object.assign({
                    width: 1800,
                    thickness: 55,
                    isDoubleLeaf: true,

                    // Arch: circle center at (0, archCenterY), radius = archRadius
                    hasArch: true,
                    archRadius: 1200,
                    archCenterY: 1600,

                    // Frame
                    stileWidth: 120,
                    railWidth: 120,
                    muntinWidth: 60,

                    // Panels: Independent row heights (mm) from bottom to top
                    // The number of entries determines the number of rows.
                    panelRowHeights: [500, 450, 400],
                    panelCols: 2,

                    woodType: 'Oak'
                }, config);

                this.materials = this.initMaterials();
                this.generate();
            }

            initMaterials() {
                return {
                    oak: new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.7, metalness: 0.1 }),
                    oakDark: new THREE.MeshStandardMaterial({ color: 0x6B4420, roughness: 0.75, metalness: 0.1 }),
                };
            }

            generate() {
                while (this.meshGroup.children.length > 0) {
                    const child = this.meshGroup.children[0];
                    if (child.geometry) child.geometry.dispose();
                    this.meshGroup.remove(child);
                }

                const { width, thickness, isDoubleLeaf, hasArch, archRadius, archCenterY } = this.config;

                const gap = isDoubleLeaf ? 3 : 0;
                const leafWidth = isDoubleLeaf ? (width - gap) / 2 : width;

                const leftPos = isDoubleLeaf ? -width / 4 - gap / 4 : 0;
                const rightPos = isDoubleLeaf ? width / 4 + gap / 4 : 0;

                // Calculate max height based on arch
                // Apex of arch at x=0: y = archCenterY + archRadius
                const apexHeight = hasArch ? archCenterY + archRadius : (archCenterY + archRadius);

                const leftLeaf = this.createLeaf(leafWidth, thickness, true, leftPos);
                this.meshGroup.add(leftLeaf);

                if (isDoubleLeaf) {
                    const rightLeaf = this.createLeaf(leafWidth, thickness, false, rightPos);
                    this.meshGroup.add(rightLeaf);
                }

                this.updateUI();
            }

            // Calculate Y on the arch at a given X (relative to door center)
            getArchY(xGlobal) {
                const { archRadius, archCenterY } = this.config;
                const r = archRadius / 1000;
                const cy = archCenterY / 1000;
                const x = xGlobal; // Already in meters

                if (Math.abs(x) > r) return cy; // Outside arch

                return cy + Math.sqrt(r * r - x * x);
            }

            createLeaf(leafWidth, thickness, isLeft, leafCenterX) {
                const group = new THREE.Group();
                group.position.set(leafCenterX / 1000, 0, 0);

                const { stileWidth, railWidth, muntinWidth, panelRowHeights, panelCols, hasArch } = this.config;

                const w = leafWidth / 1000;
                const t = thickness / 1000;
                const sw = stileWidth / 1000;
                const rw = railWidth / 1000;
                const mw = muntinWidth / 1000;

                // Inner edges of stiles (where panels go)
                const innerLeftX = -w / 2 + sw;
                const innerRightX = w / 2 - sw;
                const innerWidth = innerRightX - innerLeftX;

                // Global X coordinates (for arch intersection)
                const globalLeftStileX = leafCenterX / 1000 - w / 2 + sw / 2;
                const globalRightStileX = leafCenterX / 1000 + w / 2 - sw / 2;
                const globalLeftEdge = leafCenterX / 1000 - w / 2;
                const globalRightEdge = leafCenterX / 1000 + w / 2;

                // Calculate stile heights based on arch
                const leftStileTopY = hasArch ? this.getArchY(globalLeftEdge) : 2.5;
                const rightStileTopY = hasArch ? this.getArchY(globalRightEdge) : 2.5;

                // Helper
                const createBox = (bw, bh, bd, x, y, mat, name) => {
                    const geo = new THREE.BoxGeometry(bw, bh, bd);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, y, 0);
                    mesh.name = name;
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    return mesh;
                };

                // --- STILES ---
                // Left stile
                group.add(createBox(sw, leftStileTopY, t, -w / 2 + sw / 2, leftStileTopY / 2, this.materials.oak, 'Stile_Left'));
                // Right stile
                group.add(createBox(sw, rightStileTopY, t, w / 2 - sw / 2, rightStileTopY / 2, this.materials.oak, 'Stile_Right'));

                // --- BOTTOM RAIL ---
                group.add(createBox(innerWidth, rw, t, 0, rw / 2, this.materials.oak, 'Rail_Bottom'));

                // --- PANELS & HORIZONTAL MUNTINS ---
                // Each row has a specified height. We stack them from the bottom.
                let currentY = rw; // Start above bottom rail
                const numRows = panelRowHeights.length;

                for (let r = 0; r < numRows; r++) {
                    const rowH = panelRowHeights[r] / 1000;
                    const rowCenterY = currentY + rowH / 2;

                    // Panel columns
                    const colW = (innerWidth - (panelCols - 1) * mw) / panelCols;
                    for (let c = 0; c < panelCols; c++) {
                        const panelX = innerLeftX + c * (colW + mw) + colW / 2;
                        // Check if this panel is within the arch
                        const panelTopY = currentY + rowH;
                        const panelGlobalX = leafCenterX / 1000 + panelX;
                        const archYAtPanel = hasArch ? this.getArchY(panelGlobalX) : 999;

                        if (panelTopY <= archYAtPanel + 0.01) {
                            // Panel fits entirely
                            group.add(createBox(colW, rowH, t * 0.6, panelX, rowCenterY, this.materials.oakDark, 'Panel'));
                        }

                        // Vertical muntin (if not last column)
                        if (c < panelCols - 1) {
                            const mx = innerLeftX + (c + 1) * colW + c * mw + mw / 2;
                            group.add(createBox(mw, rowH, t, mx, rowCenterY, this.materials.oak, 'Muntin_V'));
                        }
                    }

                    // Horizontal muntin (if not last row)
                    if (r < numRows - 1) {
                        const hmy = currentY + rowH + mw / 2;
                        group.add(createBox(innerWidth, mw, t, 0, hmy, this.materials.oak, 'Muntin_H'));
                    }

                    currentY += rowH + (r < numRows - 1 ? mw : 0);
                }

                // --- TOP RAIL (straight, below arch) ---
                const topRailY = currentY + rw / 2;
                group.add(createBox(innerWidth, rw, t, 0, topRailY, this.materials.oak, 'Rail_Top'));

                // --- ARCHED TOP SECTION ---
                if (hasArch) {
                    const archStartY = currentY + rw; // Top of top rail
                    const curvedPanel = this.createLeafArchPanel(leafWidth, thickness, leafCenterX, archStartY);
                    if (curvedPanel) group.add(curvedPanel);
                }

                return group;
            }

            createLeafArchPanel(leafWidth, thickness, leafCenterX, archStartY) {
                // Creates rectangular section + curved top that conforms to the overall arch
                const { archRadius, archCenterY, stileWidth } = this.config;

                const w = leafWidth / 1000;
                const t = (thickness * 0.6) / 1000;
                const sw = stileWidth / 1000;
                const r = archRadius / 1000;
                const cy = archCenterY / 1000;
                const startY = archStartY;

                const innerLeftX = -w / 2 + sw;
                const innerRightX = w / 2 - sw;
                const innerWidth = innerRightX - innerLeftX;

                // Global X for this leaf's inner edges
                const globalInnerLeft = leafCenterX / 1000 + innerLeftX;
                const globalInnerRight = leafCenterX / 1000 + innerRightX;

                // Check if inner edges are within arch radius
                if (Math.abs(globalInnerLeft) > r || Math.abs(globalInnerRight) > r) return null;

                // Y on the arch at inner left and right edges
                const yAtLeft = cy + Math.sqrt(r * r - globalInnerLeft * globalInnerLeft);
                const yAtRight = cy + Math.sqrt(r * r - globalInnerRight * globalInnerRight);

                if (startY >= Math.min(yAtLeft, yAtRight)) return null; // No space for curve

                // Create shape: start at bottom-left, go right, curve up following arch, come back
                const shape = new THREE.Shape();

                // Bottom edge (straight line)
                shape.moveTo(innerLeftX, startY);
                shape.lineTo(innerRightX, startY);

                // Arc segment (from right to left, following inner edge of arch)
                // Use absarc centered at (0 - leafCenterX/1000, cy) but shape is in LOCAL coords
                // So center in local coords is (-leafCenterX/1000, cy)
                const localCenterX = -leafCenterX / 1000;

                // Angles for the arc
                const angleRight = Math.atan2(yAtRight - cy, globalInnerRight);
                const angleLeft = Math.atan2(yAtLeft - cy, globalInnerLeft);

                // We need to draw from right angle to left angle, counter-clockwise
                // THREE.Shape absarc uses the shape's coordinate system
                // Arc from angleRight to angleLeft
                shape.absarc(localCenterX, cy, r - sw, angleRight, angleLeft, false);

                shape.closePath();

                const extrudeSettings = { steps: 1, depth: t, bevelEnabled: false };
                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                geo.translate(0, 0, -t / 2);

                const mesh = new THREE.Mesh(geo, this.materials.oakDark);
                mesh.name = 'Panel_Arch';
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                return mesh;
            }

            updateUI() {
                const { width, archRadius, archCenterY, isDoubleLeaf, thickness, hasArch } = this.config;
                const apexHeight = hasArch ? archCenterY + archRadius : 'N/A';

                document.getElementById('disp-width').textContent = `${width} mm`;
                document.getElementById('disp-height').textContent = hasArch ? `${apexHeight} mm (apex)` : 'N/A';
                document.getElementById('disp-radius').textContent = hasArch ? `${archRadius} mm` : 'N/A';
                document.getElementById('disp-center').textContent = hasArch ? `${archCenterY} mm` : 'N/A';
                document.getElementById('disp-style').textContent = isDoubleLeaf ? 'Double Leaf' : 'Single Leaf';

                const vol = (width / 1000) * ((archCenterY + archRadius) / 1000) * (thickness / 1000);
                const weight = Math.round(vol * 750 * 0.7);
                document.getElementById('disp-weight').textContent = weight + ' kg';
            }
        }

        // --- APP INIT ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0F1115);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1.2, 0);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(10, 10, 0x2A2E35, 0x16191D);
        scene.add(gridHelper);

        const door = new Door(scene);

        // --- GUI ---
        const gui = new GUI({ title: 'Workshop Controls' });

        const dimFolder = gui.addFolder('Dimensions');
        dimFolder.add(door.config, 'width', 800, 4000).name('Width (mm)').onChange(() => door.generate());
        dimFolder.add(door.config, 'thickness', 35, 80).name('Thickness (mm)').onChange(() => door.generate());

        const archFolder = gui.addFolder('Arch');
        archFolder.add(door.config, 'hasArch').name('Enable Arch').onChange(() => door.generate());
        archFolder.add(door.config, 'archRadius', 500, 3000).name('Radius (mm)').onChange(() => door.generate());
        archFolder.add(door.config, 'archCenterY', 500, 2500).name('Center Y (mm)').onChange(() => door.generate());

        const styleFolder = gui.addFolder('Style');
        styleFolder.add(door.config, 'isDoubleLeaf').name('Double Leaf').onChange(() => door.generate());

        const frameFolder = gui.addFolder('Frame');
        frameFolder.add(door.config, 'stileWidth', 60, 300, 5).name('Stile W').onChange(() => door.generate());
        frameFolder.add(door.config, 'railWidth', 60, 300, 5).name('Rail W').onChange(() => door.generate());
        frameFolder.add(door.config, 'muntinWidth', 30, 150, 5).name('Muntin W').onChange(() => door.generate());

        const panelFolder = gui.addFolder('Panel Heights (mm)');
        // Create controllers for each row height
        const rowHeightControllers = [];
        function rebuildPanelGUI() {
            rowHeightControllers.forEach(c => c.destroy());
            rowHeightControllers.length = 0;

            door.config.panelRowHeights.forEach((h, i) => {
                const ctrl = panelFolder.add(door.config.panelRowHeights, i, 100, 800, 10)
                    .name(`Row ${i + 1}`)
                    .onChange(() => door.generate());
                rowHeightControllers.push(ctrl);
            });
        }
        rebuildPanelGUI();

        // Add/Remove row buttons
        const panelOps = {
            addRow: () => { door.config.panelRowHeights.push(400); rebuildPanelGUI(); door.generate(); },
            removeRow: () => { if (door.config.panelRowHeights.length > 1) { door.config.panelRowHeights.pop(); rebuildPanelGUI(); door.generate(); } }
        };
        panelFolder.add(panelOps, 'addRow').name('+ Add Row');
        panelFolder.add(panelOps, 'removeRow').name('- Remove Row');
        panelFolder.add(door.config, 'panelCols', 1, 4, 1).name('Columns').onChange(() => door.generate());

        document.getElementById('loading').style.display = 'none';

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
