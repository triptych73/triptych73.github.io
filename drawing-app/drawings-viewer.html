<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St Mary Somerset | Drawings</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDKs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.min.js"></script>
    <script src="firebase-config.js"></script>

    <!-- Auth Guard -->
    <script>
        if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined') {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

            firebase.auth().onAuthStateChanged((user) => {
                if (!user) {
                    window.location.href = 'login.html';
                }
            });
        }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'portland': '#F5F5F0', // Weathered Stone
                        'midnight': '#0F1115', // Thames Midnight
                        'bronze': '#9A8C74',   // Patinated Bronze
                        'bronze-light': '#B5A894',
                        'bronze-dark': '#7d705a',
                    },
                    fontFamily: {
                        'serif': ['Cinzel', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'shimmer': 'shimmer 2s infinite',
                        'fade-in': 'fadeIn 0.5s ease-out',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* BASE STYLES */
        body {
            background-color: #F5F5F0;
            color: #0F1115;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #D1CEC7;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9A8C74;
        }

        /* SHIMMER EFFECT FOR FLOORS */
        .floor-region {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* The sheen that moves across */
        .floor-region::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.4) 50%,
                    rgba(255, 255, 255, 0) 100%);
            transform: skewX(-20deg) translateX(-250%);
            transition: transform 0s;
            pointer-events: none;
        }

        .floor-region:hover {
            background-color: rgba(154, 140, 116, 0.15);
            /* Bronze Tint */
            backdrop-filter: brightness(1.1);
            box-shadow: inset 0 0 0 1px rgba(154, 140, 116, 0.4);
        }

        .floor-region:hover::after {
            animation: shimmer-slide 1.5s infinite;
        }

        .floor-region.active {
            background-color: rgba(15, 17, 21, 0.85);
            /* Midnight */
            color: #F5F5F0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(2px);
            z-index: 10;
        }

        @keyframes shimmer-slide {
            0% {
                transform: skewX(-20deg) translateX(-250%);
            }

            100% {
                transform: skewX(-20deg) translateX(250%);
            }
        }

        /* UTILITIES */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

    <!-- Logic Script (Preserved & Adapted) -->
    <script>
        // Constants - DATA MODELS
        const floors = Array.from({ length: 12 }, (_, i) => (i + 1).toString().padStart(2, '0'));
        const rooms = ['1', '2', '3'];
        const types = [
            { code: 'G', name: 'GA', hasOrientations: false },
            { code: 'E', name: 'Elevation', hasOrientations: true },
            { code: 'S', name: 'Section', hasOrientations: true },
            { code: 'I', name: 'ICP', hasOrientations: false }
        ];
        const orientations = [
            { code: 'N', name: 'North' },
            { code: 'E', name: 'East' },
            { code: 'S', name: 'South' },
            { code: 'W', name: 'West' },
            { code: 'Default', name: 'Default' }
        ];
        const stages = [
            { code: 'O', name: 'Original' },
            { code: 'D', name: 'Demolition' },
            { code: 'P', name: 'Proposed' },
            { code: 'A', name: 'As Built' }
        ];

        // State
        let csvData = [];
        let urlData = [];
        let activeFloor = '01';
        let activeRoom = '1';
        let activeType = 'G';
        let activeOrientation = 'Default';
        let activeStage = 'O'; // Default active stage
        let roomConfig = {}; // e.g. { '01': 3, '02': 1 }


        // Viewport State
        let currentScale = 1;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;
        let translateX = 0;
        let translateY = 0;

        // DOM Elements
        // DOM Elements - HUD & Viewport
        const drawingContainer = document.getElementById('drawingContainer');
        const drawingTitle = document.getElementById('drawingTitle');
        const drawingImage = document.getElementById('drawingImage');
        const urlForm = document.getElementById('urlForm');

        // HUD Widgets
        const floorOverlay = document.getElementById('floorOverlay');
        const roomList = document.getElementById('roomList');
        const compassWidget = document.getElementById('compassWidget');
        const compassLabel = document.getElementById('compassLabel');
        const stageToggleContainer = document.getElementById('stageToggleContainer');
        const drawingKey = document.getElementById('drawingKey');
        const drawingDescription = document.getElementById('drawingDescription');
        const urlInput = document.getElementById('urlInput');
        const saveUrlBtn = document.getElementById('saveUrlBtn');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const panBtn = document.getElementById('panBtn');
        const changeUrlBtn = document.getElementById('changeUrlBtn');
        const manageDrawingsBtn = document.getElementById('manageDrawingsBtn');
        const importCsvBtn = document.getElementById('importCsvBtn');
        const csvFileInput = document.getElementById('csvFileInput');
        const saveBtn = document.getElementById('saveBtn');
        const loadingEl = document.getElementById('loading');
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notificationMessage');
        const openConfigBtn = document.getElementById('openConfigBtn');
        const configModal = document.getElementById('configModal');
        const closeConfigBtn = document.getElementById('closeConfigBtn');
        const saveConfigBtn = document.getElementById('saveConfigBtn');
        const configList = document.getElementById('configList');


        // Initialize
        function init() {
            generateEmptyCsvData(); // Fallback
            setupEventListeners();
            renderFloorRegions();

            // Try to load CSV from localStorage first
            const savedCsv = localStorage.getItem('buildingDrawingsData');
            if (savedCsv) {
                try {
                    const savedData = JSON.parse(savedCsv);
                    // Minimal merge logic or overwrite
                    // For simplicity, we trust the saved data if it exists
                    if (savedData.csvData && savedData.csvData.length > 0) csvData = savedData.csvData;
                    if (savedData.urlData && savedData.urlData.length > 0) urlData = savedData.urlData;
                    if (savedData.roomConfig) roomConfig = savedData.roomConfig;


                    showNotification('Project Cache Loaded');
                } catch (e) {
                    console.error('Error loading data from localStorage:', e);
                }
            } else {
                // Try fetching the actual CSV file
                fetch('building_drawings.csv')
                    .then(response => {
                        if (response.ok) return response.text();
                        throw new Error('No default CSV found');
                    })
                    .then(csvText => {
                        Papa.parse(csvText, {
                            header: true,
                            complete: function (results) {
                                processImportedData(results.data);
                                showNotification('Default Drawings Loaded');
                            }
                        });
                    })
                    .catch(err => console.log('Starting with empty state.'));
            }

            // After data load (or empty), update UI
            updateUI();
        }

        // Generate empty CSV data with all permutations
        function generateEmptyCsvData() {
            csvData = [];
            urlData = [];

                rooms.forEach(room => {
                    types.forEach(type => {
                        if (type.hasOrientations) {
                            orientations.slice(0, 4).forEach(orientation => {
                                stages.forEach(stage => {
                                    const key = `${floor}-${room}-${type.code}-${orientation.code}-${stage.code}`;
                                    csvData.push([key, 0]); // 0 = no drawing
                                    urlData.push([key, '']);
                                });
                            });
                        } else {
                            stages.forEach(stage => {
                                const key = `${floor}-${room}-${type.code}-Default-${stage.code}`;

                                urlData.push([key, '']);

            // Determine active room count
            let numRooms = 3;
            const config = roomConfig[activeFloor];
            if (typeof config === 'number') numRooms = config;
            else if (config && typeof config === 'object') numRooms = config.count || 3;

            let current = parseInt(activeRoom);
            let next = current + idx;

            if (next > numRooms) next = 1;
            if (next < 1) next = numRooms;

            activeRoom = next.toString();
            updateUI();

                numRooms = config.count || 3;

        function setActiveRoomType(room, type) {
            activeRoom = room;

            // Check orientation validity
            const typeObj = types.find(t => t.code === type);
            if (typeObj.hasOrientations) {

            } else {

        // Render Orientation Tabs
        // --- COMPASS WIDGET (Orientation) ---
        function updateCompassWidget() {
            const type = types.find(t => t.code === activeType);

            // Check elements exist
            if (!compassWidget || !compassLabel) return;

            if (!type.hasOrientations) {
                compassWidget.classList.add('opacity-50', 'pointer-events-none');
                compassLabel.textContent = '-';
            } else {
                compassWidget.classList.remove('opacity-50', 'pointer-events-none');

                // Map code to visual rotation or label
                const map = { 'N': 0, 'E': 90, 'S': 180, 'W': 270, 'Default': 0 };
                const rotation = map[activeOrientation] || 0;
                // Rotate the widget
                compassWidget.style.transform = `rotate(${rotation}deg)`;
                // Counter-rotate label so it stays upright
                compassLabel.style.transform = `rotate(-${rotation}deg)`;

                if (activeOrientation === 'Default') compassLabel.textContent = 'N'; // Treat default as North visually
                else compassLabel.textContent = activeOrientation;
            }
        }

        // Global function for onclick
        function rotateOrientation() {
            const type = types.find(t => t.code === activeType);
            if (!type.hasOrientations) return;

            const sequence = ['N', 'E', 'S', 'W'];
            let currentIdx = sequence.indexOf(activeOrientation);
            if (currentIdx === -1) currentIdx = 0; // Start at N if Default

            const nextIdx = (currentIdx + 1) % sequence.length;
            setOrientation(sequence[nextIdx]);
        }
        window.rotateOrientation = rotateOrientation;

        function selectRoomCount(floor, count) {
            // VISUAL UPDATE - Buttons
            const row = configList.querySelector(`button[data-floor="${floor}"]`).parentElement;
            const btns = row.querySelectorAll('button');
            btns.forEach(b => {

            });

            // VISUAL UPDATE - Inputs
            const inputContainer = document.getElementById(`names-${floor}`);
            const inputs = inputContainer.querySelectorAll('.room-name-input');

                roomConfig[floor] = { count: count, names: {} };

        // --- HELPER FUNCTIONS ---


        function getCurrentKey(stageCode) {
            return `${activeFloor}-${activeRoom}-${activeType}-${activeOrientation}-${stageCode}`;
        }

        function getDrawingEntry(key) {
            // Look in urlData primarily
            const entry = urlData.find(row => Array.isArray(row) ? row[0] === key : row.key === key);

            // Normalize return
            if (Array.isArray(entry)) return { key: entry[0], url: entry[1] };
            return entry || null;
        }

        function checkDrawingExists(key) {
            const entry = getDrawingEntry(key);
            return entry && entry.url && entry.url !== '';
        }

        // Search helpers for enabling tabs
        function hasAnyDrawingForRoomType(fl, rm, tp) {
            // Check all orientations/stages for this combo
            // Simplified check: iterate urlData
            // Optimization: Filter logic
            // Since data structures might be array or object, handle both
            return urlData.some(row => {
                const k = Array.isArray(row) ? row[0] : row.key;
                const u = Array.isArray(row) ? row[1] : row.url;
                if (!u || u === '') return false;

                const parts = k.split('-'); // 0:fl, 1:rm, 2:tp, 3:or, 4:st
                return parts[0] == fl && parts[1] == rm && parts[2] == tp;
            });
        }

        function hasAnyDrawingForOrientation(fl, rm, tp, or) {
            return urlData.some(row => {
                const k = Array.isArray(row) ? row[0] : row.key;
                const u = Array.isArray(row) ? row[1] : row.url;
                if (!u || u === '') return false;

                const parts = k.split('-');
                return parts[0] == fl && parts[1] == rm && parts[2] == tp && parts[3] == or;
            });
        }

            const key = getCurrentKey(activeStage);

            // Update Data
            let found = false;
            // Handle Array Structure
            for (let i = 0; i < urlData.length; i++) {
                if (Array.isArray(urlData[i]) && urlData[i][0] === key) {
                    urlData[i][1] = url;
                    found = true;
                    break;

            // Fallback object structure

        function zoom(delta) {
            currentScale += delta;
            if (currentScale < 0.1) currentScale = 0.1;

            currentScale = 1;

        function togglePanMode() {
            isPanning = !isPanning; // actually creates a state for button

        // Panning Event Handlers

        function startPan(e) {
            if (!isPanning && !e.ctrlKey) return; // Allow Ctrl+Drag or Pan Tool
            e.preventDefault();
            isDragging = true;
            startPanX = e.clientX - translateX;
            startPanY = e.clientY - translateY;
            drawingImage.style.cursor = 'grabbing';
        }

        function pan(e) {
            if (!isDragging) return;
            e.preventDefault();
            translateX = e.clientX - startPanX;
            translateY = e.clientY - startPanY;
            updateTransform();
        }

        function endPan() {
            isDragging = false;
            if (isPanning) drawingImage.style.cursor = 'grab';

        // Init

        // --- MEASUREMENT HELPER TOOL ---
        const toggleMeasureBtn = document.getElementById('toggleMeasureBtn');
        const clearMeasureBtn = document.getElementById('clearMeasureBtn');
        const measureOverlay = document.getElementById('measureOverlay');
        let isMeasuring = false;
        let measurePoints = [];

        toggleMeasureBtn.addEventListener('click', () => {
            isMeasuring = !isMeasuring;
            if (isMeasuring) {
                toggleMeasureBtn.classList.add('bg-bronze', 'text-white');
                toggleMeasureBtn.classList.remove('text-gray-400');
                measureOverlay.classList.remove('hidden');
                clearMeasureBtn.classList.remove('hidden');
            } else {
                toggleMeasureBtn.classList.remove('bg-bronze', 'text-white');
                toggleMeasureBtn.classList.add('text-gray-400');
                measureOverlay.classList.add('hidden');
                clearMeasureBtn.classList.add('hidden');
            }
        });

        clearMeasureBtn.addEventListener('click', () => {
            measurePoints = [];
            measureOverlay.innerHTML = '';
        });

        measureOverlay.addEventListener('click', (e) => {
            if (!isMeasuring) return;

            const rect = measureOverlay.getBoundingClientRect();
            const y = e.clientY - rect.top;

            // Add visual line
            const line = document.createElement('div');
            line.className = 'absolute w-full h-px bg-red-500 z-50 pointer-events-none';
            line.style.top = `${y}px`;

            // Calculate distance if not first point
            let labelText = '0px';
            if (measurePoints.length > 0) {
                const prevY = measurePoints[measurePoints.length - 1];
                const diff = Math.abs(prevY - y).toFixed(1);
                labelText = `+${diff}px`;
            }

            // Label
            const label = document.createElement('div');
            label.className = 'absolute right-0 bg-red-500 text-white text-[10px] px-1 rounded pointer-events-none transform -translate-y-1/2';
            label.style.top = `${y}px`;
            label.textContent = labelText;

            measureOverlay.appendChild(line);
            measureOverlay.appendChild(label);

            measurePoints.push(y);
        });

    </script>
</body>
