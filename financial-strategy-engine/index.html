<body class="bg-gray-50 text-gray-900 min-h-screen">

    <!-- Auth Guard Overlay -->
    <div id="loading-overlay"
        style="position:fixed; inset:0; background:#0F1115; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
        <div
            style="width: 4rem; height: 4rem; border: 1px solid rgba(154, 140, 116, 0.3); border-top-color: #9A8C74; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem;">
        </div>
        <div
            style="font-family: 'Cinzel', serif; color: #9A8C74; letter-spacing: 0.2em; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">
            VERIFYING PERMISSIONS</div>
        <style>
            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }

                to {
                    transform: rotate(360deg);
                }
            }

            @keyframes pulse {

                0%,
                100% {
                    opacity: 1;
                }

                50% {
                    opacity: .5;
                }
            }
        </style>
    </div>

    <div id="root" style="display:none;"></div>

    <script type="text/babel">
        // Globals Check
        if (!window.React) console.error("React missing!");
        if (!window.ReactDOM) console.error("ReactDOM missing!");
        if (!window.Recharts) console.error("Recharts missing!");

        // Access Global DB
        const db = window.db;

        // Fallback for Recharts if it fails to expose globally immediately
        const Recharts = window.Recharts || window.recharts;

        if (!window.React || !window.ReactDOM || !Recharts) {
            throw new Error(`Libraries failed (React: ${!!window.React}, ReactDOM: ${!!window.ReactDOM}, Recharts: ${!!Recharts}). Check console.`);
        }

        // --- Configuration & Default Data ---
        const COST_DATA = {
            unindexed: 2462470.74,
            indexed: 2901788.39
        };



        const APP_DATA = null;

        // Static Yearly Summary (Consolidated from Excel 'Costs' sheet)
        const COST_SUMMARY = [
            { "year": 2004, "unindexed": 0, "indexed": 89947.58 },
            { "year": 2005, "unindexed": 0, "indexed": 236655.82 },
            { "year": 2006, "unindexed": 248919.0, "indexed": 246193.17 },
            { "year": 2007, "unindexed": 0.0, "indexed": 206511.65 },
            { "year": 2008, "unindexed": 100681.0, "indexed": 333387.80 },
            { "year": 2009, "unindexed": 559810.0, "indexed": 424242.98 },
            { "year": 2010, "unindexed": 95595.0, "indexed": 23514.07 },
            { "year": 2011, "unindexed": 4632.0, "indexed": 1913.92 },
            { "year": 2012, "unindexed": -25832.0, "indexed": 0.0 },
            { "year": 2013, "unindexed": -20355.0, "indexed": 0.0 },
            { "year": 2014, "unindexed": 56215.0, "indexed": 75405.30 },
            { "year": 2015, "unindexed": 29710.0, "indexed": 99220.71 },
            { "year": 2016, "unindexed": 117948.0, "indexed": 193419.85 },
            { "year": 2017, "unindexed": 184314.0, "indexed": 158359.21 },
            { "year": 2018, "unindexed": 127190.0, "indexed": 135661.79 },
            { "year": 2019, "unindexed": 69339.0, "indexed": 80405.89 },
            { "year": 2020, "unindexed": 55180.0, "indexed": 41303.94 },
            { "year": 2021, "unindexed": 30121.0, "indexed": 109098.38 },
            { "year": 2022, "unindexed": 117245.0, "indexed": 163720.55 },
            { "year": 2023, "unindexed": 0, "indexed": 22825.77 }
        ];

        // Shared Logic Helper
        const isAdvancedLoan = (t) => {
            const s = (t.source || "").toLowerCase();
            return s.includes('loan');
        };

        const DEFAULT_DATA = {
            salePrice: 3250000,
            useIndexedCosts: true,
            saleYear: 2026,
            currentYear: new Date().getFullYear(),
            areSharesOwnedByHeirs: false, // New Default
            enabledSources: [], // To be populated dynamically
            insurance: {
                enabled: true,
                premium: 2000,
                payout: 1000000,
                termStartYear: 2022
            }
        };

        const { useState, useEffect, useMemo, useCallback } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

        // --- Utility Functions ---
        const formatCurrency = (val) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP', minimumFractionDigits: 0 }).format(val);

        const getTaperRate = (years) => {
            if (years < 3) return 1.0;
            if (years < 4) return 0.8;
            if (years < 5) return 0.6;
            if (years < 6) return 0.4;
            if (years < 7) return 0.2;
            return 0.0;
        };

        // --- Components ---

        const Card = ({ title, children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-100 p-6 ${className}`}>
                <h3 className="text-lg font-semibold text-gray-800 mb-4">{title}</h3>
                {children}
            </div>
        );

        const NumberInput = ({ label, value, onChange, prefix = "£" }) => (
            <div className="flex flex-col space-y-1">
                <label className="text-sm font-medium text-gray-600">{label}</label>
                <div className="relative">
                    {prefix && <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">{prefix}</span>}
                    <input
                        type="number"
                        value={value}
                        onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
                        className={`w-full pl-${prefix ? '8' : '3'} pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all`}
                    />
                </div>
            </div>
        );

        const DeedsManager = ({ deeds, onChange }) => {
            const addDeed = () => {
                onChange([...deeds, { id: Date.now(), date: new Date().toISOString().split('T')[0], amount: 0 }]);
            };
            const updateDeed = (id, field, val) => {
                onChange(deeds.map(d => d.id === id ? { ...d, [field]: val } : d));
            };
            const removeDeed = (id) => {
                onChange(deeds.filter(d => d.id !== id));
            };

            return (
                <div className="space-y-3">
                    <div className="flex justify-between items-center">
                        <label className="text-sm font-medium text-gray-600">Deeds of Assignment</label>
                        <button onClick={addDeed} className="text-xs text-blue-600 hover:text-blue-800 font-medium">+ Add Deed</button>
                    </div>
                    {deeds.length === 0 && <div className="text-xs text-gray-400 italic">No deeds recorded. Loans will be unassigned.</div>}
                    <div className="space-y-2">
                        {deeds.map(d => (
                            <div key={d.id} className="flex gap-2 items-center bg-gray-50 p-2 rounded border border-gray-200">
                                <input
                                    type="date"
                                    value={d.date}
                                    onChange={(e) => updateDeed(d.id, 'date', e.target.value)}
                                    className="text-xs border rounded p-1"
                                />
                                <div className="relative flex-1">
                                    <span className="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 text-xs">£</span>
                                    <input
                                        type="number"
                                        value={d.amount}
                                        onChange={(e) => updateDeed(d.id, 'amount', parseFloat(e.target.value))}
                                        className="w-full pl-5 pr-2 py-1 text-xs border rounded"
                                        placeholder="Amount"
                                    />
                                </div>
                                <button onClick={() => removeDeed(d.id)} className="text-red-400 hover:text-red-600 px-1">×</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SliderInput = ({ label, value, onChange, min, max, unit = "" }) => (
            <div className="flex flex-col space-y-2">
                <div className="flex justify-between items-end">
                    <label className="text-sm font-medium text-gray-600">{label}</label>
                    <span className="text-base font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{value} {unit}</span>
                </div>
                <input
                    type="range"
                    min={min}
                    max={max}
                    value={value}
                    onChange={(e) => onChange(parseInt(e.target.value))}
                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                />
                <div className="flex justify-between text-xs text-gray-400 font-mono">
                    <span>{min}</span>
                    <span>{max}</span>
                </div>
            </div>
        );

        const Toggle = ({ enabled, onChange, label }) => (
            <div className="flex items-center justify-between cursor-pointer" onClick={() => onChange(!enabled)}>
                <span className="text-sm font-medium text-gray-700">{label}</span>
                <div className={`relative w-11 h-6 bg-gray-200 rounded-full peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 ${enabled ? 'bg-blue-600' : ''}`}>
                    <div className={`absolute top-[2px] left-[2px] bg-white border-gray-300 border rounded-full h-5 w-5 transition-all ${enabled ? 'translate-x-full border-white' : ''}`}></div>
                </div>
            </div>
        );

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="bg-white p-3 border border-gray-200 shadow-lg rounded-lg text-sm z-50">
                        <p className="font-bold text-gray-800 mb-2">{label}</p>
                        <div className="space-y-1">
                            <p className="text-emerald-600 font-medium whitespace-nowrap">
                                Net Wealth: {formatCurrency(payload[0].value)}
                            </p>
                            <p className="text-red-500 font-medium whitespace-nowrap">
                                IHT Tax: {formatCurrency(payload[1].value)}
                            </p>
                            <div className="pt-2 mt-1 border-t border-gray-100 text-xs text-gray-500 whitespace-nowrap">
                                Total Created: {formatCurrency(payload[0].value + payload[1].value)}
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const MathWalkthrough = ({ calc, inputs, getTaper }) => {
            const profit = inputs.salePrice - inputs.devCosts;
            const yearsSinceSale = inputs.deathYear - inputs.saleYear;
            const taperEstate = getTaper(yearsSinceSale);

            return (
                <Card title="Calculation Logic (Step-by-Step)" className="mt-8 border-l-4 border-blue-500 bg-slate-50">
                    <div className="space-y-6 text-sm font-mono text-gray-700">

                        {/* 1. Corp Tax */}
                        <div>
                            <h4 className="font-bold text-gray-900 border-b pb-1 mb-2">1. Corporate Level</h4>
                            <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                                <span>Gross Sale:</span> <span className="text-right">{formatCurrency(inputs.salePrice)}</span>
                                <span>- Dev Costs:</span> <span className="text-right text-red-600">({formatCurrency(inputs.devCosts)})</span>
                                <span className="font-semibold">= Profit:</span> <span className="text-right font-semibold">{formatCurrency(profit)}</span>
                                <span>x Corp Tax (25%):</span> <span className="text-right text-red-600">({formatCurrency(calc.corpTax)})</span>
                                <span className="font-bold border-t border-gray-300 pt-1">= Net Cash in Co:</span> <span className="text-right font-bold border-t border-gray-300 pt-1">{formatCurrency(calc.netCashFromCompany)}</span>
                            </div>
                        </div>

                        {/* 2. Liability Calculation */}
                        <div>
                            <h4 className="font-bold text-gray-900 border-b pb-1 mb-2">2. Liability Calculation</h4>
                            <p className="mb-2 italic text-xs text-gray-500">Breakdown of taxable components based on their individual assignment dates.</p>
                            <table className="w-full text-right">
                                <thead className="text-gray-500 text-xs border-b">
                                    <tr>
                                        <th className="text-left pb-1">Component</th>
                                        <th className="pb-1">Amount</th>
                                        <th className="pb-1">Taper Start</th>
                                        <th className="pb-1">Years</th>
                                        <th className="pb-1">Eff. Rate</th>
                                        <th className="pb-1">Tax</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {/* Equity */}
                                    <tr>
                                        <td className="text-left py-1">Remaining Equity</td>
                                        <td>{formatCurrency(Math.max(0, calc.netCashFromCompany - inputs.loans.reduce((a, b) => a + b.amount, 0)))}</td>
                                        <td>{inputs.saleYear}</td>
                                        <td>{yearsSinceSale}</td>
                                        <td>{calc.equityTax === 0 && inputs.areSharesOwnedByHeirs ? <span className="text-green-600">EXEMPT</span> : `${(40 * taperEstate).toFixed(1)}%`}</td>
                                        <td>{formatCurrency(calc.equityTax)}</td>
                                    </tr>
                                    {/* Assigned Loans */}
                                    {inputs.allocation?.deedBuckets.map(bucket => (
                                        bucket.assignedLoans.map((l, i) => {
                                            const elapsed = inputs.deathYear - l.taperStartYear;
                                            const taper = getTaper(elapsed);
                                            return (
                                                <tr key={`${bucket.id}-${i}`}>
                                                    <td className="text-left py-1 truncate max-w-[150px]">{l.source}</td>
                                                    <td>{formatCurrency(l.amount)}</td>
                                                    <td>{l.taperStartYear}</td>
                                                    <td>{Math.max(0, elapsed)}</td>
                                                    <td>{(40 * taper).toFixed(1)}%</td>
                                                    <td>{formatCurrency(l.taxableValue)}</td>
                                                </tr>
                                            );
                                        })
                                    ))}
                                    {/* Unassigned Loans */}
                                    {inputs.allocation?.unassignedLoans.map((l, i) => (
                                        <tr key={`un-${i}`} className="text-red-500">
                                            <td className="text-left py-1 truncate max-w-[150px]">{l.source} (Unassigned)</td>
                                            <td>{formatCurrency(l.amount)}</td>
                                            <td>{inputs.saleYear}</td>
                                            <td>{yearsSinceSale}</td>
                                            <td>{(40 * taperEstate).toFixed(1)}%</td>
                                            <td>{formatCurrency(l.taxableValue)}</td>
                                        </tr>
                                    ))}

                                    <tr className="border-t font-bold">
                                        <td className="text-left pt-2">TOTAL LIABILITY</td>
                                        <td colSpan="4"></td>
                                        <td className="pt-2">{formatCurrency(calc.currentStrategy.tax)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        {/* 4. Insurance Hedge */}
                        {inputs.insurance.enabled && (
                            <div>
                                <h4 className="font-bold text-gray-900 border-b pb-1 mb-2">4. Insurance Hedge</h4>
                                <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                                    <span>Payout (Death Benefit):</span> <span className="text-right text-green-600">{formatCurrency(inputs.insurance.payout)}</span>
                                    <span>- Total Premiums Paid:</span> <span className="text-right text-red-600">({formatCurrency(inputs.insurance.premium * Math.max(0, inputs.deathYear - inputs.insurance.termStartYear))})</span>
                                    <span className="font-bold border-t border-gray-300 pt-1">= Net Insurance Effect:</span> <span className="text-right font-bold border-t border-gray-300 pt-1">{formatCurrency(calc.insuranceEffect)}</span>
                                </div>
                            </div>
                        )}

                        {/* 5. Summary */}
                        <div>
                            <h4 className="font-bold text-gray-900 border-b pb-1 mb-2">5. Net Wealth Reconciliation</h4>
                            <table className="w-full text-right">
                                <thead className="text-gray-500 text-xs border-b">
                                    <tr>
                                        <th className="text-left pb-1">Step</th>
                                        <th className="pb-1">Value</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td className="text-left py-1">Net Cash in Co</td>
                                        <td>{formatCurrency(calc.netCashFromCompany)}</td>
                                    </tr>
                                    <tr>
                                        <td className="text-left py-1 text-red-600">- Total Tax Liability</td>
                                        <td className="text-red-600">({formatCurrency(calc.currentStrategy.tax)})</td>
                                    </tr>
                                    <tr>
                                        <td className="text-left py-1 text-green-600">+ Net Insurance Benefit</td>
                                        <td className="text-green-600">+{formatCurrency(calc.insuranceEffect)}</td>
                                    </tr>
                                    <tr className="border-t font-bold text-base">
                                        <td className="text-left pt-2">NET WEALTH TO HEIRS</td>
                                        <td className="pt-2 text-emerald-600">{formatCurrency(calc.currentStrategy.wealth)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </Card>
            );
        };

        // --- Development Costs Component ---
        const DevelopmentCostsView = ({ expandedYear, setExpandedYear, enabledSources, costs }) => {
            const [searchQuery, setSearchQuery] = useState("");

            // 1. Filter Transactions (Global Filter AND Exclude Disabled Loans)
            const filteredCosts = useMemo(() => {
                let data = costs || [];
                // Exclude items selected as active loans
                data = data.filter(c => !enabledSources.includes(c.source));

                if (!searchQuery) return data;
                const lowerQ = searchQuery.toLowerCase();
                return data.filter(c => (c.source || "").toLowerCase().includes(lowerQ));
            }, [searchQuery, enabledSources, costs]);

            // 2. Derive Rows from Filtered Data
            const dynamicRows = useMemo(() => {
                // Get all unique years from filtered data, plus years from summary for completeness if no filter
                const years = new Set(filteredCosts.map(c => c.year));
                if (!searchQuery) {
                    COST_SUMMARY.forEach(row => years.add(row.year));
                }

                const sortedYears = Array.from(years).sort((a, b) => a - b);

                return sortedYears.map(year => {
                    const yearTrans = filteredCosts.filter(c => c.year === year);
                    const sumUnindexed = yearTrans.reduce((acc, c) => acc + c.amount, 0);
                    // Dynamically calculate indexed sum if transaction data has it
                    const sumIndexed = yearTrans.reduce((acc, c) => acc + (c.indexed_amount || 0), 0);

                    // Fallback to summary if no transactions for that year but summary exists?
                    // Actually, let's prefer the dynamic sum if we have transactions.
                    // If no transactions, check summary.
                    let finalIndexed = sumIndexed;
                    if (yearTrans.length === 0 && !searchQuery) {
                        const sRow = COST_SUMMARY.find(r => r.year === year);
                        if (sRow) finalIndexed = sRow.indexed;
                    }

                    return {
                        year,
                        unindexed: sumUnindexed,
                        indexed: finalIndexed,
                        hasTransactions: yearTrans.length > 0
                    };
                });
            }, [filteredCosts, searchQuery]);

            // 3. Calculate Totals from Visible Rows
            const totalUnindexed = dynamicRows.reduce((acc, row) => acc + row.unindexed, 0);
            const totalIndexed = dynamicRows.reduce((acc, row) => acc + row.indexed, 0);

            return (
                <div className="space-y-6">
                    <Card title="Yearly Development Costs">
                        {/* Global Search Bar */}
                        <div className="mb-4 flex justify-between items-center">
                            <p className="text-sm text-gray-500">
                                {searchQuery ? `Showing matched transactions across all years.` : `Showing costs (excluding selected loans).`}
                            </p>
                            <div className="relative">
                                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
                                <input
                                    type="text"
                                    placeholder="Search description..."
                                    className="pl-9 pr-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm w-64 shadow-sm"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-gray-50 text-gray-500 border-b border-gray-100">
                                    <tr>
                                        <th className="py-3 px-4">Year</th>
                                        <th className="py-3 px-4 text-right">Unindexed</th>
                                        <th className="py-3 px-4 text-right">Indexed</th>
                                        <th className="py-3 px-4 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {dynamicRows.map(row => (
                                        <React.Fragment key={row.year}>
                                            <tr className={`hover:bg-gray-50 transition-colors ${row.hasTransactions ? '' : 'opacity-50'}`}>
                                                <td className="py-3 px-4 font-medium">{row.year}</td>
                                                <td className="py-3 px-4 text-right text-gray-600">{formatCurrency(row.unindexed)}</td>
                                                <td className="py-3 px-4 text-right font-mono font-medium">
                                                    {formatCurrency(row.indexed)}
                                                </td>
                                                <td className="py-3 px-4 text-right">
                                                    {row.hasTransactions && (
                                                        <button
                                                            onClick={() => setExpandedYear(expandedYear === row.year ? null : row.year)}
                                                            className="text-blue-600 hover:text-blue-800 text-xs font-medium"
                                                        >
                                                            {expandedYear === row.year ? 'Hide' : 'Details'}
                                                        </button>
                                                    )}
                                                </td>
                                            </tr>
                                            {expandedYear === row.year && row.hasTransactions && (
                                                <tr>
                                                    <td colSpan="4" className="bg-gray-50 p-4">
                                                        <div className="max-h-96 overflow-y-auto bg-white rounded border border-gray-200 shadow-inner">
                                                            <table className="w-full text-xs">
                                                                <thead className="bg-gray-100 text-gray-500 sticky top-0">
                                                                    <tr>
                                                                        <th className="py-2 px-3 text-left">Date</th>
                                                                        <th className="py-2 px-3 text-left">Description</th>

        // --- Annual Reports Component ---
        const AnnualReportsView = ({ reports, onImport, activeLoans }) => {
            const [localLoading, setLocalLoading] = useState(false);

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                setLocalLoading(true);
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });

                    // Find likely sheet
                    const sheetName = workbook.SheetNames.find(n => n.includes("Consolidation")) || workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    const data = XLSX.utils.sheet_to_json(sheet, { header: 1 }); // Array of arrays

                    // 1. Find Year Headers
                    let yearMap = {}; // { colIndex: year }
                    let headerRowIndex = -1;

                    for (let r = 0; r < data.length; r++) {
                        const row = data[r];
                        for (let c = 0; c < row.length; c++) {
                            const val = String(row[c]);
                            const match = val.match(/20\d{2}/); // Matches 2015, 2016 etc.
                            if (match) {
                                yearMap[c] = parseInt(match[0]);
                                headerRowIndex = r;
                            }
                        }
                        if (Object.keys(yearMap).length > 2) break; // Found headers
                    }

                    if (headerRowIndex === -1) throw new Error("Could not find year headers (e.g., 2015, 2016)");

                    // 2. Extract Data Rows
                    let extracted = {}; // { year: { ...data } }
                    Object.values(yearMap).forEach(y => extracted[y] = { year: y });

                    const keywords = {
                        'Turnover': 'turnover',
                        'Administrative expenses': 'admin_expenses',
                        'Operating Profit': 'operating_profit',
                        'Tangible': 'tangible_assets', // Matches "Fixed Assets (Tangible)"
                        'Cash at bank': 'cash',
                        'Directors': 'director_loan', // Matches "Directors' Loan Account"
                        'Director': 'director_loan',
                        'Net Assets': 'net_assets',
                        'Dividends': 'dividends',
                        'Retained Earnings': 'retained_earnings'
                    };

                    for (let r = headerRowIndex + 1; r < data.length; r++) {
                        const row = data[r];
                        // LABEL is in Column 1 (Item), Column 0 is Category (P&L, Assets etc)
                        const label = String(row[1] || row[0] || '').trim();

                        if (!label || label === '-') continue;

                        // Check keywords
                        let key = null;
                        for (const [search, k] of Object.entries(keywords)) {
                            if (label.toLowerCase().includes(search.toLowerCase())) {
                                key = k;
                                break;
                            }
                        }

                        if (key) {
                            // Valid row, extract values for mapped columns
                            Object.entries(yearMap).forEach(([colIdx, year]) => {
                                const rawVal = row[colIdx];
                                let val = 0;

                                if (typeof rawVal === 'number') {
                                    val = rawVal;
                                } else if (typeof rawVal === 'string') {
                                    const cleaned = rawVal.replace(/[,£]/g, '').trim();
                                    if (cleaned === '-' || cleaned === '–') {
                                        val = 0;
                                    } else {
                                        let v = cleaned.replace(/[^0-9.-]/g, '');
                                        // Handle (100) negative format
                                        if (rawVal.includes('(') && rawVal.includes(')')) {
                                            v = '-' + v;
                                        }
                                        val = parseFloat(v);
                                        if (isNaN(val)) val = 0;
                                    }
                                }
                                extracted[year][key] = val;
                            });
                        }
                    }

                    const finalData = Object.values(extracted).sort((a, b) => a.year - b.year);
                    console.log("Imported Report Data:", finalData);

                    // PASS UP
                    onImport(finalData);
                    setLocalLoading(false);

                    alert("Import failed: " + e.message);
                    setLocalLoading(false);

                                        <YAxis />
                                        <Tooltip formatter={(value) => formatCurrency(value)} />
                                        <Legend />
                                        <Line type="monotone" dataKey="director_loan" stroke="#8b5cf6" name="Dir. Loan" strokeWidth={2} />

                    <Card title="Annual Financial Reports Data">

                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-gray-50 text-gray-500 border-b border-gray-100">
                                    <tr>
                                        <th className="py-3 px-4">Metric</th>
                                        {sortedReports.map(r => (
                                            <th key={r.year} className="py-3 px-4 text-right">{r.year}</th>

                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">

                                    <tr>
                                        <td className="py-3 px-4 text-gray-600">Admin Expenses</td>
                                        {sortedReports.map(r => (

                                    <tr>

                                        {sortedReports.map(r => (

                                                {formatCurrency(r.operating_profit)}
                                            </td>

                                    {/* Balance Sheet Section */}
                                    <tr className="bg-gray-50/50 font-medium text-xs uppercase text-gray-500"><td colSpan={sortedReports.length + 1} className="py-2 px-4">Balance Sheet</td></tr>
                                    <tr>
                                        <td className="py-3 px-4 text-gray-600">Tangible Assets</td>
                                        {sortedReports.map(r => (
                                            <td key={r.year} className="py-3 px-4 text-right">{formatCurrency(r.tangible_assets)}</td>

                                    <tr>

                                        {sortedReports.map(r => (

                                        {sortedReports.map(r => {

                                            // Based on "Loans" tab, activeLoans seems to be the current set of loans. 
                                            // If we want historical strategy position, we filter by year.
                                            // IF activeLoans[i].year is the year the loan was TAKEN:
                                            const balance = (activeLoans || []).filter(l => l.year <= r.year).reduce((acc, l) => acc + l.amount, 0);
                                            return <td key={r.year} className="py-3 px-4 text-right text-orange-800 font-medium">{formatCurrency(balance)}</td>

        // --- Bank Feed Component ---
        const BankFeedView = ({ transactions }) => {
            const [dateRange, setDateRange] = useState({ start: '', end: '' });
            const [searchQuery, setSearchQuery] = useState('');
            const [viewMode, setViewMode] = useState('list'); // 'list', 'monthly'

            // 1. Filter Transactions
            const filteredData = useMemo(() => {
                let data = transactions || [];

                // Date Filter
                if (dateRange.start) data = data.filter(t => t.date >= dateRange.start);
                if (dateRange.end) data = data.filter(t => t.date <= dateRange.end);

                // Search Filter
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    data = data.filter(t =>
                        (t.description || '').toLowerCase().includes(q) ||
                        (t.reference || '').toLowerCase().includes(q) ||
                        String(t.amount).includes(q) ||
                        (t.Contact && t.Contact.Name && t.Contact.Name.toLowerCase().includes(q))
                    );
                }

                // Xero dates are usually ISO strings or similar, ensure standard date sorting
                return data.sort((a, b) => new Date(b.date || b.DateString) - new Date(a.date || a.DateString));
            }, [transactions, dateRange, searchQuery]);

            // 2. Aggregate for Chart/Monthly View
            const aggregatedData = useMemo(() => {
                const groups = {}; // 'YYYY-MM': { income: 0, expense: 0, net: 0 }

                filteredData.forEach(t => {
                    const dateStr = t.date || t.DateString;
                    if (!dateStr) return;

                    const date = new Date(dateStr);
                    const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;

                    if (!groups[key]) groups[key] = { month: key, income: 0, expense: 0, net: 0 };

                    // In Xero Bank Transaction: 
                    // Type CAN be SPEND or RECEIVE.
                    // Usually Total is signed or we check Type.
                    // For simplicity, let's assume 'amount' is provided signed (or we derive it).
                    // In our budget-bridge, we saved raw transaction. 
                    // IMPORTANT: Xero API 'Total' is always positive usually? No, Total is number.
                    // But 'Type' = SPEND means outflow.
                    // Let's assume the sync script logic: "Standard Accounting: Debit (+) - Credit (-)"
                    // Wait, in Sync Script we didn't transform amount, we just saved 'tx'.
                    // Xero API BankTransaction has 'Total', 'TotalTax', 'Type'.
                    // We need to robustly handle sign.

                    let amt = parseFloat(t.Total || t.amount || 0);
                    if (t.Type === 'SPEND' && amt > 0) amt = -amt; // Ensure spend is negative

                    // If we used the logic from DevelopmentCostsView used in 'sheet_to_json' logic:
                    // "Debit (+) - Credit (-)" was for Excel.
                    // For API: SPEND is negative, RECEIVE is positive.

                    if (amt > 0) groups[key].income += amt;
                    else groups[key].expense += Math.abs(amt);
                    groups[key].net += amt;
                });

                return Object.values(groups).sort((a, b) => a.month.localeCompare(b.month));
            }, [filteredData]);

            // 3. Summary Stats
            const stats = useMemo(() => {
                let totalIncome = 0;
                let totalExpense = 0;

                filteredData.forEach(t => {
                    let amt = parseFloat(t.Total || t.amount || 0);
                    if (t.Type === 'SPEND' && amt > 0) amt = -amt;

                    if (amt > 0) totalIncome += amt;
                    else totalExpense += Math.abs(amt);
                });

                return {
                    income: totalIncome,
                    expense: totalExpense,
                    net: totalIncome - totalExpense,
                    count: filteredData.length
                };
            }, [filteredData]);

            return (
                <div className="space-y-6">

                    <Card title="Bank Feed Filters">

                                >

                            </div>
                        </div>
                    </Card>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                            <div className="text-sm font-medium text-gray-500">Total Income</div>
                            <div className="text-2xl font-bold text-emerald-600 mt-1">{formatCurrency(stats.income)}</div>
                        </div>
                        <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                            <div className="text-sm font-medium text-gray-500">Total Expenses</div>
                            <div className="text-2xl font-bold text-red-600 mt-1">{formatCurrency(stats.expense)}</div>
                        </div>
                        <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                            <div className="text-sm font-medium text-gray-500">Net Position</div>
                            <div className={`text-2xl font-bold mt-1 ${stats.net >= 0 ? 'text-emerald-600' : 'text-red-600'}`}>

                    {/* Monthly Chart */}
                    {viewMode === 'monthly' && (

                                        <Bar dataKey="expense" name="Expenses" fill="#ef4444" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </Card>
                    )}

                    {/* Transaction List */}
                    {viewMode === 'list' && (
                        <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left">

                                        {filteredData.slice(0, 100).map((t) => {
                                            let amt = parseFloat(t.Total || t.amount || 0);
                                            if (t.Type === 'SPEND' && amt > 0) amt = -amt;

                                            return (
                                                <tr key={t.BankTransactionID || Math.random()} className="hover:bg-gray-50">
                                                    <td className="px-6 py-3 font-mono text-gray-600 whitespace-nowrap">
                                                        {new Date(t.date || t.DateString).toLocaleDateString('en-GB')}
                                                    </td>
                                                    <td className="px-6 py-3 font-medium text-gray-800">
                                                        {t.Contact?.Name || t.description || 'Unknown'}
                                                        {t.LineItems && t.LineItems.length > 0 && (
                                                            <span className="block text-xs text-gray-400 font-normal truncate max-w-xs">{t.LineItems[0].Description}</span>
                                                        )}
                                                    </td>
                                                    <td className="px-6 py-3 text-gray-500">{t.Reference}</td>
                                                    <td className={`px-6 py-3 text-right font-mono font-medium ${amt < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
                                                        {formatCurrency(amt)}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                        {filteredData.length > 100 && (
                                            <tr>
                                                <td colSpan="4" className="px-6 py-3 text-center text-xs text-gray-400">
                                                    Showing first 100 of {filteredData.length} transactions
                                                </td>
                                            </tr>
                                        )}
                                        {filteredData.length === 0 && (
                                            <tr><td colSpan="4" className="text-center py-8 text-gray-400">No transactions found</td></tr>
                                        )}
                                    </tbody>
                                </table>

                </div>
