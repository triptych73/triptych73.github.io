                // 1. Process Legacy Excel Data (Pre-Cutoff)
                const legacy = rawTransactions.filter(t => {
                    // Assuming 'period' format YYYY-MM
                    const dateStr = t.period + '-01';
                    return dateStr < CUTOFF_DATE;
                }).map(t => {
                    const fullDate = t.period + '-01';
                    return { ...t, fullDate, indexed_amount: calculateIndexedCost(t.amount, fullDate) };
                });

                // 2. Process Xero Data (Post-Cutoff)
                const xero = bankTransactions.filter(t => {
                    const d = t.Date || t.date || t.DateString; // YYYY-MM-DD
                    return d && d >= CUTOFF_DATE;
                }).map(t => {
                    // MAP Xero Schema to App Schema
                    // Xero: Net is Negative for Money Out/Expense (based on observation), Excel: Amount is Positive for Cost.
                    // Therefore: Invert Net.
                    const rawAmount = parseFloat(t.Net) || 0;
                    const type = (t.AccountType || '').toUpperCase();
                    const accName = (t.AccountName || '').toLowerCase();
                    let amount = rawAmount;

                    // Raw Amount is POSITIVE for Costs (verified via Debug Panel).
                    // So we use it directly.

                    const d = t.Date || t.date || t.DateString;
                    const year = parseInt(d.split('-')[0]);
                    const period = d.slice(0, 7); // YYYY-MM

                    // Source: Use Contact Name (Vendor)
                    let source = t.Contact || t.Description || 'Unknown';
                    source = source.trim();
                    if (!source) source = "Unknown Xero Tx";

                    if (accName.includes('loan')) {
                        source += " - Loan";
                    }

                    return {
                        id: t.id,
                        period,
                        year,
                        fullDate: d,
                        source,
                        amount,
                        indexed_amount: calculateIndexedCost(amount, d)
                    };
                });

                console.log(`Merged Data: ${legacy.length} Legacy + ${xero.length} Xero`);
                // Fix: Sort merged data by fullDate (Oldest First) to ensure Allocation Engine fills deeds chronologically.
                return [...legacy, ...xero].sort((a, b) => (a.fullDate || '').localeCompare(b.fullDate || ''));
            }, [rawTransactions, bankTransactions]);

            // 2. Identify Candidate Loan Sources
            const loanSources = useMemo(() => {
                const uniqueSources = new Set();
                unifiedTransactions.forEach(t => {
                    if (isAdvancedLoan(t)) {
                        uniqueSources.add(t.source);
                    }
                });
                return [...uniqueSources].sort();
            }, [unifiedTransactions]);

            // 3. Dynamic Split: Active Loans vs. Costs
            const { activeLoans, effectiveCosts } = useMemo(() => {
                const l = [];
                const c = [];

                unifiedTransactions.forEach(t => {
                    if (enabledSources.includes(t.source)) {
                        let loan = { ...t };
                        // LOAN LOGIC:
                        // Database stores Debit (+) and Credit (-).
                        // Loans are Liabilities, which means they are Credit Balances (Negative in DB).
                        // To show them as Positive Debts in the UI, we INVERT the sign.
                        // Repayments (Debit in DB) will thus become Negative (reducing the Loan), which is correct.
                        loan.amount = -loan.amount;
                        l.push(loan);
                    } else {
                        // COST LOGIC:
                        // Costs are Debits (Positive in DB).
                        // Refunds are Credits (Negative in DB).
                        // We keep the sign as is.
                        c.push(t);
                    }
                });

                return { activeLoans: l, effectiveCosts: c };
            }, [unifiedTransactions, enabledSources]);

            // 4. Persistence Save
            const saveData = async () => {
                if (!user) {
                    alert("You must be logged in to save settings.");
                    return;
                }
                const settings = { salePrice, useIndexedCosts, saleYear, deathYear, areSharesOwnedByHeirs, enabledSources, insurance, deeds, autoAssignmentDate };
                try {
                    // 1. Save Settings
                    await db.collection('settings').doc(user.uid).set(settings);

                    // 2. Save Annual Reports (if any)
                    if (annualReports.length > 0) {
                        const batch = db.batch();
                        annualReports.forEach(r => {
                            if (r.year) {
                                const ref = db.collection('annual_reports').doc(String(r.year));
                                batch.set(ref, r);
                            }
                        });
                        await batch.commit();
                        console.log("Annual reports saved.");
                    }

                    alert("Settings and Annual Reports saved to Firebase!");
                } catch (e) {
                    console.error("Save failed", e);
                    alert("Failed to save settings: " + e.message);
                }
            };

            const resetData = () => {
                if (confirm("Reset layout to defaults?")) {
                    setSalePrice(DEFAULT_DATA.salePrice);
                    setSaleYear(DEFAULT_DATA.saleYear);
                    // ... partial reset or full reload?
                    window.location.reload();
                }
            };

            const devCostsObj = useMemo(() => {
                const unindexed = effectiveCosts.reduce((acc, c) => acc + c.amount, 0);
                const indexed = effectiveCosts.reduce((acc, c) => acc + (c.indexed_amount || 0), 0);
                if (indexed === 0 && COST_DATA.indexed > 0) {
                    return { unindexed: COST_DATA.unindexed, indexed: COST_DATA.indexed };
                }
                return { unindexed, indexed };
            }, [effectiveCosts]);

            const devCosts = useIndexedCosts ? devCostsObj.indexed : devCostsObj.unindexed;

            const toggleSource = (source) => {
                if (enabledSources.includes(source)) {
                    setEnabledSources(enabledSources.filter(s => s !== source));
                } else {
                    setEnabledSources([...enabledSources, source]);
                }
            };

            const toggleAllLoans = (e) => {
                if (e.target.checked) {
                    setEnabledSources(loanSources);
                } else {
                    setEnabledSources([]);
                }
            };

            const allocation = useMemo(() => {
                // 1. Prepare Data
                const sortedLoans = [...activeLoans].sort((a, b) => (a.year - b.year) || (a.id - b.id));

                // Manual Deeds (FIFO Pool)
                const manualDeeds = deeds.map(d => ({
                    ...d,
                    remainingCapacity: d.amount,
                    assignedLoans: [],
                    isAuto: false
                })).sort((a, b) => new Date(a.date) - new Date(b.date));

                const autoDeeds = [];
                const fifoLoans = [];
                // Use String Comparison for robustness (ISO YYYY-MM-DD works lexicographically)
                const cutoff = autoAssignmentDate || null;

                // 2. Split Loans: Auto vs FIFO
                sortedLoans.forEach(loan => {
                    const loanDate = loan.fullDate || (loan.year + '-01-01');
                    if (cutoff && loanDate > cutoff) {
                        // AUTO ASSIGN (1:1 Exact Match)
                        // Create a specific deed for this loan on its date
                        const year = parseInt(loanDate.split('-')[0]);
                        autoDeeds.push({
                            id: 'auto-' + loan.id,
                            date: loan.fullDate || loan.year + '-01-01',
                            amount: loan.amount, // Deed size matches loan exactly
                            remainingCapacity: 0, // Fully used
                            assignedLoans: [{
                                originalLoan: loan,
                                amount: loan.amount, // 100% of loan
                                year: loan.year,
                                source: loan.source,
                                taperStartYear: year
                            }],
                            isAuto: true
                        });
                    } else {
                        fifoLoans.push(loan);
                    }
                });

                // 3. FIFO Matching (for remaining loans -> manual deeds)
                const unassignedLoans = [];
                let loanIdx = 0;

                while (loanIdx < fifoLoans.length) {
                    let loan = { ...fifoLoans[loanIdx] };
                    let loanAmountRemaining = loan.amount;

                    for (const bucket of manualDeeds) {
                        if (bucket.remainingCapacity <= 0.01) continue;

                        const amountToAssign = Math.min(loanAmountRemaining, bucket.remainingCapacity);

                        // Parse year from deed date for Taper calculation
                        const deedYear = parseInt(bucket.date.split('-')[0]);

                        bucket.assignedLoans.push({
                            originalLoan: loan,
                            amount: amountToAssign,
                            year: loan.year,
                            source: loan.source,
                            taperStartYear: deedYear
                        });

                        bucket.remainingCapacity -= amountToAssign;
                        loanAmountRemaining -= amountToAssign;
                        if (loanAmountRemaining <= 0.01) break;
                    }

                    if (loanAmountRemaining > 0.01) {
                        unassignedLoans.push({
                            originalLoan: loan,
                            amount: loanAmountRemaining,
                            year: loan.year,
                            source: loan.source,
                            taperStartYear: null
                        });
                    }
                    loanIdx++;
                }

                // 4. Combine Results
                const allDeeds = [...manualDeeds, ...autoDeeds].sort((a, b) => new Date(a.date) - new Date(b.date));

                return { deedBuckets: allDeeds, unassignedLoans };
            }, [activeLoans, deeds, autoAssignmentDate]);

            // Calculations
            const calculations = useMemo(() => {
                const corpTaxRate = 0.25;
                const profit = Math.max(0, salePrice - devCosts);
                const corpTax = profit * corpTaxRate;

                const totalLoans = activeLoans.reduce((acc, l) => acc + l.amount, 0);
                const netCashFromCompany = Math.max(0, salePrice - corpTax);
                const equityAfterLoans = Math.max(0, netCashFromCompany - totalLoans);

                const wealthToTransfer = netCashFromCompany;

                // Current Strategy (Deeds Based)
                let totalTax = 0;

                // 1. Equity Tax (Conditional on Share Ownership)
                // If Shares are owned by Heirs, the net equity in the company is NOT part of the Director's Estate.
                const estateTaperYears = Math.max(0, deathYear - saleYear);
                const estateTaperRate = getTaperRate(estateTaperYears);

                let equityTax = 0;
                if (!areSharesOwnedByHeirs) {
                    equityTax = (equityAfterLoans * 0.40) * estateTaperRate;
                    totalTax += equityTax;
                }

                // 2. Assigned Loans Tax
                allocation.deedBuckets.forEach(bucket => {
                    bucket.assignedLoans.forEach(item => {
                        const yearsSinceDeed = Math.max(0, deathYear - item.taperStartYear);
                        const rate = getTaperRate(yearsSinceDeed);
                        item.taxableValue = item.amount * 0.40 * rate; // Store for UI
                        item.taperRate = rate; // Store for UI
                        totalTax += item.taxableValue;
                    });
                });

                // 3. Unassigned Loans Tax (Estate)
                allocation.unassignedLoans.forEach(item => {
                    const rate = estateTaperRate;
                    item.taxableValue = item.amount * 0.40 * rate;
                    item.taperRate = rate;
                    totalTax += item.taxableValue;
                });

                // Insurance
                const duration = Math.max(0, deathYear - insurance.termStartYear);
                const insuranceCost = insurance.enabled ? insurance.premium * duration : 0;
                const insurancePayout = insurance.enabled ? insurance.payout : 0;

                const finalWealth = wealthToTransfer - totalTax + insurancePayout - insuranceCost;

                return {
                    corpTax,
                    netCashFromCompany,
                    wealthToTransfer,
                    currentStrategy: { tax: totalTax, wealth: finalWealth },
                    insuranceEffect: insurancePayout - insuranceCost,
                    equityTax // Exposed for breakdown if needed
                };
            }, [salePrice, devCosts, saleYear, deathYear, activeLoans, insurance, allocation, areSharesOwnedByHeirs]);

            // Resilience: Force stop loading after 5s
            useEffect(() => {
                const t = setTimeout(() => {
                    if (loading) {
                        console.warn("Forcing loading complete due to timeout");
                        setLoading(false);
                    }
                }, 5000);
                return () => clearTimeout(t);
            }, [loading]);

            // --- EXCEL/JSON IMPORT LOGIC ---
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setLoading(true);

                // HANDLE JSON (Annual Reports)
                if (file.name.toLowerCase().endsWith('.json')) {
                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        try {
                            const jsonContent = JSON.parse(evt.target.result);
                            if (!Array.isArray(jsonContent)) throw new Error("JSON must be an array of objects");

                            console.log("Importing JSON reports:", jsonContent.length);

                            const batch = db.batch();
                            jsonContent.forEach(item => {
                                if (item.year) {
                                    const ref = db.collection('annual_reports').doc(String(item.year));
                                    batch.set(ref, item);
                                }
                            });
                            await batch.commit();
                            alert(`Successfully imported ${jsonContent.length} annual reports!`);
                            setLoading(false);
                        } catch (err) {
                            console.error("JSON Import failed:", err);
                            alert("JSON Import failed: " + err.message);
                            setLoading(false);
                        }
                    };
                    reader.readAsText(file);
                    return;
                }

                // HANDLE EXCEL (Transactions)
                const reader = new FileReader();

                reader.onload = async (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        // Find Transactions Sheet
                        const sheetName = workbook.SheetNames.find(n => n.toUpperCase().includes('TRANSACT') || n.toUpperCase().includes('FULL'));
                        if (!sheetName) {
                            alert("Could not find a 'TRANSACTIONS' or 'FULL' sheet in this Excel file.");
                            setLoading(false);
                            return;
                        }

                        console.log("Processing sheet:", sheetName);
                        const worksheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 }); // Array of arrays

                        if (json.length < 2) {
                            alert("Sheet appears empty.");
                            setLoading(false);
                            return;
                        }

                        // Header Mapping
                        const headers = json[0].map(h => String(h).trim());
                        const dateIdx = headers.findIndex(h => h.match(/Date/i));
                        const descIdx = headers.findIndex(h => h.match(/Desc/i));
                        const payeeIdx = headers.findIndex(h => h.match(/Payee/i));
                        const debitIdx = headers.findIndex(h => h.match(/Debit/i));
                        const creditIdx = headers.findIndex(h => h.match(/Credit/i));
                        const indexedIdx = headers.findIndex(h => h.match(/Indexed/i));

                        const newTransactions = [];
                        let count = 0;

                        // Helper for cleaning amounts
                        const cleanAmt = (val) => {
                            if (typeof val === 'number') return val;
                            if (!val) return 0;
                            if (val === 'nan' || val === 'NaN') return 0;
                            const num = parseFloat(String(val).replace(/[£,]/g, ''));
                            return isNaN(num) ? 0 : num;
                        };

                        // helper for Excel Date
                        const parseDate = (val) => {
                            if (!val) return null;
                            if (val instanceof Date) return val;
                            // Excel serial
                            if (typeof val === 'number') {
                                return new Date(Math.round((val - 25569) * 86400 * 1000));
                            }
                            // String
                            const d = new Date(val);
                            return isNaN(d) ? null : d;
                        };

                        for (let i = 1; i < json.length; i++) {
                            const row = json[i];
                            const dateVal = row[dateIdx];
                            if (!dateVal) continue;

                            const dt = parseDate(dateVal);
                            if (!dt || isNaN(dt.getTime())) continue;

                            const year = dt.getFullYear();
                            if (year < 2004 || year > 2030) continue;

                            const period = `${year}-${String(dt.getMonth() + 1).padStart(2, '0')}`;

                            let desc = row[descIdx] || "Unknown";
                            let payee = row[payeeIdx];
                            let source = payee ? `${desc} - ${payee}` : desc;
                            source = String(source).replace(/["\n]/g, ' ').trim().replace(/-$/, '').trim();

                            let debit = cleanAmt(row[debitIdx]);
                            let credit = cleanAmt(row[creditIdx]);
                            let indexed = cleanAmt(row[indexedIdx]);

                            // Standard Accounting: Debit (+) - Credit (-)
                            let amount = debit - credit;

                            if (Math.abs(amount) < 0.01) continue;

                            newTransactions.push({
                                period,
                                source,
                                amount,
                                indexed_amount: indexed,
                                year
                            });
                            count++;
                        }

                        if (count === 0) {
                            alert("No valid transactions extracted.");
                            setLoading(false);
                            return;
                        }

                        // Batch Write to Firestore
                        const batchLimit = 450;

                        console.log("Deleting existing records...");
                        const snap = await db.collection('transactions').get();
                        const deleteBatches = [];
                        let currentDeleteBatch = db.batch();
                        let deleteCount = 0;
                        snap.forEach(doc => {
                            currentDeleteBatch.delete(doc.ref);
                            deleteCount++;
                            if (deleteCount % batchLimit === 0) {
                                deleteBatches.push(currentDeleteBatch);
                                currentDeleteBatch = db.batch();
                            }
                        });
                        deleteBatches.push(currentDeleteBatch);
                        await Promise.all(deleteBatches.map(b => b.commit()));

                        console.log("Uploading new records...");
                        const writeBatches = [];
                        let currentWriteBatch = db.batch();
                        let writeCount = 0;
                        newTransactions.forEach(t => {
                            const ref = db.collection('transactions').doc(); // Auto ID
                            currentWriteBatch.set(ref, t);
                            writeCount++;
                            if (writeCount % batchLimit === 0) {
                                writeBatches.push(currentWriteBatch);
                                currentWriteBatch = db.batch();
                            }
                        });
                        writeBatches.push(currentWriteBatch);
                        await Promise.all(writeBatches.map(b => b.commit()));

                        alert(`Successfully imported ${count} transactions!`);
                        setLoading(false);

                    } catch (err) {
                        console.error("Import failed:", err);
                        alert("Import failed: " + err.message);
                        setLoading(false);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const triggerFileInput = () => {
                document.getElementById('excel-upload').click();
            };

            // Calculated total for SELECTED sources
            const selectedLoansTotal = activeLoans.reduce((acc, l) => acc + l.amount, 0);

            if (loading) {
                return (
                    <div className="flex h-screen items-center justify-center bg-gray-50">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                            <h2 className="text-xl font-bold text-gray-700">Loading Data...</h2>
                            <p className="text-gray-500">Connecting to Firestore</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="flex h-screen items-center justify-center bg-gray-100">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center">
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">Access Restricted</h2>
                            <p className="text-gray-500 mb-6">Please sign in to access the Financial Strategy Engine.</p>
                            <button
                                onClick={() => {
                                    const provider = new firebase.auth.GoogleAuthProvider();
                                    firebase.auth().signInWithPopup(provider).catch(e => alert(e.message));
                                }}
                                className="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-sm flex items-center justify-center gap-2"
                            >
                                <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.53-6.033-5.854s2.701-5.854,6.033-5.854c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z" /></svg>
                                <span>Sign in with Google</span>
                            </button>
                        </div>
                    </div>
                );
            }



            // 5. Explicit Annual Reports Update (from Assets fetch)
            const updateAnnualReports = async (data) => {
                setAnnualReports(data);

                // Persist immediately
                if (user) {
                    try {
                        const batch = db.batch();
                        data.forEach(r => {
                            if (r.year) {
                                const ref = db.collection('annual_reports').doc(String(r.year));
                                batch.set(ref, r);
                            }
                        });
                        await batch.commit();
                        console.log("Annual reports auto-saved.");
                    } catch (e) {
                        console.error("Auto-save failed", e);
                    }
                }
            };

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8 pb-32">
                    <header className="flex flex-col md:flex-row md:justify-between md:items-center pb-6 border-b border-gray-200">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-900 tracking-tight">Financial Strategy Engine</h1>
                            <p className="text-gray-500 mt-1">Modeling the liquidation of STMS Ltd & IHT Planning</p>
                        </div>
                        <div className="mt-4 md:mt-0 flex items-center gap-2">
                            <input type="file" id="excel-upload" accept=".xlsx,.xls,.json" className="hidden" onChange={handleFileUpload} />
                            <button onClick={triggerFileInput} className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium text-sm hover:bg-emerald-700 transition-colors shadow-sm flex items-center gap-2">
                                <span>Import Data</span>
                            </button>
                            <div className="bg-emerald-50 text-emerald-700 px-4 py-2 rounded-lg font-medium text-sm border border-emerald-100 hidden md:block">
                                Corp: {formatCurrency(calculations.corpTax)}
                            </div>
                            <button onClick={saveData} className="bg-gray-800 text-white px-4 py-2 rounded-lg font-medium text-sm hover:bg-gray-900 transition-colors shadow-sm flex items-center gap-2">
                                <span>Save</span>
                            </button>
                            <button
                                onClick={() => setShowMath(!showMath)}
                                className={`px-4 py-2 rounded-lg font-medium text-sm border transition-colors ${showMath ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                            >
                                {showMath ? 'Hide Math' : 'Show Logic'}
                            </button>
                            <button onClick={resetData} className="text-gray-400 hover:text-red-500 p-2 rounded-full transition-colors" title="Reset to Defaults">
                                ↺
                            </button>
                            <button onClick={() => firebase.auth().signOut().then(() => window.location.reload())} className="text-gray-400 hover:text-red-500 text-xs uppercase font-medium ml-2 transition-colors">
                                Log Out
                            </button>
                        </div>
                    </header>

                    {/* Tab Navigation */}
                    <div className="flex space-x-6 border-b border-gray-200 mb-8">
                        <button
                            onClick={() => setActiveTab('loans')}
                            className={`pb-3 px-2 font-medium text-sm transition-all border-b-2 ${activeTab === 'loans' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}
                        >
                            Director Loan Strategy
                        </button>
                        <button
                            onClick={() => setActiveTab('costs')}
                            className={`pb-3 px-2 font-medium text-sm transition-all border-b-2 ${activeTab === 'costs' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}
                        >
                            Development Costs Analysis
                        </button>
                        <button
                            onClick={() => setActiveTab('reports')}
                            className={`pb-3 px-2 font-medium text-sm transition-all border-b-2 ${activeTab === 'reports' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}
                        >
                            Annual Reports
                        </button>
                        <button
                            onClick={() => setActiveTab('bank')}
                            className={`pb-3 px-2 font-medium text-sm transition-all border-b-2 ${activeTab === 'bank' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}
                        >
                            Xero Transactions
                        </button>
                    </div>

                    {/* VIEW: Annual Reports */}
                    {activeTab === 'reports' && (
                        <AnnualReportsView reports={annualReports} onImport={updateAnnualReports} activeLoans={activeLoans} />
                    )}


                    {/* VIEW: Development Costs */}
                    {activeTab === 'costs' && (
                        <DevelopmentCostsView
                            expandedYear={expandedYear}
                            setExpandedYear={setExpandedYear}
                            enabledSources={enabledSources}
                            costs={effectiveCosts}
                        />
                    )}

                    {/* VIEW: Bank Feed */}
                    {activeTab === 'bank' && (
                        <BankFeedView transactions={bankTransactions} />
                    )}

                    {/* VIEW: Loans Strategy (Main Dashboard) */}
                    <div className={`grid grid-cols-1 lg:grid-cols-12 gap-8 ${activeTab === 'loans' ? 'block' : 'hidden'}`}>
                        {/* LEFT: Controls (4 cols) */}
                        <div className="lg:col-span-4 space-y-6">
                            <Card title="Timeline Stress Test">
                                <div className="space-y-6">
                                    <SliderInput
                                        label="Asset Sale Year"
                                        value={saleYear}
                                        onChange={setSaleYear}
                                        min={2024}
                                        max={2030}
                                    />
                                    <SliderInput
                                        label="Projected Death Year"
                                        value={deathYear}
                                        onChange={setDeathYear}
                                        min={saleYear}
                                        max={saleYear + 15}
                                    />

                                    <div className={`p-4 rounded-lg text-sm border ${(deathYear - saleYear) >= 7 ? 'bg-green-50 border-green-200 text-green-800' :
                                        'bg-amber-50 border-amber-200 text-amber-800'
                                        }`}>
                                        <strong>{deathYear - saleYear} Years</strong> elapsed since sale. <br />
                                        PET Taper Relief: {Math.round((1 - getTaperRate(deathYear - saleYear)) * 100)}%
                                    </div>
                                </div>
                            </Card>

                            <Card title="Structure & Values">
                                <div className="space-y-4">
                                    <NumberInput label="Sale Price" value={salePrice} onChange={setSalePrice} />

                                    {/* Cost Basis Toggle */}
                                    <div className="space-y-2">
                                        <label className="text-sm font-medium text-gray-600">Cost Basis</label>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => setUseIndexedCosts(false)}
                                                className={`flex-1 py-2 px-3 text-sm rounded-lg border transition-all ${!useIndexedCosts ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                                            >
                                                Unindexed
                                            </button>
                                            <button
                                                onClick={() => setUseIndexedCosts(true)}
                                                className={`flex-1 py-2 px-3 text-sm rounded-lg border transition-all ${useIndexedCosts ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                                            >
                                                Indexed
                                            </button>
                                        </div>
                                        <div className="text-xs text-gray-500 bg-gray-50 p-2 rounded">
                                            Using: <span className="font-semibold">{formatCurrency(devCosts)}</span>
                                            <span className="text-gray-400 ml-2">
                                                ({useIndexedCosts ? 'RPI Adjusted' : 'Original Costs'})
                                            </span>
                                        </div>
                                    </div>

                                    <div className="pt-4 border-t border-gray-100">
                                        <Toggle
                                            label="Company Shares owned by Heirs?"
                                            enabled={areSharesOwnedByHeirs}
                                            onChange={setAreSharesOwnedByHeirs}
                                        />
                                        <p className="text-xs text-gray-500 mt-1 mb-4">
                                            If enabled, remaining equity in the company is considered outside the Director's estate.
                                        </p>
                                    </div>

                                    <div className="pt-4 border-t border-gray-100">
                                        <Toggle
                                            label="Life Insurance Hedge"
                                            enabled={insurance.enabled}
                                            onChange={(v) => setInsurance({ ...insurance, enabled: v })}
                                        />
                                        {insurance.enabled && (
                                            <div className="mt-4 space-y-3 pl-4 border-l-2 border-blue-100 animation-fade-in">
                                                <NumberInput
                                                    label="Death Benefit (Payout)"
                                                    value={insurance.payout}
                                                    onChange={(v) => setInsurance({ ...insurance, payout: v })}
                                                />
                                                <NumberInput
                                                    label="Annual Premium"
                                                    value={insurance.premium}
                                                    onChange={(v) => setInsurance({ ...insurance, premium: v })}
                                                />
                                                <NumberInput
                                                    label="Policy Start Year"
                                                    value={insurance.termStartYear || 2022}
                                                    onChange={(v) => setInsurance({ ...insurance, termStartYear: v })}
                                                    prefix=""
                                                />
                                                <div className="text-xs text-gray-500 mt-2">
                                                    Total Cost to Date: {formatCurrency(insurance.premium * Math.max(0, deathYear - (insurance.termStartYear || 2022)))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </Card>

                            <Card title={
                                <div className="flex justify-between items-center w-full">
                                    <div className="flex items-center gap-2">
                                        <span>Director Loan Sources</span>
                                        <button
                                            onClick={(e) => { e.stopPropagation(); setIsLoanSourcesOpen(!isLoanSourcesOpen); }}
                                            className="text-xs font-normal text-blue-600 bg-blue-50 px-2 py-1 rounded hover:bg-blue-100"
                                        >
                                            {isLoanSourcesOpen ? 'Collapse' : 'Expand'}
                                        </button>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        {isLoanSourcesOpen && (
                                            <div onClick={e => e.stopPropagation()} className="flex items-center gap-2">
                                                <input
                                                    type="checkbox"
                                                    id="selectAllLoans"
                                                    checked={enabledSources.length === loanSources.length && loanSources.length > 0}
                                                    onChange={toggleAllLoans}
                                                    className="w-4 h-4 text-blue-600 rounded"
                                                />
                                                <label htmlFor="selectAllLoans" className="text-xs text-gray-400 font-medium cursor-pointer">
                                                    Select All
                                                </label>
                                            </div>
                                        )}
                                        <span className="text-sm font-bold text-gray-600">
                                            Total: {formatCurrency(activeLoans.reduce((acc, l) => acc + l.amount, 0))}
                                        </span>
                                    </div>
                                </div>
                            }>
                                {isLoanSourcesOpen && (
                                    <div className="space-y-2 animation-fade-in">
                                        <p className="text-xs text-gray-500 mb-3">Select which loan sources to include in the calculation. All are treated as assigned loans from their original date.</p>
                                        {loanSources.map(source => {
                                            // Calculate total for this source from RAW data
                                            const sourceLoans = rawTransactions.filter(l => l.source === source);

                                            // Apply SAME logic as activeLoans: Invert the DB amount.
                                            // DB: Credit (Loan) = Negative. Debit (Repayment) = Positive.
                                            // View: Loan = Positive. Repayment = Negative.
                                            // So we Sum (Debit - Credit) then Invert.
                                            const rawSum = sourceLoans.reduce((a, b) => a + b.amount, 0);
                                            const sourceTotal = -rawSum;

                                            const isEnabled = enabledSources.includes(source);
                                            return (
                                                <label key={source} className={`flex items-center justify-between p-3 rounded-lg border cursor-pointer transition-all ${isEnabled ? 'bg-blue-50 border-blue-200' : 'bg-gray-50 border-gray-200 opacity-60'}`}>
                                                    <div className="flex items-center gap-3">
                                                        <input
                                                            type="checkbox"
                                                            checked={isEnabled}
                                                            onChange={() => toggleSource(source)}
                                                            className="w-4 h-4 text-blue-600 rounded"
                                                        />
                                                        <span className="text-sm font-medium text-gray-700">{source}</span>
                                                    </div>
                                                    <span className={`text-sm font-mono ${isEnabled ? 'text-blue-700' : 'text-gray-400'}`}>
                                                        {formatCurrency(sourceTotal)}
                                                    </span>
                                                </label>
                                            );
                                        })}
                                    </div>
                                )}
                                {!isLoanSourcesOpen && (
                                    <div className="text-sm text-gray-400 italic">
                                        {enabledSources.length} sources selected. Click "Expand" to modify selection.
                                    </div>
                                )}
                            </Card>

                            {/* DEEDS MANAGER CARD */}
                            <Card title="Deeds of Assignment">
                                <div className="mb-4 pb-4 border-b border-gray-100">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Auto-Assign Loans After
                                    </label>
                                    <p className="text-xs text-gray-500 mb-2">Loans provided after this date are automatically treated as assigned immediately.</p>
                                    <input
                                        type="date"
                                        value={autoAssignmentDate}
                                        onChange={(e) => setAutoAssignmentDate(e.target.value)}
                                        className="w-full text-sm border border-gray-300 rounded-lg p-2"
                                    />
                                </div>
                                <DeedsManager deeds={deeds} onChange={setDeeds} />
                            </Card>
                        </div>

                        {/* RIGHT: Visuals (8 cols) */}
                        <div className="lg:col-span-8 space-y-8">

                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                                <h3 className="text-lg font-semibold text-gray-800 mb-6">Wealth Retention Analysis</h3>
                                <div className="grid grid-cols-2 gap-8 text-center items-center">
                                    <div className="space-y-1">
                                        <div className="text-sm text-gray-500 uppercase tracking-wide">Net Wealth to Heirs</div>
                                        <div className="text-2xl font-bold text-emerald-600">{formatCurrency(calculations.currentStrategy.wealth)}</div>
                                    </div>
                                    <div className="space-y-1">
                                        <div className="text-sm text-gray-500 uppercase tracking-wide">Total Tax Liability</div>
                                        <div className="text-2xl font-bold text-red-600">{formatCurrency(calculations.currentStrategy.tax)}</div>
                                    </div>
                                </div>
                            </div>

                            <Card title="Detailed Breakdown (By Assignment)">
                                <div className="space-y-8">
                                    {/* DEED GROUPS */}
                                    {allocation.deedBuckets.map(bucket => {
                                        // HIDE EMPTY AUTO-DEEDS
                                        // If a virtual deed wasn't used (e.g. loan assigned to earlier manual deed), don't show it.
                                        if (bucket.isAuto && bucket.assignedLoans.length === 0) return null;

                                        // Group bucket items by Year
                                        const byYear = bucket.assignedLoans.reduce((acc, item) => {
                                            acc[item.year] = acc[item.year] || [];
                                            acc[item.year].push(item);
                                            return acc;
                                        }, {});
                                        const years = Object.keys(byYear).sort();
                                        const totalAssigned = bucket.assignedLoans.reduce((a, b) => a + b.amount, 0);
                                        const totalTax = bucket.assignedLoans.reduce((a, b) => a + (b.taxableValue || 0), 0);

                                        return (
                                            <div key={bucket.id} className="border border-blue-200 rounded-lg overflow-hidden">
                                                <div className="bg-blue-50 px-4 py-3 border-b border-blue-200 flex justify-between items-center">
                                                    <div>
                                                        <span className="font-bold text-blue-800">Deed {bucket.date}</span>
                                                        <span className="text-xs text-blue-600 ml-2">({formatCurrency(totalAssigned)} assigned)</span>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="block text-xs text-blue-800 font-bold">Tax: {formatCurrency(totalTax)}</span>
                                                        <span className="text-xs text-blue-600">Taper Start: {bucket.date.split('-')[0]}</span>
                                                    </div>
                                                </div>
                                                <div className="bg-white">
                                                    {years.map(year => (
                                                        <div key={year} className="border-b border-gray-100 last:border-0">
                                                            <div className="px-4 py-2 bg-gray-50 text-xs font-bold text-gray-500">{year}</div>
                                                            {byYear[year].map((item, idx) => (
                                                                <div key={idx} className="px-4 py-2 flex justify-between items-center hover:bg-gray-50 text-sm">
                                                                    <div className="flex-1 truncate pr-4">
                                                                        {item.source}
                                                                        <span className="text-xs text-gray-400 ml-2 font-mono">
                                                                            ({item.originalLoan.fullDate || 'No Date'})
                                                                        </span>
                                                                    </div>
                                                                    <div className="text-right flex items-center gap-6">
                                                                        <span className="font-mono">{formatCurrency(item.amount)}</span>
                                                                        <span className="font-mono text-red-600 w-24 text-right">{formatCurrency(item.taxableValue)}</span>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    ))}
                                                    {years.length === 0 && <div className="p-4 text-center text-gray-400 italic">No loans assigned to this deed.</div>}
                                                    <div className="bg-gray-50 border-t border-gray-200 px-4 py-3 flex justify-between items-center font-bold text-sm text-gray-800">
                                                        <span>Total Assigned to Deed</span>
                                                        <span className="font-mono">{formatCurrency(totalAssigned)}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {/* UNASSIGNED GROUP */}
                                    <div className="border border-red-200 rounded-lg overflow-hidden">
                                        <div className="bg-red-50 px-4 py-3 border-b border-red-200 flex justify-between items-center">
                                            <div>
                                                <span className="font-bold text-red-800">Unassigned Loans (Estate)</span>
                                                <span className="text-xs text-red-600 ml-2">
                                                    ({formatCurrency(allocation.unassignedLoans.reduce((a, b) => a + b.amount, 0))})
                                                </span>
                                            </div>
                                            <div className="text-right">
                                                <span className="block text-xs text-red-800 font-bold">Tax: {formatCurrency(allocation.unassignedLoans.reduce((a, b) => a + (b.taxableValue || 0), 0))}</span>
                                                <span className="text-xs text-red-600">No Relief</span>
                                            </div>
                                        </div>
                                        <div className="bg-white">
                                            {/* Group Unassigned by Year */}
                                            {(() => {
                                                const byYear = allocation.unassignedLoans.reduce((acc, item) => {
                                                    acc[item.year] = acc[item.year] || [];
                                                    acc[item.year].push(item);
                                                    return acc;
                                                }, {});
                                                const years = Object.keys(byYear).sort();

                                                if (years.length === 0) return <div className="p-4 text-center text-gray-400 italic">All loans successfully assigned.</div>;

                                                return years.map(year => (
                                                    <div key={year} className="border-b border-gray-100 last:border-0">
                                                        <div className="px-4 py-2 bg-gray-50 text-xs font-bold text-gray-500">{year}</div>
                                                        {byYear[year].map((item, idx) => (
                                                            <div key={idx} className="px-4 py-2 flex justify-between items-center hover:bg-gray-50 text-sm">
                                                                <div className="flex-1 truncate pr-4">
                                                                    {item.source}
                                                                    <span className="text-xs text-gray-400 ml-2 font-mono">
                                                                        ({item.originalLoan.fullDate || 'No Date'})
                                                                    </span>
                                                                </div>
                                                                <div className="text-right flex items-center gap-6">
                                                                    <span className="font-mono">{formatCurrency(item.amount)}</span>
                                                                    <span className="font-mono text-red-600 w-24 text-right">{formatCurrency(item.taxableValue)}</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ));
                                            })()}
                                        </div>
                                    </div>

                                    {/* EQUITY GROUP */}
                                    <div className="border border-gray-200 rounded-lg overflow-hidden opacity-75">
                                        <div className="bg-gray-50 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                                            <div>
                                                <span className="font-bold text-gray-800">Net Equity</span>
                                                <span className="text-xs text-gray-600 ml-2">
                                                    ({formatCurrency(calculations.netCashFromCompany - activeLoans.reduce((a, b) => a + b.amount, 0))})
                                                </span>
                                            </div>
                                            <div className="text-right">
                                                <span className={`block text-xs font-bold ${calculations.equityTax === 0 && areSharesOwnedByHeirs ? 'text-green-600' : 'text-red-800'}`}>
                                                    {calculations.equityTax === 0 && areSharesOwnedByHeirs ? 'Exempt (Shares)' : `Tax: ${formatCurrency(calculations.equityTax)}`}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </Card>

                            {showMath && <MathWalkthrough calc={calculations} inputs={{ salePrice, devCosts, saleYear, deathYear, loans: activeLoans, insurance, allocation, areSharesOwnedByHeirs }} getTaper={getTaperRate} />}

                        </div >
                    </div >
                </div >
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <script>
        if (typeof firebase !== 'undefined') {
            // Already initialized in head

            firebase.auth().onAuthStateChanged((user) => {
                const overlay = document.getElementById('loading-overlay');
                const root = document.getElementById('root');

                if (user) {
                    // Authenticated
                    setTimeout(() => {
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 500);
                        root.style.display = 'block';
                    }, 800);
                } else {
                    // Redirect to login (root directory)
                    window.location.href = '../login.html';
                }
            });
        } else {
            console.error("Firebase SDK or Config missing");
            alert("Error: Could not load authentication configuration. Check your network or file paths.");
        }
    </script>
</body>

</html>
